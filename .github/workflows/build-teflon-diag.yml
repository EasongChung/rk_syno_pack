name: build-teflon-diag

# 【修复+调试专用】交叉编译带 v7 depthwise 修复、**保留 DWARF** 的 libteflon.so
#
# ⚠️⚠️ 本 workflow 产出的 .so **绝不可交付/部署为生产物**：
#   1) 它改了 calculate_bias_correction() 的扫描长度（v8 特判 backport 到 v7）；
#   2) 它保留调试段，体积大数倍（TEFLON_NO_STRIP=1）。
#   唯一用途：**真机归因**。addr2line 定位到源码行后，修复逻辑才谈得上并入生产。
#
# 与生产构建的分工（必须分离，避免拿错产物）：
#   build-teflon.yml       -> artifact `libteflon-aarch64-glibc`（生产，干净，已 strip）
#   build-teflon-diag.yml  -> artifact `libteflon-diag`           （修复+调试，不可交付）
#
# 开关：
#   TEFLON_FIX_V7=1      -> 打 patch-etnaviv-v7-biasfix.py（v8 depthwise 特判 backport）
#   TEFLON_DEBUG_INFO=1  -> c_args/cpp_args 追加 -g3
#   TEFLON_NO_STRIP=1    -> 第 6 步跳过 strip，**保留 .debug_* 段**（addr2line 的前提）
#   TEFLON_DIAG          -> **不启用**。诊断（钳界取证）已被静态分析取代；钳界会掩盖后续问题。
#   注：TEFLON_DIAG 与 TEFLON_FIX_V7 语义互斥（改同一函数），build-teflon.sh 会硬拦。
#
# ⚠️ 触发方式：**仅 workflow_dispatch**（och 第 22 轮要求）。
#   去掉 push 触发，避免「改 build-teflon.sh 时与生产 workflow 同时跑」的问题。
#
# 历史（别重走）：
#   - 第 1 轮 heredoc bug：把 shell 控制流写进了 cross.ini，构建"看起来 success"
#     却产出损坏产物 → 由此加了「三行断言」硬门。
#   - 第 2 轮（stripped .so）：`readelf -S | grep debug` 为 ABSENT，addr2line 无从下手
#     → 由此加了 TEFLON_NO_STRIP，并把 `.debug_info` 升为**硬门**（不是可选项）。
#   - 第 3 轮真机：修复版仍 SIGSEGV，且 `[och-fix]` 日志证明 depthwise 特判在此
#     调用点不生效（depthwise=0, buggy_bound=48 ≪ wt_size=1152）
#     → **「v7 缺 depthwise 特判」这一根因判断被证伪**，不再靠反汇编猜函数，
#     直接用 DWARF 拿源码行。

on:
  workflow_dispatch:
    inputs:
      mesa_tag:
        description: 'Mesa tag（需带 vendored TFLite 头，最低 24.1.0）'
        required: false
        default: 'mesa-26.2.5'
      fault_addrs:
        description: '要做 addr2line 归因的 .text vaddr 列表（逗号分隔，0x 前缀）'
        required: false
        default: '0x256a60,0x256a4c,0x256a54,0x256a58,0x256a5c,0x256a64,0x256a74,0x256a78,0x256a80,0x255710,0x256a30,0x256cc0'

env:
  # 必须在 workflow 级：Collect artifact 步骤也要读它，否则会写出假标签。
  MESA_TAG: ${{ github.event.inputs.mesa_tag || 'mesa-26.2.5' }}
  TEFLON_FIX_V7: '1'
  TEFLON_WCDIAG: '1'
  TEFLON_DIAG: '0'
  TEFLON_DEBUG_INFO: '1'
  TEFLON_NO_STRIP: '1'

jobs:
  build:
    name: build libteflon.so FIX_V7+NOSTRIP (aarch64-glibc, NOT deliverable)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps (amd64 only)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            pkg-config \
            meson ninja-build \
            python3 python3-pip \
            python3-mako python3-yaml \
            bison flex \
            patchelf \
            ca-certificates curl wget git binutils

      - name: Install meson >= 1.4 (Mesa 26.x requirement)
        run: |
          set -eux
          python3 -m pip install --user --break-system-packages "meson>=1.4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          meson --version

      - name: Install pycparser
        run: python3 -m pip install --break-system-packages "pycparser>=2.20"

      - name: Verify toolchain
        run: |
          set -eux
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-gcc -dumpmachine
          aarch64-linux-gnu-addr2line --version | head -1
          meson --version
          ninja --version
          python3 -c "import mako, yaml, pycparser; print('python deps OK')"

      # 预检：修复补丁的三种行为必须正确（正常注入 / 防重入 / 锚点缺失拒绝）。
      # 样例与 Mesa 真实形态逐字节一致（含 const 参数、整行 for）。
      - name: Preflight - v7 biasfix patcher self-test
        run: |
          set -eux
          python3 - <<'PY'
          import os, shutil, subprocess, sys, tempfile

          # 与 patch-etnaviv-v7-biasfix.py 的 OLD 模板逐字节一致
          FUNC = (
              'static uint32_t\n'
              'calculate_bias_correction(uint8_t *weights, const struct etna_operation *operation)\n'
              '{\n'
              '   int32_t correction = 0;\n'
              '\n'
              '   for (unsigned i = 0; i < operation->weight_width * operation->weight_height * operation->input_channels; i++) {\n'
              '      correction += (weights[i] - operation->weight_zero_point) * operation->input_zero_point;\n'
              '   }\n'
              '\n'
              '   return correction;\n'
              '}\n')
          BAD = ('static uint32_t\n'
                 'calculate_bias_correction(uint8_t *w, const struct op *o)\n'
                 '{\n   int32_t c = 0;\n   return c;\n}\n')

          P = 'oes-teflon/build-recipe/patch-etnaviv-v7-biasfix.py'
          tmp = tempfile.mkdtemp()
          try:
              p = os.path.join(tmp, 'v7.c')
              open(p, 'w').write(FUNC)
              r = subprocess.run([sys.executable, P, p], capture_output=True, text=True, encoding='utf-8', errors='replace')
              assert r.returncode == 0, 'inject failed: %s' % (r.stdout + r.stderr)
              b = open(p).read()
              for needle in ('och patch: v7 calculate_bias_correction depthwise fix',
                             'if (operation->depthwise)',
                             'operation->addition',
                             'och_buggy_bound', 'och_bound'):
                  assert needle in b, 'missing %r' % needle
              assert '%%u' not in b, 'double-percent left in C string'
              # 不得对 const 成员赋值（上轮 diag 补丁的编译错误）
              for ln in b.splitlines():
                  s = ln.strip()
                  if s.startswith('operation->') and '=' in s and '==' not in s:
                      raise AssertionError('assigns const member: %s' % s)
              r2 = subprocess.run([sys.executable, P, p], capture_output=True, text=True, encoding='utf-8', errors='replace')
              assert r2.returncode == 1, 're-apply not rejected'
              pb = os.path.join(tmp, 'bad.c')
              open(pb, 'w').write(BAD)
              r3 = subprocess.run([sys.executable, P, pb], capture_output=True, text=True, encoding='utf-8', errors='replace')
              assert r3.returncode == 1, 'anchor-miss not rejected'
              print('PREFLIGHT v7-biasfix OK (inject / no-const-write / reapply / anchor-miss)')
          finally:
              shutil.rmtree(tmp, ignore_errors=True)
          PY

      - name: Preflight - write_core_interleaved diag patcher self-test
        run: |
          set -eux
          python3 - <<'PY'
          import importlib.util, os, re, shutil, subprocess, sys, tempfile

          P = 'oes-teflon/build-recipe/patch-etnaviv-write-core-diag.py'
          spec = importlib.util.spec_from_file_location('wcdiag', P)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)          # 只定义 main()，不会自动执行
          OLD, NEW, MARKER = m.OLD, m.NEW, m.MARKER

          # 锚点必须是「两行」：for 头 + wb_stream_write
          assert OLD.count('for (unsigned y = 0; y < stride; y++) {') == 1, OLD
          assert OLD.count('wb_stream_write(&wb_stream, weights_map[out_channel][z][x][y]);') == 1, OLD
          assert OLD.endswith('\n') and OLD.count('\n') == 2, repr(OLD)

          # NEW must insert before wb_stream_write and keep the crashing line verbatim
          assert NEW.startswith(OLD.split('\n')[0] + '\n'), 'for 头被破坏'
          assert 'wb_stream_write(&wb_stream, weights_map[out_channel][z][x][y]);' in NEW
          assert NEW.count('wb_stream_write(&wb_stream, weights_map[out_channel][z][x][y]);') == 1
          # the print must sit IMMEDIATELY before the crashing line, else the "logged before crash" premise breaks
          pre, post = NEW.split('wb_stream_write(&wb_stream, weights_map[out_channel][z][x][y]);')
          assert pre.rstrip().endswith(': "");'), repr(pre[-48:])  # 插入块必须以三元 printf 收尾
          assert '[och-wc]' in pre

          # vararg 一致性：格式符个数 == 参数个数（差一个就读到垃圾值）
          _close = ': "");'   # fprintf 收尾标记
          fmts = NEW.count('%u') + NEW.count('%s')
          _c = NEW.index('core, kernel')
          _e = NEW.index(': "");', _c)   # 截止到 fprintf 收尾，别把后面的崩溃行算进来
          tail = NEW[_c:_e]
          args = tail.count(',') + 1
          assert fmts == args, '格式符 %d != 参数 %d' % (fmts, args)
          print('PREFLIGHT wcdiag: formats=%d args=%d OK' % (fmts, args))

          # 括号/引号配平 —— 只在**插入段内**检查：NEW 是代码片段不是完整块，
          # for 的收尾 } 在后面的崩溃行上，对整段数花括号必然假失衡。
          _ins = NEW[NEW.index(MARKER):NEW.index(_close) + len(_close)]
          for _a, _b in (('(', ')'), ('{', '}'), ('"', '"')):
              assert _ins.count(_a) == _ins.count(_b), \
                  'unbalanced %s%s in inserted block: %d vs %d' % (
                      _a, _b, _ins.count(_a), _ins.count(_b))
          assert '{' not in _ins, 'patch must not introduce braces'
          assert '%%u' not in NEW, 'double-percent left in C string'

          # 幂等 + 锚点缺失
          tmp = tempfile.mkdtemp()
          try:
              p = os.path.join(tmp, 'v7.c')
              open(p, 'w').write(OLD)
              r = subprocess.run([sys.executable, P, p], capture_output=True, text=True, encoding='utf-8', errors='replace')
              assert r.returncode == 0, 'inject failed: %s' % (r.stdout + r.stderr)
              assert '[och-wc]' in open(p).read()
              r2 = subprocess.run([sys.executable, P, p], capture_output=True, text=True, encoding='utf-8', errors='replace')
              assert r2.returncode == 1, 're-apply not rejected'
              pb = os.path.join(tmp, 'bad.c')
              open(pb, 'w').write('static void f(void) { }\n')
              r3 = subprocess.run([sys.executable, P, pb], capture_output=True, text=True, encoding='utf-8', errors='replace')
              assert r3.returncode == 1, 'anchor-miss not rejected'
              print('PREFLIGHT wcdiag OK (anchor / balanced / vararg / reapply / anchor-miss)')
          finally:
              shutil.rmtree(tmp, ignore_errors=True)
          PY

      - name: Build libteflon.so (FIX_V7 + WCDIAG + NO_STRIP)
        run: |
          set -eux
          chmod +x oes-teflon/build-recipe/build-teflon.sh
          echo "TEFLON_FIX_V7=${TEFLON_FIX_V7} TEFLON_DIAG=${TEFLON_DIAG} TEFLON_DEBUG_INFO=${TEFLON_DEBUG_INFO} TEFLON_NO_STRIP=${TEFLON_NO_STRIP}"
          ./oes-teflon/build-recipe/build-teflon.sh "$RUNNER_TEMP/teflon-build" 2>&1 \
            | tee "$RUNNER_TEMP/build-diag.log"

      # ★ 硬门（och 第 23 轮要求，四条缺任一条即失败）：
      #   1) [och-fix] 已修复   —— 证明修复补丁真的进了源码
      #   2) 调试信息：开启（-g3）—— 证明 DWARF 被请求
      #   3) strip：跳过（保留调试段 —— 证明 DWARF 没被 strip 删掉
      #   历史教训：构建成功 ≠ 产物可用（heredoc bug / strip 吃掉 debug 段各一次）。
      - name: Assert switches actually took effect
        run: |
          set -eux
          L="$RUNNER_TEMP/build-diag.log"
          ok=1
          for pat in '调试信息：开启（-g3）' \
                     '[3e/6] 打【修复】v7' \
                     '[och-fix] 已修复 v7 calculate_bias_correction' \
                     '[3f/6] 打【诊断】write_core_interleaved' \
                     '[och-wc] 已注入 out_channel 诊断' \
                     'strip：跳过（保留调试段'; do
            if grep -qF "$pat" "$L"; then
              echo "  OK: $pat"
            else
              echo "  ERROR: 构建日志里缺少「$pat」"
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "  ---- 相关日志片段 ----"
            grep -nE '3b/6|3c/6|3d/6|3e/6|och-fix|och-diag|调试信息|strip|TEFLON_' "$L" || true
            exit 1
          fi
          echo "ALL SWITCH ASSERTIONS PASSED"

      - name: Build device-side dlopen tester
        run: |
          set -eux
          SR="$RUNNER_TEMP/teflon-build/sysroot"
          aarch64-linux-gnu-gcc -O2 --sysroot="$SR" \
            -isystem "$SR/usr/include/aarch64-linux-gnu" \
            -isystem "$SR/usr/include" \
            -B "$SR/usr/lib/aarch64-linux-gnu/" \
            -L "$SR/usr/lib/aarch64-linux-gnu" \
            -o "$RUNNER_TEMP/teflon_dlopen" \
            oes-teflon/verify/teflon_dlopen.c \
            "$SR/lib/aarch64-linux-gnu/libdl.so.2" \
            "$SR/lib/aarch64-linux-gnu/libc.so.6"
          readelf -h "$RUNNER_TEMP/teflon_dlopen" | grep Machine

      # ---- 产物核验 ----
      - name: Verify artifact + embedded fix strings + DWARF gate
        run: |
          set -eux
          SO="$RUNNER_TEMP/teflon-build/out/libteflon.so"
          test -f "$SO" || { echo "ERROR: 产物不存在: $SO"; exit 1; }
          echo "=== ELF header ==="
          readelf -h "$SO" | grep -E 'Class|Type|Machine'
          echo "=== NEEDED ==="
          readelf -d "$SO" | grep NEEDED || true
          readelf -d "$SO" | grep -q musl && { echo "ERROR: 有 musl 依赖"; exit 1; } || true
          echo "=== RUNPATH ==="
          readelf -d "$SO" | grep -E 'RUNPATH|RPATH' || true
          echo "=== delegate ABI ==="
          readelf -sW "$SO" | grep -E 'tflite_plugin_(create|destroy)_delegate'
          echo "=== .debug_* sections ==="
          readelf -S "$SO" | grep -oE '\.debug_[a-z_]+' | sort -u | tr '\n' ' '; echo
          # ★ 硬门：.debug_info 是**验收项**（och 第 23 轮），缺了这份产物就不能用。
          if ! readelf -S "$SO" | grep -q '\.debug_info'; then
            echo "ERROR: 产物没有 .debug_info —— addr2line 归因不可用，本产物作废"
            exit 1
          fi
          echo "DEBUG-SECTIONS: PRESENT (.debug_info 已确认)"
          # .debug_line 也要有：addr2line 出文件:行靠的就是它
          readelf -S "$SO" | grep -q '\.debug_line' \
            || { echo "ERROR: 缺 .debug_line（addr2line 无法给出行号）"; exit 1; }
          echo "DEBUG-LINE: PRESENT"
          echo "=== 修复代码是否真编进二进制 ==="
          strings -a "$SO" | grep -qF 'calc_bias_correction depthwise' \
            || { echo "ERROR: 修复代码没有进入二进制，上机验证将毫无意义"; exit 1; }
          echo "STRING-CHECK: fix printf present  <- 修复代码已编入"
          strings -a "$SO" | grep -qF 'still OOB after fix' \
            && echo "STRING-CHECK: OOB warning string present"
          # out_channel 取证补丁是否真进了二进制（日志能打出来也可能被后续步骤丢掉）
          strings -a "$SO" | grep -qF '[och-wc]' \
            || { echo "ERROR: out_channel 取证代码没有进入二进制，上机拿不到 [och-wc] 数字"; exit 1; }
          echo "STRING-CHECK: [och-wc] present  <- out_channel 取证已编入"

      # ★ addr2line 归因：在 CI 里就把「哪个源码行」算出来。
      #   动机：unstripped .so 体积是 stripped 的数倍，而 oca→och 的大文件传递
      #   目前不稳。与其传 100 MB 二进制，不如在这里出**几 KB 的结论**。
      #   地址清单由 workflow_dispatch 输入 fault_addrs 给，改地址不必改 workflow。
      #
      # ⚠️★ 血泪教训（2026-10-17 第一轮）：调用方（Windows PowerShell）会把命令行里
      #   的 `0x256a4c` 当成**十六进制数字字面量**并转成十进制再传给 gh，
      #   于是 12 个地址里只有第 1 个带 0x 前缀是对的，其余全查了错地址，
      #   addr2line 老老实实返回 `??:0`，**步骤照样 success** —— 典型的假绿。
      #   对策有两层：① 调用侧必须把 fault_addrs 整体加引号；
      #              ② 本步骤**独立校验**每个地址都落在 .text 内，越界即失败。
      #                 不依赖调用方传对 —— 这是本次唯一能防住复发的东西。
      - name: addr2line attribution for fault addresses
        env:
          ADDRS: ${{ github.event.inputs.fault_addrs }}
        run: |
          set -eu
          SO="$RUNNER_TEMP/teflon-build/out/libteflon.so"
          MAP="$RUNNER_TEMP/addr2line-map.txt"
          
          # .text 范围只作**参考信息**，不参与判定（见文件头注释里的两次翻车记录）。
          # 改成「按名字找、再取其后第 2/第 4 个字段」，不依赖列号；
          # 解析不到就留 unknown，绝不让参考信息变成失败原因。
          TEXT_HEX=$(readelf -SW "$SO" 2>/dev/null | awk '
            { for (i = 1; i <= NF; i++) if ($i == ".text") { print $(i+2), $(i+4); exit } }')
          TEXT_RANGE="unknown"
          if [ -n "$TEXT_HEX" ]; then
            _a=$(echo "$TEXT_HEX" | cut -d' ' -f1)
            _b=$(echo "$TEXT_HEX" | cut -d' ' -f2)
            case "$_a$_b" in
              ''|*[!0-9a-fA-F]*) ;;
              *)  TEXT_RANGE=$(printf '0x%x..0x%x' "$((16#$_a))" "$((16#$_a + 16#$_b))") ;;
            esac
          fi
          echo "### .text range: $TEXT_RANGE"
          
          # ★ 真正的门：**addr2line 自己必须解析得出这个地址**。
          #   地址越界/无效时它返回 `??` 与 `??:0` —— 那就是「查了个错地址」的信号，
          #   必须失败；绝不能让步骤 success 还带着一行 ?? 交差（这正是第 2 轮的假绿）。
          ADDRS_OK=1
          {
            echo "### addr2line attribution"
            echo "### so=$SO"
            echo "### so_size=$(stat -c%s "$SO")"
            echo "### so_sha256=$(sha256sum "$SO" | cut -d' ' -f1)"
            echo "### text_range=$TEXT_RANGE"
            echo
          
            for tok in $(echo "$ADDRS" | tr ',' ' '); do
              # ★★ 格式契约：**必须带 0x 前缀**。本地反例测试证明「兼容裸数字」等于门失效：
              #   PowerShell 会把命令行里的 0x256a4c 转成十进制 2452044；若再 printf '%x'
              #   转回去又是 0x256a4c，仍落在合法区间 —— 变形输入被「洗白」通过。
              case "$tok" in
                0x*|0X*) HEXV="${tok#0x}" ;;
                *)  echo "ERROR: address lacks 0x prefix: $tok"
                    echo "       raw input: $ADDRS"
                    echo "       if you passed a correct address and got rejected, the caller likely"
                    echo "       turned 0x.. into decimal (PowerShell does this on the command line)."
                    echo "       Quote the whole value: -f 'fault_addrs=0x256a60,0x256a4c'"
                    ADDRS_OK=0; break ;;
              esac
              case "$HEXV" in
                *[!0-9a-fA-F]*|'')
                  echo "ERROR: not a valid hex address: $tok"; ADDRS_OK=0; break ;;
              esac
              A="$HEXV"
              echo "=== 0x$A (decimal $((16#$A))) ==="
              echo "-- addr2line -f -i -C:"
              # 抓输出再判定，而不是直接打 —— 只有拿到结果才能判断「解析不出来」
              AL_OUT=$(aarch64-linux-gnu-addr2line -f -i -C -e "$SO" "0x$A" 2>&1) || true
              printf '%s\n' "$AL_OUT" | sed 's/^/   /'
              # addr2line 输出两行（函数名、文件:行）。两行都是 ?? 即视为无效地址。
              if printf '%s\n' "$AL_OUT" | grep -qx '??' \
                 && printf '%s\n' "$AL_OUT" | grep -q '^??:'; then
                echo "ERROR: addr2line could not resolve 0x$A (returned ??) -- address is most"
                echo "       likely outside .text (caller turned 0x.. into decimal, or this"
                echo "       build's patch changed the code layout)."
                echo "       raw input: $ADDRS"
                ADDRS_OK=0; break
              fi
              echo "-- nearest symbol (.symtab):"
              # ⚠️ 这一段是**装饰性**的（DWARF 已经给出函数名）。若 nm 缺失或失败，
              #   不该让 set -e 把整个步骤连同真正的门一起杀掉 —— 本机 harness 就撞到过。
              python3 - "$SO" "$A" <<'PY' || echo "   (nearest-symbol lookup failed; non-fatal)"
          import subprocess, sys
          so = sys.argv[1]
          a = int(sys.argv[2], 16)
          best = None
          out = subprocess.run(['aarch64-linux-gnu-nm', '-n', '--defined-only', so],
                               capture_output=True, text=True,
                               encoding='utf-8', errors='replace').stdout
          for ln in out.splitlines():
              p = ln.split()
              if len(p) >= 3 and p[1].upper() in ('T', 'W', 'I'):
                  v = int(p[0], 16)
                  if v <= a and (best is None or v > best[0]):
                      best = (v, p[2])
          print('   %s +0x%x  (delta=%d bytes)' % (best[1], best[0], a - best[0])
                if best else '   (no symbol <= addr found)')
          PY
              echo
            done
          } > "$MAP"
          
          cat "$MAP"
          echo "WROTE $MAP ($(wc -l < "$MAP") lines)"
          if [ "$ADDRS_OK" != 1 ]; then
            echo "ADDRES GATE FAILED"
            exit 1
          fi
          echo "ADDRES GATE PASSED"
      # 反汇编 + **源码文本**窗口（-S 需要 Mesa 源码树在同一 comp_dir，故先 cd 过去）。
      # ⚠️ continue-on-error: true —— 上一轮这一步因为地址格式崩掉，**连带把
      #    artifact 收集也带没了**（关键证据 addr2line 已到手却传不下去）。
      #    装饰性步骤绝不允许阻塞产物上传。
      - name: Disassembly window with interleaved source
        continue-on-error: true
        env:
          ADDRS: ${{ github.event.inputs.fault_addrs }}
        run: |
          SO="$RUNNER_TEMP/teflon-build/out/libteflon.so"
          MAP="$RUNNER_TEMP/disasm-window.txt"
          read -r TOKS <<< "$ADDRS"
          TOK="${TOKS%%[ ,]*}"
          case "$TOK" in 0x*|0X*) HEXV="${TOK#0x}" ;; *) HEXV=$(printf '%x' "$TOK") ;; esac
          START=$(printf '0x%x' $((16#$HEXV - 0x40)))
          STOP=$(printf '0x%x' $((16#$HEXV + 0x60)))
          {
            echo "### objdump -dlS --start-address=$START --stop-address=$STOP  (center=0x$HEXV)"
            cd "$RUNNER_TEMP/teflon-build/mesa" || exit 0
            aarch64-linux-gnu-objdump -dlS \
              --start-address="$START" --stop-address="$STOP" "$SO" || \
              echo "(objdump -S failed; DWARF comp_dir 与源码树不一致属正常)"
          } | tee "$MAP"
          exit 0

      - name: Glibc symbol ceiling check (device = 2.36)
        run: |
          set -eu
          CEIL=36
          fail=0
          for f in "$RUNNER_TEMP/teflon-build/out/libteflon.so" \
                   "$RUNNER_TEMP/teflon-build/out/libdrm.so.2" \
                   "$RUNNER_TEMP/teflon_dlopen"; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            max=$(readelf -V "$f" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' \
                  | sort -uV | tail -1 | cut -d. -f2)
            echo "  $name: 最高 GLIBC_2.${max:-?}  (上限 2.$CEIL)"
            if [ -n "$max" ] && [ "$max" -gt "$CEIL" ]; then
              echo "  ERROR: $name 使用 GLIBC_2.$max > 设备 2.$CEIL"; fail=1
            fi
            if readelf -sW "$f" 2>/dev/null | grep -q "__isoc23"; then
              echo "  ERROR: $name 引用了 __isoc23_*（需 GLIBC_2.38+）"; fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "OK: 全部产物符号版本 <= 设备 glibc 2.36"

      - name: Collect artifact (FIX_V7 + DWARF)
        run: |
          set -eux
          OUT="$RUNNER_TEMP/teflon-build/out"
          mkdir -p artifact
          cp "$OUT/libteflon.so" artifact/
          [ -f "$OUT/libdrm.so.2" ] && cp "$OUT/libdrm.so.2" artifact/ \
            || { echo "ERROR: 缺少 libdrm.so.2"; exit 1; }
          cp "$RUNNER_TEMP/teflon_dlopen" artifact/
          cp "$RUNNER_TEMP/build-diag.log" artifact/build-diag.log
          cp "$RUNNER_TEMP/addr2line-map.txt" artifact/addr2line-map.txt
          [ -f "$RUNNER_TEMP/disasm-window.txt" ] && cp "$RUNNER_TEMP/disasm-window.txt" artifact/
          {
            echo "########## FIX_V7 + NO_STRIP BUILD - NOT a production artifact ##########"
            echo "purpose=backport v8 depthwise/addition guard into v7 calculate_bias_correction"
            echo "purpose2=keep DWARF so addr2line can attribute the remaining SIGSEGV"
            echo "TEFLON_FIX_V7=${TEFLON_FIX_V7:-0}  TEFLON_DIAG=${TEFLON_DIAG:-0}"
            echo "teflon_debug_info=${TEFLON_DEBUG_INFO:-0}"
            echo "teflon_no_strip=${TEFLON_NO_STRIP:-0}"
            echo "warning=the patched build CHANGES the scan length for DWCONV (this is the fix)"
            echo "warning2=unstripped => large; never deploy this .so to a device"
            echo "mesa_tag_env=${MESA_TAG:-mesa-26.2.5}"
            BIN_TAG="$(strings -a "$OUT/libteflon.so" \
              | grep -oE '2[0-9]\.[0-9]+\.[0-9]+ \(git-[0-9a-f]+\)' \
              | head -1 | sed 's/ (git-/mesa-/; s/)$/-git/' || true)"
            echo "mesa_tag_binary=${BIN_TAG:-unknown-in-binary}"
            echo "target=aarch64 / glibc 2.31 sysroot (Debian bullseye)"
            echo "toolchain=$(aarch64-linux-gnu-gcc -dumpmachine)"
            echo "device=Synology DSM 7.4.1-90080 / glibc 2.36 / A311D NPU"
            echo "debug_sections=$(readelf -S "$OUT/libteflon.so" | grep -oE '\.debug_[a-z_]+' | sort -u | tr '\n' ' ')"
            echo "build_date=$(date -u +%FT%TZ)"
          } > artifact/BUILD-INFO.txt
          cat artifact/BUILD-INFO.txt
          ( cd artifact && sha256sum libteflon.so libdrm.so.2 teflon_dlopen > SHA256SUMS )
          cat artifact/SHA256SUMS
          echo "=== size ==="
          ls -l artifact/libteflon.so

      - name: Upload artifact (FIX_V7 + DWARF)
        uses: actions/upload-artifact@v4
        with:
          name: libteflon-diag
          path: artifact/
          retention-days: 14
          if-no-files-found: error
