      #   + 与 ROFIX 可同时开」。只查字面量，不判断措辞。
      # ⚠️ 段截取必须在**下一段标题**（`# ── `）或长横线处停下：只认长横线会把后面的段
      #    一起吞进来，而邻居段里往往含本段的关键词 ⇒ 门被喂饱、真正的缺失判不出来。
      - name: Static check - ALIASDIAG docs consistency
        run: |
          set -eu
          python3 - <<'PY'
          import re, sys

          F = 'oes-teflon/build-recipe/build-teflon.sh'
          src = open(F, encoding='utf-8').read()
          fail = []

          cut = src.find('\nset -eu')
          head = src[:cut] if cut > 0 else ''
          m = re.search(r'\n# ── 3k\.[\s\S]*?(?=\n# ── |\n# -{20,})', src)
          sec = m.group(0) if m else ''

          if not head:
              fail.append('取不到头部注释块（set -eu 之前）')
          if not sec:
              fail.append('取不到 3k 段 —— 正则没命中说明门已失效，必须修门而不是放行')

          def need(where, where_name, pat):
              if pat in where:
                  print('  ok(%s): %s' % (where_name, pat))
              else:
                  fail.append('%s 缺少「%s」' % (where_name, pat))

          need(head, '头部', 'TEFLON_ALIASDIAG')
          need(head, '头部', 'gen-aliasdiag-patch.py')
          need(sec, '3k', 'TEFLON_ALIASDIAG')
          need(sec, '3k', 'patch-etnaviv-alias-diag.py')
          need(sec, '3k', '默认关闭')
          need(sec, '3k', '不可交付')
          need(sec, '3k', 'ETNA_MESA_DEBUG=ml_msgs')
          need(sec, '3k', 'reference_tensor_with_offset')
          need(sec, '3k', '可同时开')

          if fail:
              for x in fail:
                  print('  ERROR: ' + x)
              sys.exit(1)
          print('ALIASDIAG-DOCS: PASS')
          PY

      # ★ CREATEDIAG 文档一致性门：3l 步与头部必须写清「取证 + 不可交付 + 上机要设什么
      #   + 与 ROFIX/ALIASDIAG 可同时开」。只查字面量，不判断措辞。
      # ⚠️ 段截取必须在**下一段标题**（`# ── `）或长横线处停下：只认长横线会把后面的段
      #    一起吞进来，而邻居段里往往含本段的关键词 ⇒ 门被喂饱、真正的缺失判不出来。
      - name: Static check - CREATEDIAG docs consistency
        run: |
          set -eu
          python3 - <<'PY'
          import re, sys

          F = 'oes-teflon/build-recipe/build-teflon.sh'
          src = open(F, encoding='utf-8').read()
          fail = []

          cut = src.find('\nset -eu')
          head = src[:cut] if cut > 0 else ''
          m = re.search(r'\n# ── 3l\.[\s\S]*?(?=\n# ── |\n# -{20,})', src)
          sec = m.group(0) if m else ''

          if not head:
              fail.append('取不到头部注释块（set -eu 之前）')
          if not sec:
              fail.append('取不到 3l 段 —— 正则没命中说明门已失效，必须修门而不是放行')

          def need(where, where_name, pat):
              if pat in where:
                  print('  ok(%s): %s' % (where_name, pat))
              else:
                  fail.append('%s 缺少「%s」' % (where_name, pat))

          need(head, '头部', 'TEFLON_CREATEDIAG')
          need(head, '头部', 'gen-creatediag-patch.py')
          need(sec, '3l', 'TEFLON_CREATEDIAG')
          need(sec, '3l', 'patch-etnaviv-create-diag.py')
          need(sec, '3l', '默认关闭')
          need(sec, '3l', '不可交付')
          need(sec, '3l', 'ETNA_MESA_DEBUG=ml_msgs')
          need(sec, '3l', 'etna_ml_create_tensor')
          need(sec, '3l', 'pipe_buffer_size(res)')
          need(sec, '3l', '可同时开')

          if fail:
              for x in fail:
                  print('  ERROR: ' + x)
              sys.exit(1)
          print('CREATEDIAG-DOCS: PASS')
          PY

      - name: Build libteflon.so (FIX_V7 + OCFIX + FSGUARD + ROFIX + PERCHANNEL, UNSTRIPPED)
        run: |
          set -euxo pipefail
          chmod +x oes-teflon/build-recipe/build-teflon.sh
          echo "TEFLON_FIX_V7=${TEFLON_FIX_V7} TEFLON_OCFIX=${TEFLON_OCFIX} TEFLON_FSGUARD=${TEFLON_FSGUARD} TEFLON_ROFIX=${TEFLON_ROFIX} TEFLON_ALIASDIAG=${TEFLON_ALIASDIAG} TEFLON_CREATEDIAG=${TEFLON_CREATEDIAG} TEFLON_DIAG=${TEFLON_DIAG} TEFLON_WCDIAG=${TEFLON_WCDIAG} TEFLON_DEBUG_INFO=${TEFLON_DEBUG_INFO} TEFLON_NO_STRIP=${TEFLON_NO_STRIP} TEFLON_PHANTOM_CLAMP=${TEFLON_PHANTOM_CLAMP:-0} TEFLON_PHANTOM_GATE=${TEFLON_PHANTOM_GATE:-0} TEFLON_RODIAG=${TEFLON_RODIAG:-0}"
          ./oes-teflon/build-recipe/build-teflon.sh "$RUNNER_TEMP/teflon-build" 2>&1 \
            | tee "$RUNNER_TEMP/build-fix.log"

      # ★ 硬门（源码级）：布局补丁的四处改动必须**真的**落在被打过补丁的源文件里。
      #   「构建成功」证明不了这一点 —— 补丁器即使打歪了（少了某处替换）也能编过，
      #   而症状要到设备上才表现为 SIGSEGV 或静默错误。
      #   这里是 build-teflon.sh 里锚点复核之外的第二道：直接读**打完补丁的**源文件。
      - name: Assert per-channel patch actually applied (source-level，layout 或 fold-early)
        run: |
          set -eu
          SRC="$RUNNER_TEMP/teflon-build/mesa/src/gallium/drivers/etnaviv"
          NN="$SRC/etnaviv_ml_nn.c"
          V7="$SRC/etnaviv_ml_nn_v7.c"
          for f in "$NN" "$V7"; do
            [ -f "$f" ] || { echo "ERROR: 找不到 $f"; exit 1; }
          done
          ok=1
          chk() {
            n=$(grep -cF -- "$2" "$3" || true)
            if [ "$n" -ne "$1" ]; then
              echo "FAIL: $4 —— 实得 $n，期望 $1"
              ok=0
            else
              echo "OK:   $4（$n）"
            fi
          }
          if [ "${TEFLON_PERCHANNEL_FOLDEARLY:-0}" = "1" ]; then
            # ── fold-early 形态（报告 55 方案 A）──────────────────────────
            # 与 layout 形态**互斥**：两边各有正控制，并且都断言对方的标记缺席。
            # 折叠提前后 requantize_weights 被整函数重写 ⇒ 旧的 `real_in/out_dim`
            # 断言必然为 0；若维持原断言，等于「用旧形态的尺子量新形态」。
            echo "== fold-early 形态断言 =="
            chk 3 'och_fold_channel('       "$NN" 'helper och_fold_channel（定义 1 + 调用 2）'
            chk 1 'och patch: per-channel 折叠提前' "$NN" '折叠块前移标记'
            chk 1 'int32_t och_requant'     "$NN" '域修复（PCDOMAIN）已并入 fold-early'
            chk 1 'getenv("TEFLON_PCDOMAIN")' "$NN" '域修复带运行期门（=0 可与上游逐字节对照）'
            chk 1 '[och-pcdomain]'          "$NN" '域修复编译期标记'
            # ★ 报告 56：折叠域（无符号）与填充点域（weight_signed）必须成对，
            #   否则 expand_depthwise 的背景权重被硬件解释成 -128（真机全 -128 饱和）。
            chk 1 'och patch: 折叠已把权重缓冲区改成**无符号域**' "$NN" '域标志随折叠域清位（报告 56）'
            chk 1 'dense_depthwise=1'       "$V7" '偏置补偿覆盖稠密 W*H*C（报告 56）'
            n_wsel=$(grep -cF 'operation->weight_signed = false;' "$NN" || true)
            if [ "$n_wsel" -ge 2 ]; then
              echo "OK:   清位代码存在（$n_wsel 处 = upstream addition + fold-early）"
            else
              echo "FAIL: 清位代码缺失（$n_wsel < 2）"
              ok=0
            fi
            chk 1 'weights[i] = requantized + operation->weight_zero_point;' "$NN" 'unsigned 分支逐字未变'
            chk 1 'nn_core_version >= 8 && poperation->conv.depthwise' "$NN" 'v8 收口保留（v7 不再写 in_c=1）'
            chk 0 'och-patch-perchannel-layout' "$NN" 'layout 补丁**未**同时存在（互斥）'
            chk 0 'uint8_t (*weights)[real_in]' "$NN" '旧布局读侧不存在'
            chk 0 'uint8_t (*map_out)[out_dim]' "$NN" '旧布局写侧不存在'
            # 顺序断言：折叠块必须在 pointwise_to_2x2 之前（否则又回到「先变换后折叠」）
            a=$(grep -n 'per-channel 折叠提前（fold-early）' "$NN" | head -1 | cut -d: -f1)
            b=$(grep -n 'pointwise_to_2x2(subgraph' "$NN" | head -1 | cut -d: -f1)
            if [ -n "$a" ] && [ -n "$b" ] && [ "$a" -lt "$b" ]; then
              echo "OK:   折叠块在 pointwise_to_2x2 之前（行 $a < $b）"
            else
              echo "FAIL: 折叠块位置不对（折叠=$a，pointwise_to_2x2=$b）"
              ok=0
            fi
          else
          chk 1 'uint8_t (*weights)[real_in]'        "$NN" 'calc_quantization 读侧 real_in'
          chk 1 'uint8_t (*map_in)[real_in]'         "$NN" 'requantize_weights 读侧 real_in'
          chk 1 'uint8_t (*map_out)[out_dim]'        "$NN" 'requantize_weights 写侧 out_dim'
          chk 1 'unsigned src_ic = depthwise ? oc : ic;' "$NN" 'depthwise 对角线取权重'
          chk 0 'nn_core_version >= 8 && poperation->conv.depthwise' "$NN" 'v7 写回条件已去掉'
          # ★ 诊断打印的数量随 TEFLON_PERCHANNEL_DIAG 变（交付模式 diag=0 ⇒ 一处都不该有）
          if [ "${TEFLON_PERCHANNEL_DIAG:-1}" = "1" ]; then exp_pcl=2; else exp_pcl=0; fi
          chk "$exp_pcl" '[och-pcl] SEL'              "$V7" 'v7 两处选路都插了诊断（数量随 diag 开关）'
          fi
          [ "$ok" = 1 ] || { echo "ERROR: per-channel 补丁未完整落地"; exit 1; }
          # 取证：把改后的三个函数原样带走，供 review 与设备侧对撞
          {
            echo "=== calc_quantization / requantize_weights / 写回（etnaviv_ml_nn.c）==="
            sed -n '/^calc_quantization(/,/^}/p' "$NN"
            sed -n '/^requantize_weights(/,/^}/p' "$NN"
            grep -n -A4 'och patch: v7 也要写回' "$NN" || echo "  (fold-early 形态：没有 v7 写回补丁)"
            echo
            echo "=== create_coeffs_v7 选路（etnaviv_ml_nn_v7.c）==="
            grep -n -B2 -A10 'och-pcl\] SEL' "$V7" || echo "  (diag 关闭：v7 里没有 [och-pcl] SEL)"
            echo
            if [ "${TEFLON_PERCHANNEL_FOLDEARLY:-0}" = "1" ]; then
              echo "=== 本轮可证伪预测（fold-early；不符即证伪报告 55）==="
              echo "折叠发生在 pointwise/expand/strided/transpose **之前**"
              echo "RW-OUT new_size == 原始 TFLite 权重字节数（不再缩到 1/C）"
              echo "depthwise 的 input_channels 全程 = C（v7 不再写 1）"
              echo "写路径：out_c % 8 == 0 才干净；否则幻影通道预期（报告 55 §10）"
            else
              echo "=== 本轮可证伪预测（设备上机时应逐条对上；不符即证伪报告 21）==="
              echo "CQ-OUT dw=1 visited=2196   （不是 535824）"
              echo "RW-OUT dw=1 new_size=2196 （不是 535824）"
              echo "SEL    dw=1 input_channels=1 -> write_core_sequential"
            fi
          } > "$RUNNER_TEMP/pcl-evidence.txt"
          cat "$RUNNER_TEMP/pcl-evidence.txt"

      # ★ 硬门：两处修复都必须**真的**打上，否则产物会照旧崩 —— 而「构建成功」看不出来。
      - name: Assert both fixes actually applied
        run: |
          set -eux
          L="$RUNNER_TEMP/build-fix.log"
          ok=1
          # ★★ 断言原文随产物走（och 第四节：证据必须可被独立复核）。
          #   GitHub 的 job 日志有大小上限：run 39211898461 成功，但第 23 步输出在尾部
          #   被截断（实测 `OK: [` 命中 0 次）⇒ 日志侧证据**取不到**；日志还会过期。
          #   ⇒ 整段输出 tee 到文件，由 Collect artifact 带走。
          #
          # ★★★ `exec` 必须放在**整个断言段之前**，且只做一次。
          #   踩过的坑（run 39229309524 的产物实测）：
          #     - exec 写在 for 循环**内部** ⇒ 每轮迭代都重新 tee 一次，
          #       之前的输出被截断冲掉 ⇒ 11 条 `OK:` 只剩最后 1 条；
          #       且多个 tee 进程并发写同一个文件 ⇒ `ALL SWITCH ASSERTIONS PASSED`
          #       出现 22 次（正好是断言条数）⇒ 证据文件是坏的。
          #   「在目标平台上跑过才叫跑过」——这条缺陷只在**产物里**才看得见，
          #   本地任何门都测不到（本地没跑过这段 shell）。
          ASSERT_LOG="$RUNNER_TEMP/teflon-build/step23-assertions.log"
          exec > >(tee "$ASSERT_LOG") 2>&1
          echo "== 断言原文（每条都带实际匹配到的文本）=="
          for pat in '[3e/6] 打【修复】v7' \
                     '[och-fix] 已修复 v7 calculate_bias_correction' \
                     '[3g/6] 打【修复】write_core_interleaved' \
                     '[och-ocfix] 已加 out_channel 尾部越界钳位' \
                     '[och-ocfix] 原式保留未动' \
                     '[3h/6] 打【修复】filter 深度一致性守卫' \
                     '[och-fsguard] 已加 filter 深度一致性守卫' \
                     '[3j/6] 打【修复】read_outputs 范围对齐 invoke + idx 边界检查' \
                     '[och-rofix] 已加 read_outputs 范围对齐' \
                     '[3m/6] 打【修复】per-channel 量化门（只放开 weight/bias）' \
                     '[perchannel] 已放开 weight/bias 的 per-axis 量化接管' \
                     '[3g2/6] 打【修复】幻影通道 out_channel 钳位' \
                     '[phantom-clamp] 已加幻影通道钳位' \
                     '[3h2/6] 打【修复】幻影通道形状门控' \
                     '[och-pgate] 已加幻影通道形状门控'; do

            if grep -qF "$pat" "$L"; then
              echo "  OK: $pat"
            else
              # ★ 有些断言只对**取证变体**成立（CLAMP 等）⇒ 开关关着时跳过，不算失败。
              #   （交付模式 PHANTOM_CLAMP=0 ⇒ 构建日志里当然没有钳位补丁的消息）
              case "$pat" in
                '[3g2/6] 打【修复】幻影通道 out_channel 钳位'|'[phantom-clamp] 已加幻影通道钳位')
                  if [ "${TEFLON_PHANTOM_CLAMP:-0}" != "1" ]; then
                    echo "  ok(skipped): $pat（CLAMP 开关关闭）"
                    continue
                  fi
                  ;;
              esac
              echo "  ERROR: 构建日志里缺少「$pat」"
              ok=0
            fi
          done

          # ★★ 运行期负控制（och 第四节）：反向断言「不出现」必须有**真的**负控制，
          #   不能只是「本地没查」。正向断言全过之后，在**同一份产物**上检索
          #   「诊断补丁若被应用会留下的特征串」——它们必须全部缺席。
          #   可被任何人独立复核：产物会上传，这些特征串是 .rodata 里的明文。
          SO="$RUNNER_TEMP/teflon-build/out/libteflon.so"
          if [ ! -f "$SO" ]; then
            echo "  ERROR: 找不到 $SO —— 运行期负控制**无法执行**，不能算通过"
            ok=0
          else
            for pat in 'och-patch-alias-diag' '[och-alias]' \
                       'och-patch-creatediag' '[och-create]' \
                       '[och-wc]'; do
              if strings -a "$SO" | grep -qF "$pat"; then
                echo "  ERROR: 产物里出现「$pat」—— 诊断开关误开，这不是交付候选产物"
                ok=0
              else
                echo "  OK(.so absent): $pat"
              fi
            done
            # ★ 正向对照：探针本身必须先被证明有效，否则上面那串「都不在」是假绿。
            if strings -a "$SO" | grep -qF 'och-patch-perchannel-quant'; then
              echo "  OK(.so present): och-patch-perchannel-quant（正向对照，探针有效）"
            else
              echo "  ERROR: 产物里**找不到** och-patch-perchannel-quant ——"
              echo "         那上面的「都不在」只说明探针失效，不说明开关真的关了"
              ok=0
            fi
          fi
          # 正向门（本轮特有）：调试开关必须**真的**开了 ——
          # 否则产物没有 DWARF，崩溃点再变时 addr2line 无从谈起，等于白跑一轮。
          for pat in 'strip：跳过（保留调试段' \
                     '调试信息：开启（-g3）'; do
            # ★ 交付模式是 **strip** 的（NO_STRIP=0）⇒ 这两条恰恰**不该**出现
            if [ "${TEFLON_NO_STRIP:-0}" != "1" ]; then
              echo "  ok(skipped): $pat（交付模式：产物 strip，无调试段）"
              continue
            fi
            if grep -qF "$pat" "$L"; then
              echo "  OK(present): $pat"
            else
              echo "  ERROR: 本构建必须有「$pat」——调试开关没生效"
              ok=0
            fi
          done
          # 反向门：其它取证/作废方案的日志不得出现
          for pat in '[och-wc] 已注入 out_channel 诊断' \
                     '[och-snfix]'; do
            if grep -qF "$pat" "$L"; then
              echo "  ERROR: 交付产物里不该出现的行「$pat」"
              ok=0
            else
              echo "  OK(absent): $pat"
            fi
          done

          # ★★ B 段正控制：两条幻影补丁的编译期标记 + RODIAG 取证打印**必须**都在。
          for pat in 'och-patch-v7-phantom-clamp' \
                     'och-patch-v7-phantom-gate' \
                     '[och-ro]' \
                     '[och-ro]   head=' \
                     '[och-ro]   sample ' \
                     '[och-wd]' \
                     '[och-td]' \
                     '[och-coef]' \
                     '[och-wdom]' \
                     'TEFLON_WDOMAIN' \
                     '[och-odetrans]' \
                     'TEFLON_ODETRANS' \
                     '[och-roundmode]' \
                     'TEFLON_ROUNDMODE' \
                     '[och-pcdomain]' \
                     'TEFLON_PCDOMAIN' \
                     'TEFLON_WFILL'; do
            # ★ 交付模式没有这些诊断/探针补丁 ⇒ 它们的标记**本就不该在**产物里。
            #   （取证模式才是「必须在」⇒ 不跳过）
            case "$pat" in
              'och-patch-v7-phantom-clamp'|'[och-ro]'|'[och-ro]   head='|              '[och-ro]   sample '|'[och-wd]'|'[och-td]'|'[och-coef]'|              '[och-roundmode]'|'TEFLON_ROUNDMODE'|'TEFLON_WFILL')
                if [ "$TEFLON_MODE" = "delivery" ]; then
                  echo "  ok(skipped): $pat（交付模式无此诊断/探针）"
                  continue
                fi
                ;;
            esac
            if strings -a "$SO" | grep -qF "$pat"; then
              echo "  OK(positive): $pat"
            else
              echo "  ERROR: 产物里缺少「$pat」—— 开关设了但补丁没进产物"
              ok=0
            fi
          done
          # ★ 反控制：FPARTIAL 必须缺席。
          #   ★ ROFIX 的标记则**必须存在**（2026-10-20 事故后：取证产物必须含 ROFIX，
          #     否则 read_outputs 的越界读重新出现，真机会整机硬挂 —— 报告 38）。
          for pat in '[och-fp]'; do
            if strings -a "$SO" | grep -qF "$pat"; then
              echo "  ERROR: 产物里出现 $pat —— 与 B-diag 的开关组合矛盾"
              ok=0
            else
              echo "  OK(negative): $pat absent"
            fi
          done
          if ! strings -a "$SO" | grep -qF '[och-rofix]'; then
            echo "  ERROR: 产物里缺少 [och-rofix] —— 取证产物必须含 ROFIX（报告 38）"
            ok=0
          fi

          if [ "$ok" -ne 1 ]; then
            echo "  ---- 相关日志片段 ----"
            grep -nE '3b/6|3c/6|3d/6|3e/6|3f/6|3g/6|3h/6|3i/6|3j/6|och-fix|och-wc|och-ocfix|och-fsguard|och-rofix|strip|调试信息|TEFLON_' "$L" || true
            exit 1
          fi
          echo "ALL SWITCH ASSERTIONS PASSED"

      # ★ 真源码锚点门（本轮新增）：Preflight 阶段 mesa 还没下载，只能拿补丁常量拼
      #   mock 自测（selftest-rofix.py）；「真实源码里的锚点是否仍逐字一致」必须等
      #   3h/3j 跑完、源码在盘上才能验证 —— 按补丁常量把 3j 的整块倒回去，
      #   再让生成器重抽锚点逐字节比对（同一时刻也留档构建后的入口行/拷贝行）。
      - name: Static check - ROFIX anchors vs real source (post-build)
        run: |
          set -eux
          python3 oes-teflon/tools/check-rofix-anchors.py \
            "$RUNNER_TEMP/teflon-build/mesa/src/gallium/drivers/etnaviv/etnaviv_ml.c"

      - name: Verify artifact (UNSTRIPPED, fix markers present incl. perchannel, ALL diag markers absent)
        run: |
          set -eux
          SO="$RUNNER_TEMP/teflon-build/out/libteflon.so"
          test -f "$SO" || { echo "ERROR: 产物不存在: $SO"; exit 1; }
          echo "=== ELF header ==="
          readelf -h "$SO" | grep -E 'Class|Type|Machine'
          echo "=== NEEDED ==="
          readelf -d "$SO" | grep NEEDED || true
          readelf -d "$SO" | grep -q musl && { echo "ERROR: 有 musl 依赖"; exit 1; } || true
          echo "=== RUNPATH ==="
          readelf -d "$SO" | grep -E 'RUNPATH|RPATH' || true
          echo "=== delegate ABI ==="
          readelf -sW "$SO" | grep -E 'tflite_plugin_(create|destroy)_delegate'
          # ★ 本构建的**目的**就是带 DWARF：缺 .debug_info 说明开关没生效，
          #   那样崩溃点再变就无法 addr2line —— 等于白跑一轮，必须当场失败。
          if [ "$TEFLON_MODE" = "delivery" ]; then
            if readelf -S "$SO" | grep -q '\.debug_info'; then
              echo "ERROR: 交付产物里还有 .debug_info —— NO_STRIP 未生效"
              exit 1
            fi
            echo "STRIP: OK (.debug_info absent)"
          else
            if ! readelf -S "$SO" | grep -q '\.debug_info'; then
              echo "ERROR: 产物缺 .debug_info —— NO_STRIP/DEBUG_INFO 未生效"
              exit 1
            fi
            echo "DWARF: OK (.debug_info present)"
          fi
          echo "=== .debug_* sections ==="
          readelf -S "$SO" | grep -oE '\.debug_[a-z_]+' | sort -u | tr '\n' ' '; echo
          # FIX_V7 的修复代码在二进制里：grep 的是 **printf 格式串**
          #   "[och-fix] calc_bias_correction depthwise=..."，那是真正的字符串字面量。
          strings -a "$SO" | grep -qF 'calc_bias_correction depthwise' \
            || { echo "ERROR: v7 修复代码不在二进制里"; exit 1; }
          echo "STRING-CHECK: [och-fix] calc_bias_correction depthwise present"
          # ★★ OCFIX 的**二进制级**硬门：编译期标记必须能在 .rodata 里被找到。
          #   上一轮 remap 版我写了一道 `strings | grep 'och patch: out_channel'` 的门，
          #   那串只在 C 注释里，物理上永远不存在 —— 一道永远红的门等于没有门。
          #   现在补丁注入的是真字符串字面量（__attribute__((used)) 保住），
          #   所以这道门能真正判定「这个 .so 里有没有钳位补丁」：
          #   找不到 = 补丁没打进去 = 崩溃会照旧 = 必须当场失败。
          if ! strings -a "$SO" | grep -q 'och-patch-v7-outchannel-clamp'; then
            echo "ERROR: 产物里找不到 och-patch-v7-outchannel-clamp 编译期标记"
            echo "       说明钳位补丁没有进入二进制 —— 上机仍会 SIGSEGV，这是必须拦的情况"
            exit 1
          fi
          echo "STRING-CHECK: och-patch-v7-outchannel-clamp PRESENT (clamp really in .so)"
          # ★★ FSGUARD 的二进制级证据：`ML_DBG` 的**格式串是真字面量**。
          #   定义（etnaviv_ml.h:143）：
          #     #define ML_DBG(fmt, ...) do { if (DBG_ENABLED(ETNA_DBG_ML_MSGS))
          #                                  _debug_printf(fmt, ##__VA_ARGS__); } while (0)
          #   DBG_ENABLED 读的是 `extern int etna_mesa_debug`（运行期变量），
          #   不是编译期常量 ⇒ 分支不会被优化掉 ⇒ 格式串留在 .rodata。
          #   本机已用**既有 stripped 产物**实证（不是推理）：
          #     b9936131 / ffce949e / f9bf1d51 三个已 strip 产物里
          #     `dumping intermediate graph` 与 `coefficients_size 0x` 都在。
          #   ⚠️ 与注释 marker 的区别：C 注释不进二进制（那是永远红的假门，踩过），
          #      这里查的是真字面量。
          if ! strings -a "$SO" | grep -qF 'filter in_c'; then
            echo "ERROR: 产物里找不到 'filter in_c' —— FSGUARD 的 ML_DBG 字面量不在二进制里"
            echo "       说明形状守卫没打进去：那两个不自洽卷积仍会被接管 → 崩溃照旧"
            exit 1
          fi
          echo "STRING-CHECK: 'filter in_c' PRESENT (FSGUARD really in .so)"
          # ★★ ROFIX 的二进制级证据：注入代码的 ML_DBG 格式串是**真字面量**
          #   （ML_DBG 展开为 if (DBG_ENABLED(...)) _debug_printf(fmt,...)，
          #     DBG_ENABLED 读运行期变量 ⇒ 分支不会被优化掉 ⇒ 字符串留在 .rodata；
          #     同一机制已由 'filter in_c' 门在**既有 stripped 产物**上实证过）。
          #   找不到 = 3j 没生效 = 白跑一轮真机，必须当场失败。
          if ! strings -a "$SO" | grep -qF '[och-rofix]'; then
            echo "ERROR: 产物里找不到 [och-rofix] —— ROFIX 修复代码不在二进制里"
            echo "       说明 read_outputs 范围对齐没打进去：越界读照旧，真机仍会 SIGSEGV"
            exit 1
          fi
          echo "STRING-CHECK: [och-rofix] PRESENT (ROFIX really in .so)"
          # ★ PERCHANNEL 的**两条互相独立**的二进制级证据（与 ALIASDIAG/CREATEDIAG 同构）：
          #   ① 编译期标记 __attribute__((used)) static const char
          #      och_perchannel_quant_marker[] = "och-patch-perchannel-quant"
          #      —— 真字面量，必在 .rodata；找不到 = 3m 根本没打进去。
          if ! strings -a "$SO" | grep -qF 'och-patch-perchannel-quant'; then
            echo "ERROR: 产物里找不到编译期标记 och-patch-perchannel-quant —— PERCHANNEL 没进二进制"
            exit 1
          fi
          echo "STRING-CHECK: och-patch-perchannel-quant PRESENT (PERCHANNEL compile-time marker)"
          #   ② 新函数名本身也在 .rodata（调试符号/字符串表里可查），
          #      用来确认「追加」那一步真的发生了，而不只是标记被塞进去。
          # ★ 这条查的是**函数名** ⇒ 它在符号表里，**strip 之后就没了**
          #   （交付模式 NO_STRIP=0 ⇒ 查不到是正常的）。
          #   ⇒ 只在未 strip 的取证产物上查；交付模式由上一条
          #   「och-patch-perchannel-quant（真字面量）」证明补丁已落地。
          if [ "${TEFLON_NO_STRIP:-0}" = "1" ]; then
            if ! strings -a "$SO" | grep -qF 'tensor_quantization_supported_per_axis'; then
              echo "ERROR: 产物里找不到 tensor_quantization_supported_per_axis —— 新判定没进二进制"
              exit 1
            fi
            echo "STRING-CHECK: tensor_quantization_supported_per_axis PRESENT"
          else
            echo "ok(skipped): tensor_quantization_supported_per_axis（strip 产物没有符号表）"
          fi
          # ★ 反向门：诊断开关的字符串一个都不该在
          if strings -a "$SO" | grep -qF '[och-wc]'; then
            echo "ERROR: 产物里出现 [och-wc] —— WCDIAG 诊断开关误开，这不是交付产物"
            exit 1
          fi
          echo "STRING-CHECK: [och-wc] absent (diag switch really off)"
          # ★ 反向门：RODIAG（read_outputs 越界取证）的字符串也一个都不该在 ——
          #   它是本轮新增的第三个诊断开关，误开会让交付产物多出运行期打印与体积。
          # ★ RODIAG 的存在性随开关走：取证模式必须有，交付模式必须没有
          if [ "$TEFLON_RODIAG" = "1" ]; then
            if ! strings -a "$SO" | grep -qF '[och-ro]'; then
              echo "ERROR: 产物里找不到 [och-ro] —— RODIAG 没打进去"
              exit 1
            fi
            echo "STRING-CHECK: [och-ro] PRESENT (RODIAG really in .so)"
          fi
          # ★ 反向门：本轮把 ALIASDIAG / CREATEDIAG 置 0，
          #   它们的字符串**一个都不该在**产物里（否则就是拿错产物）。
          for probe in '[och-alias]' '[och-create]'; do
            if strings -a "$SO" | grep -qF "$probe"; then
              echo "ERROR: 产物里出现 $probe —— 诊断开关误开，这不是 per-channel 候选产物"
              exit 1
            fi
            echo "STRING-CHECK: $probe absent (diag switch really off)"
          done
          if [ "$TEFLON_MODE" = "delivery" ]; then
            # ★ 交付版的额外门：三个修复的标记**必须在**，诊断/实验标记**必须不在**
            for pat in '[och-wdom]' '[och-odetrans]' '[och-pcdomain]' 'och-patch-ml-resource-width'; do
              if ! strings -a "$SO" | grep -qF "$pat"; then
                echo "ERROR: 产物里缺少 $pat —— 该修复没进二进制，交付产物会带缺陷"
                exit 1
              fi
              echo "STRING-CHECK: $pat PRESENT (fix really in .so)"
            done
            for probe in '[och-nn]' '[och-fp]' '[och-pcl]' 'och-patch-v7-phantom-clamp'; do
              if strings -a "$SO" | grep -qF "$probe"; then
                echo "ERROR: 产物里出现 $probe —— 诊断/实验开关误开，这不是交付产物"
                exit 1
              fi
              echo "STRING-CHECK: $probe absent"
            done
          fi

      # ★ ROFIX 改写了 read_outputs 自身 ⇒ 675a1091 的内部偏移与后续函数地址
      #   **按设计作废**（本产物已 strip，没有 DWARF，addr2line 无从谈起）。
      #   这里只留**同构身份指纹**：若真机再崩，用与本产物同配置的构建重取偏移，
      #   再用 .text 哈希确认「确实是同一份代码」，不与旧地址混用。
      # ★ 本轮产物带 DWARF：顺手把**三个目标函数的新地址**记进日志 ——
      #   ALIASDIAG 把代码插在文件前部（:198/:226 两个函数），
      #   6acfef1f 的 read_outputs 地址（0x230660/0x2307e8/0x8561c）**按设计作废**，
      #   不跨构建对账；这里 nm/addr2line 现取，供真机若再崩时对照。
      # ★ 负控制：字节直查门必须能变红。做法：对当前 .so 查一个**保证不存在**的中文
      #   探针，python 必须以非 0 退出。若这一步意外通过，说明字节直查实现有 bug。
      - name: Negative control - byte-level probe gate can go red
        run: |
          set -eu
          SO="$RUNNER_TEMP/teflon-build/out/libteflon.so"
          if python3 -c "import sys; b=open(sys.argv[1],'rb').read(); sys.exit(0 if '这个探针一定不存在-och-neg-ctrl'.encode('utf-8') in b else 1)" "$SO"; then
            echo 'ERROR: 负控制反了 —— 不存在的中文探针竟被判存在，字节直查实现有 bug'
            exit 1
          fi
          echo 'NEG-CTRL: byte-level probe correctly reports MISS (gate can go red)'

      # ★ 本轮产物带 DWARF：顺手把**四个目标函数的新地址**记进日志 ——
      #   ALIASDIAG 插在 :198/:226，CREATEDIAG 插在 :70/:92（更靠前），
      #   6acfef1f / 64933494 的 read_outputs 地址**按设计作废**，不跨构建对账；
      #   这里 nm/addr2line 现取，供真机若再崩时对照。
      #   ⚠️ recreate_tensor 无独立符号（被内联），上轮已查实；本轮不再指望它。
      - name: Layout fingerprint (rofix+aliasdiag+creatediag - UNSTRIPPED, addresses taken now)
        run: |
          set -eux
          SO="$RUNNER_TEMP/teflon-build/out/libteflon.so"
          A2L=aarch64-linux-gnu-addr2line
          OBJCOPY=$(command -v aarch64-linux-gnu-objcopy || command -v objcopy)
          SYMS='etna_ml_subgraph_read_outputs|reference_tensor_with_offset|etna_ml_create_tensor|etna_ml_destroy_tensor'
          echo "=== nm -n: 四个目标函数新地址（现取）==="
          nm -n "$SO" | grep -E " (T|t) ($SYMS)$" || true
          for SYM in $(nm -n "$SO" | awk "/ ($SYMS)\$/{print \"0x\"\$1}"); do
            echo "=== addr2line -f -C -i $SYM ==="
            $A2L -f -C -i -e "$SO" "$SYM" || true
          done
          echo "=== 旧基准（6acfef1f / 64933494，本产物不复用）==="
          echo "  6acfef1f: read_outputs=0x230660  fault@+0x38c  caller=0x8561c"
          echo "  64933494: read_outputs=0x230760 (VOID: 本轮插码更靠前)"
          echo "=== .text 指纹 ==="
          $OBJCOPY -O binary --only-section=.text "$SO" /tmp/rofix-alias-created-text.bin
          echo "text_sha256=$(sha256sum /tmp/rofix-alias-created-text.bin | cut -d' ' -f1)"
          echo "text_bytes=$(stat -c%s /tmp/rofix-alias-created-text.bin)"
          echo "=== .rodata 指纹 ==="
          $OBJCOPY -O binary --only-section=.rodata "$SO" /tmp/rofix-alias-created-rodata.bin
          echo "rodata_sha256=$(sha256sum /tmp/rofix-alias-created-rodata.bin | cut -d' ' -f1)"
          echo "rodata_bytes=$(stat -c%s /tmp/rofix-alias-created-rodata.bin)"

      # 起因：ocfix 的结构门用 `src.find("\nstatic", fn_at)` 划函数体边界 ——
      # 若下一个函数不是 static，fn_body 会越界、计数被污染、门**大声拒绝**。
      # 方向是安全的（不会误放行），但要知道真实源码长什么样才能改门。
      - name: On failure - dump patch target neighbourhood
        if: failure()
        run: |
          set -u
          echo "================ BUILD LOG (tail) ================"
          tail -40 "$RUNNER_TEMP/build-fix.log" 2>/dev/null || echo "(no build log)"
          F="$RUNNER_TEMP/teflon-build/mesa/src/gallium/drivers/etnaviv/etnaviv_ml_nn_v7.c"
          if [ -f "$F" ]; then
            echo "================ write_core_interleaved 邻域 ================"
            grep -n 'write_core_interleaved' "$F" | head -5
            LN=$(grep -n 'write_core_interleaved(struct' "$F" | head -1 | cut -d: -f1)
            if [ -n "${LN:-}" ]; then
              sed -n "$((LN>5?LN-5:1)),$((LN+130))p" "$F"
            fi
            echo "================ 紧随其后的函数声明（看是否为 static）================"
            awk -v s="$LN" 'NR>s && /^[a-zA-Z_].*\(/ {print NR": "$0; c++} c>2{exit}' "$F"
          else
            echo "目标源文件不存在: $F"
          fi
          F2="$RUNNER_TEMP/teflon-build/mesa/src/gallium/drivers/etnaviv/etnaviv_ml.c"
          if [ -f "$F2" ]; then
            echo "================ etna_ml_operation_supported 全文（FSGUARD 注入点）================"
            LN2=$(grep -n 'etna_ml_operation_supported(struct' "$F2" | head -1 | cut -d: -f1)
            if [ -n "${LN2:-}" ]; then
              sed -n "$((LN2>3?LN2-3:1)),$((LN2+110))p" "$F2"
            fi
            echo "================ input_tensor / supported 的出现位置（判作用域与 fail-open）================"
            grep -n 'input_tensor' "$F2" | head -20
            grep -n 'supported = true;' "$F2" | head -10
            grep -n 'return supported;' "$F2" | head -10
          else
            echo "目标源文件不存在: $F2"
          fi

      - name: Glibc symbol ceiling check (device = 2.36)
        run: |
          set -eu
          CEIL=36
          fail=0
          for f in "$RUNNER_TEMP/teflon-build/out/libteflon.so" \
                   "$RUNNER_TEMP/teflon-build/out/libdrm.so.2"; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            max=$(readelf -V "$f" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' \
                  | sort -uV | tail -1 | cut -d. -f2)
            echo "  $name: 最高 GLIBC_2.${max:-?}  (上限 2.$CEIL)"
            if [ -n "$max" ] && [ "$max" -gt "$CEIL" ]; then
              echo "  ERROR: $name 使用 GLIBC_2.$max > 设备 2.$CEIL"; fail=1
            fi
            if readelf -sW "$f" 2>/dev/null | grep -q "__isoc23"; then
              echo "  ERROR: $name 引用了 __isoc23_*（需 GLIBC_2.38+）"; fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "OK: 全部产物符号版本 <= 设备 glibc 2.36"

      - name: Collect artifact (FIX_V7 + OCFIX + FSGUARD + ROFIX + ALIASDIAG + CREATEDIAG, UNSTRIPPED evidence)
        run: |
          set -eux
          OUT="$RUNNER_TEMP/teflon-build/out"
          mkdir -p artifact
          cp "$OUT/libteflon.so" artifact/
          # ★ 第 23 步的断言原文（**日志侧**证据；产物侧证据是 .so 里的标记）
          if [ -f "$RUNNER_TEMP/teflon-build/step23-assertions.log" ]; then
            cp "$RUNNER_TEMP/teflon-build/step23-assertions.log" artifact/
          else
            echo "ERROR: 缺 step23-assertions.log —— 日志侧证据没进产物"
            exit 1
          fi
          # ★ 本轮新增的两份证据（run 39229309524 的产物里都没带上）：
          #   1) pcl-evidence.txt  —— 打完补丁的三个函数原文 + 本轮可证伪预测
          #   2) selftest-*.log    —— 自测输出（och 第三节第 2 条）
          #      自测输出默认落在日志尾部，同样会被截断，所以必须走产物。
          # ★ 证据清单按补丁形态分流：fold-early 模式下只产出 foldearly 自测日志，
          #   若仍按 layout 清单要文件 ⇒ 会以「证据缺失」为由误判失败（run 39754283314 之后修）。
          if [ "${TEFLON_PERCHANNEL_FOLDEARLY:-0}" = "1" ]; then
            EVIDENCE_FILES="$RUNNER_TEMP/pcl-evidence.txt $RUNNER_TEMP/teflon-build/selftest-perchannel-foldearly.log"
          else
            EVIDENCE_FILES="$RUNNER_TEMP/pcl-evidence.txt $RUNNER_TEMP/teflon-build/selftest-perchannel-layout.log $RUNNER_TEMP/teflon-build/selftest-perchannel-layout-math.log"
          fi
          for f in $EVIDENCE_FILES; do
            if [ -f "$f" ]; then
              cp "$f" artifact/
            else
              echo "ERROR: 缺 $(basename "$f") —— 这份证据没进产物"
              exit 1
            fi
          done
          [ -f "$OUT/libdrm.so.2" ] && cp "$OUT/libdrm.so.2" artifact/ \
            || { echo "ERROR: 缺少 libdrm.so.2"; exit 1; }
          {
            if [ "${TEFLON_MODE:-phantomdiag}" = "delivery" ]; then
              echo "########## DELIVERY BUILD — 交付候选产物（数值已在设备上验证，见报告 47）##########"
              echo "fixes_default_on=TEFLON_WDOMAIN(per-tensor 权重 +128) / TEFLON_ODETRANS(图输出 NCHW->NHWC) / TEFLON_PCDOMAIN(per-channel 权重域)"
              echo "disable_one=设 TEFLON_WDOMAIN=0 / TEFLON_ODETRANS=0 / TEFLON_PCDOMAIN=0 单独关掉某一个（不设=修复生效）"
              echo "safety_on=FIX_V7 / OCFIX / FSGUARD / ROFIX / PHANTOM_GATE(out_c%8!=0 回落 CPU)"
              echo "diagnostics_off=NNDUMP / RODIAG / ALIASDIAG / CREATEDIAG / WCDIAG / KPAT / FORCE-PARTIAL / ROUNDMODE / R5GUARD / PHANTOM_CLAMP"
              echo "stripped=yes（无 .debug_info）"
              echo "known_limit1=per-axis(per-channel)量化达不到逐字节一致：驱动把各通道 scale 压成单一 scale（upstream 明确声明的损失）"
              echo "known_limit2=实测与 TFLite CPU 约 78% 一致、其余 <=1 LSB；per-tensor 模型可达逐字节一致（与精确整数数学 100% 相同）"
              echo "known_limit3=out_c%8!=0 的卷积回落 CPU（幻影通道，GATE 兜底）：零挂死风险，但少加速"
              echo "verified_on_device=三模型回归：c248 合成(per-tensor)=与精确整数数学 100.0000% / 官方 MobileNetV1=与 CPU 99.70% / c248-perchannel=与 CPU 78.36% 且不再饱和"
              echo "reports=verify/reports/42 43 44 46 47（本仓）；详见本仓 AGENTS.md「交付版」节"
            else
