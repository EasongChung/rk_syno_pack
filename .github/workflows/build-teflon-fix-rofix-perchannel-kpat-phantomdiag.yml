name: build-teflon-fix-rofix-perchannel-kpat-phantomdiag

# 【交付候选轮 / 数值未验证，NOT DELIVERABLE】四处修复 + per-channel 量化门（UNSTRIPPED）
#
# 起因（门 c 阻塞）：
#   per-channel（per-axis）模型下，`etna_ml_operation_supported()` 的 CONVOLUTION 分支
#   对 input/weight/bias/output **四个张量统一**要求
#       tensor_quantization_supported(t) == (t->scales == NULL && t->zero_points == NULL)
#   ⇒ 任何带 per-axis 参数的模型，**卷积族接管数归零**（实测）。
#   而下降路径其实**早就实现了** per-channel，只是被这道门挡住：
#       etnaviv_ml_nn.c：权重按 scales[oc] 逐通道反量化
#                     → calc_quantization() 沿所有通道求单一 scale
#                     → requantize_weights()/requantize_bias() 重量化到该标量
#   upstream 自己打印 "with a loss of accuracy"。
#
# ★ 为什么不能把那张门无脑翻成 true：
#   只有 **weight/bias** 的下降路径处理了 per-axis；
#   **input/output 只读标量 tensor->scale**，
#   放行它们会读到**未被设置的标量** ⇒ **静默算错**。
#   故本补丁按张量区分，并在补丁内部与 check-perchannel-quant.py 里
#   **各硬断言一次**「input/output 仍走严格判定」。
#
# ⚠️ 代价（不藏着）：per-axis 折叠到单一 scale **有精度损失**，小权重可能被压到 0。
#    本补丁只保证「能接管、不崩溃」，**不保证数值达标**。
#    cos ≥ 0.98 / top-1 一致（门 e）必须**设备实测**，不能由本补丁推断。
#
# 开关（本 workflow 的意义就是这一组固定组合，不接受随意拼装）：
#   TEFLON_FIX_V7=1   -> patch-etnaviv-v7-biasfix.py
#   TEFLON_OCFIX=1    -> patch-etnaviv-outchannel-clamp.py   （公式逐字不动，只钳位）
#   TEFLON_FSGUARD=1  -> patch-etnaviv-filter-shape-guard.py （不自洽卷积回退 CPU）
#   TEFLON_ROFIX=1    -> patch-etnaviv-readout-offset-fix.py （read_outputs 范围对齐 invoke）
#   TEFLON_NNDUMP=1     -> patch-etnaviv-nn-desc-dump.py      （NN core 描述符**逐字节** dump）
#   TEFLON_KPAT=1       -> patch-etnaviv-kernel-pattern.py   （kernel_pattern 运行期强制开关）
#   TEFLON_PERCHANNEL=1->patch-etnaviv-perchannel-quant.py    （只放开 weight/bias；
#                                                             编译期标记 och-patch-perchannel-quant）
#   TEFLON_ALIASDIAG=0 / TEFLON_CREATEDIAG=0 -> 本产物**不含**任何取证打印
#   TEFLON_DIAG=0 / TEFLON_WCDIAG=0 / TEFLON_RODIAG=0 -> 其余取证打印一律不进本产物
#   TEFLON_DEBUG_INFO=1 / TEFLON_NO_STRIP=1 -> -g3 + 跳过 strip，保留 .debug_*
#
# ⚠️ 本产物**不可交付**：门 d/e/f 未在设备实测，per-channel 折叠的精度损失**没有数据**。
#    它的作用是回答一个具体问题：**「per-channel 模型下卷积接管数能不能恢复」**。
#    判据预期：② 接管数恢复 + 不崩；③④ **不因本产物而达成**。
# ⚠️ 上机**必须**设 `ETNA_MESA_DEBUG=ml_msgs` 才看得到接管/回退日志。
# ⚠️ 地址不与既往产物对账：本轮换了补丁集合，函数位移必然不同。
#
# 与 FSGUARD 的共存：两者都改 etna_ml_operation_supported 附近，
#   FSGUARD 的锚点结尾正是那句 `// Dilation and per-axis quantization not yet
#   implemented`，就在本补丁改的四连调用**上面**。
#   Preflight 的 selftest 已验证**双向顺序都共存**，本 workflow 里也是先 FSGUARD 后 PERCHANNEL。
#
# workflow 分离（避免拿错产物）：
#   build-teflon.yml             -> artifact `libteflon-aarch64-glibc` （生产，无补丁）
#   build-teflon-fix.yml         -> artifact `libteflon-fix`         （三处修复交付候选）
#   build-teflon-fix-rofix.yml   -> artifact `libteflon-fix-rofix`   （四处修复交付候选）
#   build-teflon-fix-rofix-perchannel.yml
#                                 -> artifact `libteflon-fix-rofix-perchannel`
#   build-teflon-fix-rofix-perchannel-kpat.yml
#                                 -> artifact `libteflon-fix-rofix-perchannel-kpat`
#                                    （= per-channel 候选 + NNDUMP + KPAT；
#                                      单变量对照：pattern 0x6 是否为挂死元凶）
#                                    （本文件，per-channel 候选，数值未验证，不可交付）
#
# ⚠️ 触发方式：**仅 workflow_dispatch**。不设 push 触发。

# ⚠️ 触发方式：**仅 workflow_dispatch**。不设 push 触发。

on:
  workflow_dispatch:
    inputs:
      mesa_tag:
        description: 'Mesa tag（需带 vendored TFLite 头）'
        required: false
        default: 'mesa-26.2.5'
      mode:
        description: 'phantomdiag（取证产物：诊断全开、带 DWARF）| delivery（交付产物：修复默认开、诊断全关、strip）'
        required: false
        default: 'phantomdiag'
      foldearly:
        description: 'foldearly（报告 55 方案 A：折叠前移+原地+保持 in_c=C；与 layout 补丁互斥）'
        required: false
        default: '0'

env:
  MESA_TAG: ${{ github.event.inputs.mesa_tag || 'mesa-26.2.5' }}
  TEFLON_MODE: ${{ inputs.mode || 'phantomdiag' }}
  TEFLON_FIX_V7: '1'
  TEFLON_OCFIX: '1'
  TEFLON_FSGUARD: '1'
  TEFLON_ROFIX: '1'
  TEFLON_PERCHANNEL: '1'
  # ★ 报告 55 方案 A：折叠前移 + 原地 + 删 depthwise 的 in_c=1 写回。
  #   与 patch-etnaviv-perchannel-layout.py **互斥**（build-teflon.sh 里 fail-closed）。
  #   默认 '0' ⇒ 产物与既往交付件同一补丁集合（可复现对照）。
  TEFLON_PERCHANNEL_FOLDEARLY: ${{ inputs.foldearly || '0' }}
  TEFLON_PERCHANNEL_DIAG: ${{ inputs.mode == 'delivery' && '0' || '1' }}
  TEFLON_NNDUMP: ${{ inputs.mode == 'delivery' && '0' || '1' }}
  TEFLON_KPAT: ${{ inputs.mode == 'delivery' && '0' || '1' }}
  # ★ B-diag：两条幻影补丁 + read_outputs 取证（★ ROFIX 必须为 1；取证叠加在 ROFIX 之上，
  #   见 build-teflon.sh 3j-2 与报告 38：ROFIX=0 的取证产物会在真机上整机硬挂）
  TEFLON_PHANTOM_CLAMP: ${{ inputs.mode == 'delivery' && '0' || '1' }}
  TEFLON_PHANTOM_GATE: ${{ inputs.mode == 'delivery' && '1' || '1' }}
  TEFLON_RODIAG: ${{ inputs.mode == 'delivery' && '0' || '1' }}
  # ★ 权重 int8→uint8 域（+128）：编进产物，但**运行期**再由 TEFLON_WDOMAIN 门控，
  #   便于同产物 A/B（不设 = 与上游逐字节一致 = 全零输出；设 = 应有实数输出）。
  TEFLON_WDOM_PATCH: ${{ inputs.mode == 'delivery' && '1' || '1' }}
  # ★ 图输出 NCHW→NHWC 收口（同样运行期 TEFLON_ODETRANS 门控）
  TEFLON_ODETRANS_PATCH: ${{ inputs.mode == 'delivery' && '1' || '1' }}
  # ★ 显式 std 头文件（纯卫生，无行为变化）
  TEFLON_STDINC_PATCH: ${{ inputs.mode == 'delivery' && '1' || '1' }}
  # ★ 舍入模式探针：编进产物，运行期由 TEFLON_ROUNDMODE=0..3 覆盖，
  #   不设 = 与上游逐字节一致。用于实测哪个值等价于 TFLite 的四舍五入。
  TEFLON_ROUNDMODE_PATCH: ${{ inputs.mode == 'delivery' && '0' || '1' }}
  # ★ per-channel 权重折叠后的域修复（报告 46）：
  #   signed 分支多减 0x80 ⇒ 非对角权重 0→128 ⇒ 输出饱和到 255。
  #   运行期由 TEFLON_PCDOMAIN 门控，不设 = 与上游逐字节一致。
  TEFLON_PCDOMAIN_PATCH: ${{ inputs.mode == 'delivery' && '1' || '1' }}
  # ★ ML 自建资源 width0=0 的修复（报告 48）：Photos 主题识别模型的 abort 根因之一
  TEFLON_MLWIDTH_PATCH: '1'
  # ★ 通用 rank>4 守卫（报告 48）：该模型是 rank-5 折叠形态，
  #   delegate 接管 RESHAPE ⇒ 驱动丢 dims[0] ⇒ 尺寸错 ⇒ abort
  TEFLON_MLR5G_PATCH: '1'
  TEFLON_ALIASDIAG: '0'
  TEFLON_CREATEDIAG: '0'
  TEFLON_DIAG: '0'
  TEFLON_WCDIAG: '0'
  TEFLON_DEBUG_INFO: ${{ inputs.mode == 'delivery' && '0' || '1' }}
  TEFLON_NO_STRIP: ${{ inputs.mode == 'delivery' && '0' || '1' }}

jobs:
  build:
    name: build libteflon.so (mode=${{ inputs.mode || 'phantomdiag' }}, foldearly=${{ inputs.foldearly || '0' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps (amd64 only)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            pkg-config \
            meson ninja-build \
            python3 python3-pip \
            python3-mako python3-yaml \
            bison flex \
            patchelf \
            ca-certificates curl wget git binutils

      - name: Install meson >= 1.4 (Mesa 26.x requirement)
        run: |
          set -eux
          python3 -m pip install --user --break-system-packages "meson>=1.4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          meson --version

      - name: Install pycparser
        run: python3 -m pip install --break-system-packages "pycparser>=2.20"

      - name: Verify toolchain
        run: |
          set -eux
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-gcc -dumpmachine
          aarch64-linux-gnu-strip --version | head -1
          meson --version
          ninja --version
          python3 -c "import mako, yaml, pycparser; print('python deps OK')"

      # 预检：ocfix 补丁的注入 / 幂等 / 锚点缺失 / **计数门**四种行为。
      # 样本用补丁自己的 OLD 拼出来（不凭印象手写锚点 —— 手写缩进踩过坑）。
      - name: Preflight - outchannel fix patcher self-test
        run: |
          set -eux
          python3 - <<'PY'
          import importlib.util, os, shutil, subprocess, sys, tempfile

          P = 'oes-teflon/build-recipe/patch-etnaviv-outchannel-clamp.py'
          spec = importlib.util.spec_from_file_location('ocfix', P)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          OLD, NEW, TARGET_FN = m.OLD, m.NEW, m.TARGET_FN

          HEAD = ('static bool\n'
                  'write_core_interleaved(struct etna_ml_subgraph *sg, struct etna_operation *op)\n'
                  '{\n'
                  '   append_bits(kernels_per_core, 16, &wb_stream);\n'
                  '   calculate_bias_correction((uint8_t *)weights_map[out_channel], op);\n'
                  '   biases[out_channel] = something;\n')
          TAIL = ('            for (unsigned y = 0; y < stride; y++)\n'
                  '               wb_stream_write(&wb_stream, weights_map[out_channel][z][x][y]);\n'
                  '            for (unsigned y2 = 0; y2 < stride; y2++)\n'
                  '               wb_stream_write(&wb_stream, weights_map[out_channel][z][x][y]);\n'
                  '   return true;\n'
                  '}\n')
          NEXT = ('\nstatic bool\nwrite_core_6(struct etna_ml_subgraph *sg)\n'
                  '{\n   biases[out_channel] = other;\n   return true;\n}\n')
          GOOD = '/* head */\n' + HEAD + OLD + TAIL + NEXT

          def run_case(name, text, expect):
              d = tempfile.mkdtemp()
              try:
                  p = os.path.join(d, 'v7.c')
                  # ⚠️ 必须显式 encoding：补丁注入的 C 注释**含中文**，
                  #    依赖 locale 会在非 UTF-8 环境（Windows GBK / POSIX C locale）炸掉。
                  open(p, 'w', encoding='utf-8').write(text)
                  r = subprocess.run([sys.executable, P, p], capture_output=True,
                                     text=True, encoding='utf-8', errors='replace')
                  assert r.returncode == expect, \
                      '%s: rc=%d expected %d\n%s' % (name, r.returncode, expect,
                                                     (r.stderr or '')[-500:])
                  print('  ok: %s (rc=%d)' % (name, r.returncode))
              finally:
                  shutil.rmtree(d, ignore_errors=True)

          run_case('inject on clean source', GOOD, 0)
          run_case('two weights_map writes (count gate armed)', GOOD, 0)
          # 计数门：改掉**一处**同款调用必须被拦（och 说他初版这里被放行过）
          run_case('drop one weights_map write',
                   GOOD.replace('for (unsigned y2 = 0; y2 < stride; y2++)\n'
                                '               wb_stream_write(&wb_stream, '
                                'weights_map[out_channel][z][x][y]);',
                                'for (unsigned y2 = 0; y2 < stride; y2++)\n'
                                '               wb_stream_write(&wb_stream, other);'), 1)
          run_case('drop biases[out_channel]',
                   GOOD.replace('   biases[out_channel] = something;\n', ''), 1)
          run_case('drop append_bits header',
                   GOOD.replace('append_bits(kernels_per_core, 16', 'append_bits(x, 16'), 1)
          run_case('target function absent',
                   GOOD.replace('write_core_interleaved(struct', 'zzz(struct'), 1)
          run_case('anchor appears twice', GOOD + GOOD, 1)

          # 注入结果的**内容纪律**：本补丁只允许加钳位，绝不改公式。
          # （重映射版已被上游 v8 fill_weights() 否证并删除，见 BUILD-INFO。）
          d = tempfile.mkdtemp()
          try:
              p = os.path.join(d, 'v7.c')
              open(p, 'w', encoding='utf-8').write(GOOD)
              r = subprocess.run([sys.executable, P, p], capture_output=True,
                                 text=True, encoding='utf-8', errors='replace')
              assert r.returncode == 0, r.stderr[-400:]
              after = open(p, encoding='utf-8').read()
              assert 'och-patch-v7-outchannel-clamp' in after, \
                  'compile-time marker missing (strings gate would never pass)'
              assert '__attribute__((used))' in after, 'marker may be optimised away'
              assert m.FORMULA_LITERAL in after, 'original formula was modified!'
              assert 'core * kernels_per_core + och_sb_base' not in after, \
                  'remap leaked back in'
              assert 'out_channel >= output_channels' in after
              assert 'out_channel = output_channels - 1' in after
              print('  ok: marker literal + formula preserved + no remap')
          finally:
              shutil.rmtree(d, ignore_errors=True)
          print('PREFLIGHT ocfix-clamp OK (inject / count-gate / anchor / discipline)')

          # 幂等：同一文件再打一次必须被拒
          d = tempfile.mkdtemp()
          try:
              p = os.path.join(d, 'v7.c')
              open(p, 'w', encoding='utf-8').write(GOOD)
              r1 = subprocess.run([sys.executable, P, p], capture_output=True,
                                  text=True, encoding='utf-8', errors='replace')
              assert r1.returncode == 0, r1.stderr[-300:]
              r2 = subprocess.run([sys.executable, P, p], capture_output=True,
                                  text=True, encoding='utf-8', errors='replace')
              assert r2.returncode == 1, 're-apply not rejected'
              print('  ok: re-apply rejected')
          finally:
              shutil.rmtree(d, ignore_errors=True)
          PY

      - name: Preflight - v7 biasfix patcher self-test
        run: |
          set -eux
          python3 - <<'PY'
          import os, shutil, subprocess, sys, tempfile

          FUNC = (
              'static uint32_t\n'
              'calculate_bias_correction(uint8_t *weights, const struct etna_operation *operation)\n'
              '{\n'
              '   int32_t correction = 0;\n'
              '\n'
              '   for (unsigned i = 0; i < operation->weight_width * operation->weight_height * operation->input_channels; i++) {\n'
              '      correction += (weights[i] - operation->weight_zero_point) * operation->input_zero_point;\n'
              '   }\n'
              '\n'
              '   return correction;\n'
              '}\n')
          P = 'oes-teflon/build-recipe/patch-etnaviv-v7-biasfix.py'
          tmp = tempfile.mkdtemp()
          try:
              p = os.path.join(tmp, 'v7.c')
              open(p, 'w', encoding='utf-8').write(FUNC)
              r = subprocess.run([sys.executable, P, p], capture_output=True,
                                 text=True, encoding='utf-8', errors='replace')
              assert r.returncode == 0, (r.stdout + r.stderr)[-400:]
              b = open(p, encoding='utf-8').read()
              for needle in ('och patch: v7 calculate_bias_correction depthwise fix',
                             'if (operation->depthwise)', 'operation->addition'):
                  assert needle in b, 'missing %r' % needle
              for ln in b.splitlines():
                  s = ln.strip()
                  if s.startswith('operation->') and '=' in s and '==' not in s:
                      raise AssertionError('assigns const member: %s' % s)
              r2 = subprocess.run([sys.executable, P, p], capture_output=True,
                                  text=True, encoding='utf-8', errors='replace')
              assert r2.returncode == 1, 're-apply not rejected'
              print('PREFLIGHT v7-biasfix OK')
          finally:
              shutil.rmtree(tmp, ignore_errors=True)
          PY

      # ★ FSGUARD 正/反例自测：och 编号 n1..n7 + 我加固的 n8 + 幂等 + 生成器一致性。
      #   n8 的意义：样本的 `default:` 分支本身就有 `return false;` ——
      #   若「守卫块内必须有 return false」这道门只是全文件 grep，break 版会被蒙过，
      #   而 break 正是 fail-open 的形态（守卫不生效、崩溃照旧）。所以 n8 必须能拦住。
      - name: Preflight - filter shape guard (FSGUARD) self-test
        run: |
          set -eux
          python3 oes-teflon/tools/selftest-fsguard.py

      # ★ ROFIX 正/反例自测：1 正例 + 13 反例 + 幂等 + 括号不平衡(fail-closed)
      #   + 生成器一致性（5 个语义载荷逐字节比对）。
      #   本轮特有陷阱：注入的说明注释里**引用**了 pipe_buffer_size(res) /
      #   etna_ml_get_size 作为 H2 证据，所以「注入的可执行代码不得含这两个名字」
      #   这道自检**必须先剥注释**（TRAP 项已就位），否则正例会被自己误拒 ——
      #   同一个坑 och 踩过两次。
      #   唯一预期 WARN：_fn_body 遇括号不平衡会 IndexError（方向仍 fail-closed）。
      - name: Preflight - read_outputs offset fix (ROFIX) self-test
        run: |
          set -eux
          python3 oes-teflon/tools/selftest-rofix.py

      # ★ ALIASDIAG 正/反例自测：1 正例 + 10 反例 + 幂等 + **与 ROFIX 共存（双向
      #   顺序）** + 生成器一致性（12 个语义载荷逐字节比对）。
      #   本轮特有：三处锚点的「新旧计数」口径不同 —— ref 是段中间插入（旧的应消失），
      #   rec/mark 是只追加型（旧的应恰好保留 1 处）；一律查「消失」会误拒正例。
      #   唯一预期 WARN：_body/_fn_body 对括号不平衡会 IndexError（方向仍 fail-closed；
      #   这是同一处 nit 的第三次出现，已建议一次性修三个文件）。
      - name: Preflight - alias migration diag (ALIASDIAG) self-test
        run: |
          set -eux
          python3 oes-teflon/tools/selftest-aliasdiag.py

      # ★ CREATEDIAG 正/反例自测：1 正例 + 9 反例 + 幂等 + **三诊断共存
      #   （ROFIX + ALIASDIAG + CREATEDIAG，三种顺序）** + 生成器一致性
      #   （12 个语义载荷逐字节比对）+ **打印纪律门**。
      #   三处锚点口径不同：create 是段中间插入（OLD 应消失 0 处）；
      #   destroy / mark 是只追加型（OLD 应恰好保留 1 处）。
      #   打印纪律门：诊断补丁只许加打印 —— 去掉注释与 ML_DBG 后，注入前后的
      #   **可执行代码必须逐字相同**。当前**应为绿**（v2 已改 print-only）；
      #   若此门转红，说明补丁又改了控制流 —— 那是 fail-closed 的设计意图，
      #   **不许改门放行、不许降级为 WARN**，必须改补丁器。
      #   ⚠️ 唯一预期 WARN：_body 对括号不平衡会 IndexError（方向仍 fail-closed；
      #      这是同一处 nit 的第四次出现，已建议一次性修三个文件）。
      - name: Preflight - create_tensor allocation diag (CREATEDIAG) self-test
        run: |
          set -eux
          python3 oes-teflon/tools/selftest-creatediag.py

      # ★ AST 级「未定义名」检查 —— 语法合法 ≠ 名字存在。
      #   教训（两次，都是在门的错误分支上）：
      #     ① 我誊写 ocfix remap 版时把 TARGET_FN 打成 args_fn_name_placeholder，
