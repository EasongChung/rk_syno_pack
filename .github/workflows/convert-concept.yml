name: Convert Concept TFLite to RKNN

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps + SynoXtract
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libsodium-dev libmsgpack-dev curl
          g++ -O2 -std=c++17 -o tools/SynoXtract/synoxtract tools/SynoXtract/main.cpp -lsodium

      - name: Download and extract x86 SPK
        run: |
          curl -L --fail -o x86.spk "https://global.synologydownload.com/download/Package/spk/SynologyPhotos/1.9.1-10928/SynologyPhotos-x86_64-1.9.1-10928.spk"
          mkdir -p out/x86x out/x86
          ./tools/SynoXtract/synoxtract -i x86.spk -d out/x86x || true
          tar xf out/x86x/package.tgz -C out/x86 || tar xJf out/x86x/package.tgz -C out/x86 || true
          ls -la out/x86/models/concept/detector/
          echo "=== tflite magic ==="
          xxd out/x86/models/concept/detector/model_float16.tflite | head -3

      - name: Install rknn-toolkit2 (protobuf pinned, no tensorflow)
        run: |
          pip install --quiet "numpy==1.26.4" psutil "ruamel.yaml" scipy tqdm opencv-python fast-histogram 2>&1 | tail -2
          pip install --quiet "onnx==1.16.1" "onnxruntime>=1.10.0" flatbuffers "tf2onnx==1.17.0" 2>&1 | tail -2
          pip install --quiet "torch>=1.10.1,<=2.4.0" --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -2 || pip install --quiet "torch" 2>&1 | tail -2
          pip install --quiet "protobuf==4.25.4" "numpy==1.26.4" 2>&1 | tail -1
          python -c "import google.protobuf as p; print('protobuf', p.__version__)"
          pip download rknn-toolkit2==2.3.2 --no-deps -d whl 2>&1 | tail -2 || true
          ls whl/
          pip install --quiet --no-deps whl/rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl 2>&1 | tail -2
          python -c "import google.protobuf as p; print('protobuf', p.__version__)"
          python -c "import torch; print('torch', torch.__version__)" 2>&1 | tail -1
          python -c "import onnx; print('onnx', onnx.__version__, '| has mapping:', hasattr(onnx, 'mapping'))"

      - name: Inspect TFLite (no tensorflow)
        run: |
          python - << 'EOF'
          import os
          p = 'out/x86/models/concept/detector/model_float16.tflite'
          print('size:', os.path.getsize(p))
          with open(p,'rb') as f: head = f.read(8)
          print('head:', head.hex(), 'is TFL3:', head[4:8] == b'TFL3')
          print('expected: input [1,395,395,3] fp32 -> output [1,335] fp32 (from earlier tf-lite run)')
          EOF

      - name: Convert TFLite -> ONNX -> RKNN
        run: |
          python -m tf2onnx.convert --tflite out/x86/models/concept/detector/model_float16.tflite --output concept.onnx --opset 13 2>&1 | tail -5 || true
          ls -la concept.onnx 2>/dev/null || echo "tf2onnx failed"
          python - << 'EOF'
          import numpy as np, os, types
          # shim: rknn-toolkit2 compiled .so uses onnx.mapping (removed in onnx>=1.14)
          import onnx
          if not hasattr(onnx, 'mapping'):
              m = types.SimpleNamespace()
              m.TENSOR_TYPE_TO_NP_TYPE = {
                  1: np.dtype('float32'), 2: np.dtype('uint8'), 3: np.dtype('int8'),
                  4: np.dtype('uint16'), 5: np.dtype('int16'), 6: np.dtype('int32'),
                  7: np.dtype('int64'), 9: np.dtype('bool'), 10: np.dtype('float16'),
                  11: np.dtype('float64'), 12: np.dtype('uint32'), 13: np.dtype('uint64'),
                  14: np.dtype('complex64'), 15: np.dtype('complex128'),
              }
              m.NP_TYPE_TO_TENSOR_TYPE = {v: k for k, v in m.TENSOR_TYPE_TO_NP_TYPE.items()}
              m.TENSOR_TYPE_TO_STORAGE_TENSOR_TYPE = m.TENSOR_TYPE_TO_NP_TYPE
              onnx.mapping = m
              print('onnx.mapping shim injected')
          assert os.path.exists('concept.onnx'), 'concept.onnx missing'
          from rknn.api import RKNN
          rknn = RKNN(verbose=True)
          rknn.config(mean_values=[[127.5,127.5,127.5]], std_values=[[127.5,127.5,127.5]], target_platform='rk3566')
          print('--> load_onnx')
          assert rknn.load_onnx(model='concept.onnx') == 0
          print('--> build')
          assert rknn.build(do_quantization=False) == 0
          print('--> export')
          assert rknn.export_rknn('concept_fp16.rknn') == 0
          rknn.release()
          print('FINAL OK')
          EOF
          ls -la *.rknn

      - name: Upload rknn
        uses: actions/upload-artifact@v4
        with:
          name: concept-rknn
          path: |
            *.rknn
            concept.onnx
            out/x86/models/concept/detector/labels.txt
            out/x86/models/concept/detector/thresholds.txt
          if-no-files-found: warn
