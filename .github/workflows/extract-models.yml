name: Extract Concept Models from SPK

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libsodium-dev libmsgpack-dev curl

      - name: Build SynoXtract
        run: |
          g++ -O2 -std=c++17 -o tools/SynoXtract/synoxtract tools/SynoXtract/main.cpp -lsodium

      - name: Download SPKs
        run: |
          curl -L --fail -o x86.spk "https://global.synologydownload.com/download/Package/spk/SynologyPhotos/1.9.1-10928/SynologyPhotos-x86_64-1.9.1-10928.spk"
          curl -L --fail -o arm.spk "https://global.synologydownload.com/download/Package/spk/SynologyPhotos/1.9.1-10928/SynologyPhotos-armada38x-1.9.1-10928.spk"
          ls -la *.spk

      - name: Extract SPKs and inner package.tgz
        run: |
          mkdir -p out/x86 out/arm
          ./tools/SynoXtract/synoxtract -i x86.spk -d out/x86x || true
          ./tools/SynoXtract/synoxtract -i arm.spk -d out/armx || true
          mkdir -p out/x86 out/arm
          tar xzf out/x86x/package.tgz -C out/x86
          tar xzf out/armx/package.tgz -C out/arm
          echo "=== x86 appstore tree ==="
          find out/x86 -maxdepth 3 -type d | head -40
          echo "=== model files in x86 ==="
          find out/x86 -type f \( -iname "*.pb" -o -iname "*.xml" -o -iname "*.bin" -o -iname "*.tflite" -o -iname "*.nb" -o -iname "*.onnx" -o -iname "*.dnn" -o -iname "*.model" \) | head -60
          echo "=== model files in arm ==="
          find out/arm -type f \( -iname "*.pb" -o -iname "*.xml" -o -iname "*.bin" -o -iname "*.tflite" -o -iname "*.nb" -o -iname "*.onnx" -o -iname "*.dnn" -o -iname "*.model" \) | head -60

      - name: Collect model dirs
        run: |
          mkdir -p models
          # preserve full directory structure of models/ and npu/ folders
          for arch in x86 arm; do
            find out/$arch -type d \( -name models -o -name npu -o -name detector -o -name network \) -print0 2>/dev/null | while IFS= read -r -d '' d; do
              rel=${d#out/$arch/}
              mkdir -p "models/$arch/$(dirname "$rel")"
              cp -r "$d" "models/$arch/$rel" 2>/dev/null || true
            done
          done
          echo "=== collected ==="
          find models -type f | head -80
          du -sh models || true

      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: concept-models
          path: models/
          if-no-files-found: warn
