name: tflite-runtime

# 交叉编译 TFLite 运行时 + 上机验证驱动（aarch64 / glibc）
# 目标设备：Amlogic A311D (G12B) + DSM 7.4.1-90080（glibc 2.36）
#
# ## 为什么需要这个 workflow
#
# 我们已经验证过「delegate 能加载」（teflon_dlopen → EXIT=0），
# 但那证明不了「delegate 能接管节点」。
#
# Mesa tfl_device.c 的 tflite_plugin_create_delegate()（L1687-1712）
# 只做两件事：找设备、把 PrepareDelegate 挂到 delegate->base.Prepare。
# 它从不调用 PrepareDelegate。
#
# PrepareDelegate 真正被回调是在 TFLite 解释器 AllocateTensors() 期间
# （ReplaceNodeSubsetsWithDelegateKernels 那一步）。
# 所以要看到逐节点接管表，必须有一个真正的 TFLite 解释器。
#
# ## 关键版本约束：TFLite 必须是 2.13.0
#
# libteflon.so 是 Mesa 24.3.0 按它 vendored 的 **TFLite 2.13.0** 头文件编译的。
# delegate 通过 TfLiteContext 这个 C 结构体的**函数指针表**访问解释器，
# 该表在 TFLite 大版本之间会变。若用 2.14+ 的运行时去加载
# 2.13 头编译的 delegate，函数表布局不匹配 → 静默读到错误的函数指针。
# 因此这里严格对齐 2.13.0，不接受 "用最新版"。
#
# ## sysroot 为什么用 Debian bullseye（glibc 2.31）
#
# 设备是 glibc 2.36。Ubuntu 24.04(noble) 的 arm64 交叉包是 glibc 2.39，
# 而 glibc ≥2.38 在 stdlib.h 里做了
#     #define strtol __isoc23_strtol      （版本节点 GLIBC_2.38）
# 设备 2.36 没有这些符号 → 产物在设备上加载即失败。
# bullseye 2.31 产出最高 GLIBC_2.34，安全低于设备 2.36。
# 本 job 末尾有 glibc 符号天花板闸门强制校验。
#
# ## 与 build-teflon.yml 的关系
#
# 独立 workflow，不动主 workflow。
# 理由：TFLite 编译吃内存较大（历史上 onnx2tf 在 runner 上 OOM 过），
# 崩了不能连带把 libteflon.so 的产物也带走。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tflite-runtime.yml'
      - 'oes-teflon/build-recipe/make-sysroot-cxx.sh'
      - 'oes-teflon/verify/tf_load_check.cpp'
    branches: [ main ]

jobs:
  build:
    name: build TFLite runtime + tf_load_check (aarch64-glibc)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 全部 amd64 原生包；aarch64 sysroot 由 make-sysroot-cxx.sh
      # 从 Debian 池自行组装，因此不执行 dpkg --add-architecture，
      # 也就不会向 Ubuntu 源请求 arm64 索引。
      - name: Install build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cmake ninja-build pkg-config \
            python3 wget curl git patchelf binutils \
            ca-certificates

      - name: Verify toolchain
        run: |
          set -eux
          aarch64-linux-gnu-gcc -dumpmachine
          aarch64-linux-gnu-g++ -dumpmachine
          cmake --version | head -1
          ninja --version

      # 【第3次·决定性】去掉冲突后仍失败，且暴露了根本矛盾：
      #   undefined reference to `__isoc23_strtol'        ← glibc 2.38+
      #   undefined reference to `__libc_single_threaded' ← glibc 2.32+
      #   undefined reference to `_dl_find_object'        ← glibc 2.35+
      #   undefined reference to `arc4random'             ← glibc 2.36+
      #   这些来自 Ubuntu gcc-13 **静态链入**的 libstdc++.a / libgcc_eh.a，
      #   它们本身是按 glibc 2.39 编译的 → 无论怎么调 include 都消不掉。
      #   结论：**Ubuntu 24.04 的交叉工具链无法产出 glibc≤2.36 兼容的 C++ 二进制。**
      #
      # 【最终解法】改用 Debian bullseye 官方的 gcc-10-aarch64-linux-gnu 交叉工具链。
      #   编译器(gcc-10) / libstdc++(10) / glibc(2.31) 三者同源同版本，
      #   不存在任何跨版本混用。libteflon.so 那边用 Ubuntu 工具链编 C 是没问题的
      #   （纯 C 不碰 libstdc++/libgcc 展开器），C++ 才必须换。
      #
      # 用 --download-only + 手动解包，**不污染 runner**：
      #   bullseye 的交叉包会依赖 bullseye 的 libc6（宿主 amd64），
      #   真安装会与 Ubuntu 24.04 的 glibc 2.39 冲突并可能降级破坏 runner。
      #   下载解包到 $SR 独立前缀，runner 本身不动。
      - name: Fetch Debian bullseye cross toolchain (gcc-10 aarch64) + build sysroot
        run: |
          set -eux
          SR="$RUNNER_TEMP/sysroot"
          DEBS="$RUNNER_TEMP/debs"

          # ---- 1. 原有 sysroot（Debian bullseye arm64 glibc 2.31）----
          chmod +x oes-teflon/build-recipe/make-sysroot-cxx.sh
          sh oes-teflon/build-recipe/make-sysroot-cxx.sh "$SR"

          # ---- 2. Debian bullseye 交叉工具链（gcc-10 aarch64-linux-gnu）----
          # ⚠️ GitHub runner 的 step 不是 root。
          #    - 写 /etc/apt/sources.list.d/     → Permission denied
          #    - apt-get update 写 /var/lib/apt/lists/lock → Permission denied
          #    两条都要处理：sources 放 $RUNNER_TEMP 由 -o 指过去（避第一步），
          #    update 本身必须 sudo（它要写系统索引目录）。
          # [trusted=yes]：Ubuntu 的 keyring 里没有 Debian bullseye 的归档密钥
          # （NO_PUBKEY 0E98404D386FA1D9 等）。这里只用来下载交叉工具链，
          # 且已用 --download-only + 手动解包，不进入 runner 的信任链。
          echo "deb [trusted=yes] http://deb.debian.org/debian bullseye main" \
            > "$RUNNER_TEMP/bullseye.list"
          APT_OPTS="-o Dir::Etc::sourcelist=$RUNNER_TEMP/bullseye.list -o Dir::Etc::sourceparts=/dev/null -o APT::Get::List-Cleanup=0"
          sudo apt-get update -qq $APT_OPTS

          # 显式列出，不走依赖求解：
          # apt 的自动求解会拉 bullseye 的 libc6（宿主 amd64）并要求降级，会失败。
          # 这几个包在 Ubuntu 上都有等价物，宿主侧运行依赖由系统满足。
          # 不需要 gcc-10-base/libgcc-s1:arm64 —— 链接用 -static-libgcc，
          # arm64 侧只要 libgcc-10-dev-arm64-cross 提供 libgcc.a 即可。
          cd "$RUNNER_TEMP"
          # binutils-aarch64-linux-gnu 必须带！
          # gcc-10 的 Depends 明确要求它 (>= 2.35.1)。漏了它，
          # gcc 找不到 aarch64 的 as/ld，会退回去用宿主 x86 的 as
          # → "as: unrecognized option '-EL'"（-EL 是 AArch64 目标标志）。
          XPKGS="gcc-10-aarch64-linux-gnu g++-10-aarch64-linux-gnu cpp-10-aarch64-linux-gnu \
                 libgcc-10-dev-arm64-cross gcc-10-cross-base \
                 gcc-10-aarch64-linux-gnu-base libstdc++-10-dev-arm64-cross \
                 binutils-aarch64-linux-gnu=2.35.2-2 binutils-common=2.35.2-2"

          # ---- 预检：包名必须真实存在于索引 ----
          # 之前踩过：gcc-10-cross 在 bullseye main 里不存在（它是
          # crossbuild-essential-arm64 提供的虚拟包），apt 直接报
          # "Unable to locate package"。这里先查索引，避免白跑一轮。
          # 包名是**已用 bullseye amd64 Packages 索引本地核实过**的清单。
          if ! apt-get download -qq $APT_OPTS $XPKGS 2>&1 | tee "$RUNNER_TEMP/dl.log"; then
            echo "ERROR: apt-get download 整体失败（上面是原始报错）"
            exit 1
          fi
          # 注意 $XPKGS 里可能有 "name=version" 形式（binutils 必须锁版本，
          # 否则 apt 会去找 runner 上已装的 Ubuntu 2.42，bullseye 源里没有），
          # 所以比对时要先剥掉 =version 部分。
          for p in $XPKGS; do
            pname=$(echo "$p" | sed 's/=.*//')
            if ls "$RUNNER_TEMP/${pname}_"*.deb >/dev/null 2>&1; then
              echo "  ✓ $p"
            else
              echo "  ✗ $p —— 包没下载下来，停止"
              ls "$RUNNER_TEMP"/*.deb 2>/dev/null | sed 's/^/    已下: /'
              apt-get download $APT_OPTS "$p" 2>&1 | tail -3 || true
              exit 1
            fi
          done
          ls -la "$RUNNER_TEMP"/*.deb
          mkdir -p "$SR"
          for d in "$RUNNER_TEMP"/*.deb; do
            [ -f "$d" ] || continue
            rm -rf "$RUNNER_TEMP/_x"; mkdir -p "$RUNNER_TEMP/_x"
            ( cd "$RUNNER_TEMP/_x" \
              && ar x "$d" \
              && tar xf data.tar.* \
              && rm -f data.tar.* control.tar.* debian-binary )
            cp -a "$RUNNER_TEMP/_x/." "$SR/"
          done
          rm -f "$RUNNER_TEMP"/*.deb

          # ---- 3. 宿主运行时库路径（关键）----
          # Debian 交叉 binutils 的 as/ld 是 **宿主 x86_64 程序**，运行时需要
          #   libopcodes-2.35.2-arm64.so / libbfd-2.35.2-arm64.so
          # （文件名带 arm64 只是 Debian 交叉包的命名习惯，内容是 x86_64）
          # 解包后落在 $SR/usr/lib/x86_64-linux-gnu/，
          # 而 gcc 是以子进程方式调 as/ld 的，不会走 sysroot 的库搜索路径
          # → "error while loading shared libraries: libopcodes-...: cannot open"
          # 必须把该目录放进 LD_LIBRARY_PATH。写进 GITHUB_ENV，后续所有 step 继承。
          export LD_LIBRARY_PATH="$SR/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          # 自检：as 能真正跑起来（不只存在，还要能执行）
          "$SR/usr/bin/aarch64-linux-gnu-as" --version | head -1
          "$SR/usr/bin/aarch64-linux-gnu-ld" --version | head -1

          # ---- 3b. 校验工具链就位 ----
          CXX="$SR/usr/bin/aarch64-linux-gnu-g++-10"
          test -x "$CXX"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          "$CXX" --version | head -1
          ls "$SR/usr/lib/gcc-cross/aarch64-linux-gnu/10/" | head
          # libgcc.a 必须是 arm64 的
          file "$SR/usr/lib/gcc-cross/aarch64-linux-gnu/10/libgcc.a" 2>/dev/null | head -1 || true
          ar t "$SR/usr/lib/gcc-cross/aarch64-linux-gnu/10/libgcc.a" 2>/dev/null | head -2 || true

          # ---- 4. 显式 include 列表 ----
          # Debian 的交叉 gcc 与 Ubuntu 一样，把 /usr/aarch64-linux-gnu/include
          # 写进了默认搜索路径（那是 Ubuntu 的 glibc 2.39 头）。
          # 必须 -nostdinc 并全部显式列出：
          #   GCC 自带：  $SR/usr/lib/gcc-cross/aarch64-linux-gnu/10/include
          #   libstdc++10：$SR/usr/include/c++/10{,/aarch64-linux-gnu}
          #   glibc 2.31：$SR/usr/include{,/aarch64-linux-gnu}
          # 三者同为 GCC 10 / glibc 2.31，无版本冲突。
          # ⚠️ 不要写死 libstdc++ 头的路径 —— Debian 的 multiarch 布局与常见写法**相反**：
          #   ✗ $SR/usr/include/c++/10/aarch64-linux-gnu        （不存在）
          #   ✓ $SR/usr/include/aarch64-linux-gnu/c++/10        （bits/c++config.h 在这）
          # 写死会在「fatal error: bits/c++config.h: No such file」上白跑一轮。
          # 这里用 glob 自动发现，配一条自检：必须能找到 bits/c++config.h。
          INC_FLAGS="-nostdinc"
          for d in "$SR"/usr/lib/gcc-cross/*/*/include \
                   "$SR"/usr/lib/gcc-cross/*/*/include-fixed \
                   "$SR"/usr/include/c++/* \
                   "$SR"/usr/include/*/c++/* \
                   "$SR"/usr/include/aarch64-linux-gnu \
                   "$SR"/usr/include ; do
            [ -d "$d" ] && INC_FLAGS="$INC_FLAGS -isystem $d"
          done
          echo "INC_FLAGS=$INC_FLAGS" >> "$GITHUB_ENV"
          echo "INC_FLAGS=$INC_FLAGS"

          # 自检：libstdc++ 与 glibc 的关键头必须都在
          if ! find "$SR" -path '*/bits/c++config.h' | grep -q .; then
            echo "ERROR: sysroot 里找不到 bits/c++config.h，libstdc++ 头没装上"
            find "$SR" -name 'c++config.h' || true
            exit 1
          fi
          echo "  ✓ bits/c++config.h 位于: $(find "$SR" -path '*/bits/c++config.h' | head -1 | sed "s|$SR|\$SR|")"
          [ -f "$SR/usr/include/features.h" ] || { echo "ERROR: 找不到 glibc features.h"; exit 1; }
          echo "  ✓ glibc features.h 就位"

          # 确认 Ubuntu 的 glibc 头确实不在列表里
          echo "$INC_FLAGS" | grep -q ' /usr/aarch64-linux-gnu/include' \
            && { echo "ERROR: Ubuntu glibc 2.39 头仍混入了 include 列表"; exit 1; } || true

          # ---- 5. probe 自检（含 glibc 符号天花板）----
          cat > "$RUNNER_TEMP/probe.cpp" <<'EOF'
          #include <cstdio>
          #include <vector>
          #include <string>
          #include <cstdlib>
          #include <cstdint>
          int main(){
            std::vector<std::string> v{"ok"};
            /* 用 :: 而不是 std:: —— std::aligned_alloc 是 C++17 才引入的，
               GCC 10 默认 -std=gnu++14 下 std:: 里没有它。
               ::aligned_alloc 来自 glibc stdlib.h（≥2.16），正好用来验头版本。 */
            void* p = ::aligned_alloc(64, 64);
            ::free(p);
            /* strtol 正是 glibc≥2.38 会被重定向到 __isoc23_strtol 的那个函数，
               调用它即可暴露头版本是否过高 —— 这是本 probe 的核心检查。 */
            std::printf("%s %ld\n", v[0].c_str(),
                        (long)::strtol("42", nullptr, 10));
            return 0;
          }
          EOF
          "$CXX" -O2 -std=c++17 --sysroot="$SR" $INC_FLAGS \
            -B "$SR/usr/lib/gcc-cross/aarch64-linux-gnu/10/" \
            -B "$SR/usr/bin/" \
            -L "$SR/usr/lib/aarch64-linux-gnu" \
            -L "$SR/lib/aarch64-linux-gnu" \
            -static-libstdc++ -static-libgcc \
            -o "$RUNNER_TEMP/probe" "$RUNNER_TEMP/probe.cpp"
          file "$RUNNER_TEMP/probe"
          readelf -h "$RUNNER_TEMP/probe" | grep Machine
          echo "=== NEEDED ==="; readelf -d "$RUNNER_TEMP/probe" | grep NEEDED || true
          max=$(readelf -V "$RUNNER_TEMP/probe" | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1 | cut -d. -f2)
          echo "probe 最高符号: GLIBC_2.${max:-?}  (设备 2.36)"
          if [ -n "$max" ] && [ "$max" -gt 36 ]; then
            echo "ERROR: probe 超出设备 glibc 2.36 —— 换工具链的思路不成立"
            readelf -sW "$RUNNER_TEMP/probe" | grep -E "GLIBC_2\.(3[7-9]|[4-9][0-9])" | head -10
            exit 1
          fi
          readelf -sW "$RUNNER_TEMP/probe" | grep -q "__isoc23" \
            && { echo "ERROR: 仍引用 __isoc23_*"; exit 1; } || true
          echo "OK: probe 符号版本符合设备"

      - name: Fetch TFLite source (2.13.0 — must match Mesa 24.3.0 vendored headers)
        run: |
          set -eux
          SRC="$RUNNER_TEMP/tfsrc"
          mkdir -p "$SRC"
          # 注意用 github.com 域（实测可达）；raw.githubusercontent.com 在部分网络不可达
          wget -q -O "$RUNNER_TEMP/tf.tar.gz" \
            "https://github.com/tensorflow/tensorflow/archive/refs/tags/v2.13.0.tar.gz"
          tar xzf "$RUNNER_TEMP/tf.tar.gz" -C "$SRC" --strip-components=1
          test -f "$SRC/tensorflow/lite/CMakeLists.txt"
          echo "TFLite source ready: $(du -sh "$SRC" | cut -f1)"
          # 打印版本，供日志留痕
          grep -m1 -r "TFLITE_VERSION" "$SRC/tensorflow/lite/core/c/common.h" 2>/dev/null || true

      - name: Build TFLite static lib (aarch64)
        run: |
          set -eux
          SRC="$RUNNER_TEMP/tfsrc"
          SR="$RUNNER_TEMP/sysroot"
          BUILD="$RUNNER_TEMP/tfbuild"

          # ---- 顶层 CMakeLists：把 driver 和 TFLite 放进同一个工程 ----
          # 不要再用独立的 g++ 命令行编 driver：那样要手工拼 flatbuffers/absl/ruy/
          # gemmlowp/fft2d 的 -I 路径，而 FetchContent 的目录布局随 CMake 版本变化，
          # 写死必错（第18次失败：find 一个都没找到）。
          # 放进同一个工程后 driver 通过链接 tensorflow-lite target 自动继承
          # 其 INTERFACE include 目录 —— 结构上消除这类问题。
          mkdir -p "$RUNNER_TEMP/drv"
          cp oes-teflon/verify/tf_load_check.cpp "$RUNNER_TEMP/drv/"
          cat > "$RUNNER_TEMP/drv/CMakeLists.txt" <<'DRVEOF'
          cmake_minimum_required(VERSION 3.16)
          project(tf_load_check CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          # TFLite 作为子工程构建（EXCLUDE_FROM_ALL 以免污染默认目标）
          add_subdirectory(${TFLITE_SRC}/tensorflow/lite tflite-build EXCLUDE_FROM_ALL)

          # driver 链接 tensorflow-lite → 自动获得 flatbuffers/absl 等 include 路径
          add_executable(tf_load_check ${CMAKE_CURRENT_SOURCE_DIR}/tf_load_check.cpp)
          target_link_libraries(tf_load_check PRIVATE tensorflow-lite)
          DRVEOF

          cat > "$RUNNER_TEMP/tc.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER   "$SR/usr/bin/aarch64-linux-gnu-gcc-10")
          set(CMAKE_CXX_COMPILER "$SR/usr/bin/aarch64-linux-gnu-g++-10")
          set(CMAKE_SYSROOT      "$SR")
          set(CMAKE_FIND_ROOT_PATH "$SR")
          # 交叉编译时不要去找宿主（amd64）的库
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          # TFLite 的 try_compile 会用到这些
          # $INC_FLAGS 含 -nostdinc：剔除 Ubuntu glibc 2.39 头，换 Debian 2.31 头。
          # -B 指向 Debian gcc-10 自己的 libgcc.a 与 binutils。
          # 详见上面 fetch 步骤的注释。
          set(CMAKE_C_FLAGS_INIT   "--sysroot=$SR $INC_FLAGS -B $SR/usr/lib/gcc-cross/aarch64-linux-gnu/10/ -B $SR/usr/aarch64-linux-gnu/bin/ -L $SR/usr/lib/aarch64-linux-gnu -L $SR/lib/aarch64-linux-gnu -static-libstdc++ -static-libgcc")
          set(CMAKE_CXX_FLAGS_INIT "-std=c++17 --sysroot=$SR $INC_FLAGS -B $SR/usr/lib/gcc-cross/aarch64-linux-gnu/10/ -B $SR/usr/aarch64-linux-gnu/bin/ -L $SR/usr/lib/aarch64-linux-gnu -L $SR/lib/aarch64-linux-gnu -static-libstdc++ -static-libgcc")
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          EOF

          # 交叉编译下 FindThreads 的两个标准开关：
          #  1. THREADS_PREFER_PTHREAD_FLAG=ON —— 用 -pthread 而不是 -lpthread。
          #     CMake 默认去找单独的 pthread 库并做运行时探测，交叉编译下探测必失败
          #     （报 "Could NOT find Threads"，即使 sysroot 里 libpthread.so 齐全）。
          #  2. CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY —— 只编译不链接可执行文件，
          #     避免交叉目标无法运行导致的误判。
          #
          # configure 失败时把 CMakeError.log 全部打出来。
          # try_compile 的真实编译错误（链接命令、缺哪个 .so、哪个符号）
          # 都记在这里，只看 stdout 的 "Could NOT find Threads" 是猜不出原因的。
          if ! cmake -S "$SRC/tensorflow/lite" -B "$BUILD" -G Ninja \
               -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/tc.cmake" \
               -DCMAKE_BUILD_TYPE=Release \
               -DBUILD_SHARED_LIBS=OFF \
               -DTFLITE_ENABLE_XNNPACK=OFF \
               -DTFLITE_ENABLE_GPU=OFF \
               -DTFLITE_ENABLE_RUY=OFF \
               -DTFLITE_ENABLE_MMAP=OFF \
               -DTFLITE_ENABLE_INSTALL=OFF \
               -DTFLITE_ENABLE_DELEGATE_LIBRARY=OFF \
               -DBUILD_TESTS=OFF \
               -DTHREADS_PREFER_PTHREAD_FLAG=ON \
               -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
               -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/fc" ; then
            echo "================= CMake 失败：真实编译错误 ================="
            for f in $(find "$BUILD" "$RUNNER_TEMP/tfbuild" -name CMakeError.log 2>/dev/null | sort -u); do
              echo "---- $f ----"
              cat "$f"
            done
            echo "=============================================================="
            exit 1
          fi

          echo "=== TFLite 静态库 ==="
          cmake --build "$BUILD" --target tensorflow-lite -j"$(nproc)"

          # ---- driver：与 TFLite 同一工程，自动继承 include ----
          # 显式 -D 传路径，不依赖环境变量（上一轮 export 后 CMake 仍读到空值）
          cmake -S "$RUNNER_TEMP/drv" -B "$RUNNER_TEMP/drvbuild" -G Ninja \
            -DTFLITE_SRC="$SRC" \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/tc.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DTFLITE_ENABLE_XNNPACK=OFF -DTFLITE_ENABLE_GPU=OFF \
            -DTFLITE_ENABLE_RUY=OFF -DTFLITE_ENABLE_MMAP=OFF \
            -DTFLITE_ENABLE_INSTALL=OFF -DTFLITE_ENABLE_DELEGATE_LIBRARY=OFF \
            -DBUILD_TESTS=OFF \
            -DTHREADS_PREFER_PTHREAD_FLAG=ON \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/fc"
          cmake --build "$RUNNER_TEMP/drvbuild" --target tf_load_check -j"$(nproc)"

          cp "$RUNNER_TEMP/drvbuild/tf_load_check" "$RUNNER_TEMP/tf_load_check"
          readelf -h "$RUNNER_TEMP/tf_load_check" | grep Machine

          # 静态库位置因 CMake 版本而异，找出来即可
          find "$BUILD" -name 'libtensorflow-lite.a' -print
          LIB=$(find "$BUILD" -name 'libtensorflow-lite.a' | head -1)
          test -n "$LIB"
          echo "TFLITE_LIB=$LIB" >> "$GITHUB_ENV"
          ls -la "$LIB"

      # 关键安全闸：设备 glibc = 2.36，符号版本不得高于它。
      # 这条专门拦截 __isoc23_*（GLIBC_2.38）这类「CI 能过但上机失败」的坑。
      # TFLite 是 C++，最容易在这里踩到（libstdc++ / C++ 标准库符号）。
      - name: Glibc symbol ceiling check (device = 2.36)
        run: |
          set -eu
          CEIL=36
          fail=0
          for f in "$RUNNER_TEMP/tf_load_check"; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            max=$(readelf -V "$f" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' \
                  | sort -uV | tail -1 | cut -d. -f2)
            echo "  $name: 最高 GLIBC_2.${max:-?}  (上限 2.$CEIL)"
            if [ -n "$max" ] && [ "$max" -gt "$CEIL" ]; then
              echo "  ERROR: $name 使用 GLIBC_2.$max > 设备 2.$CEIL，会在设备上加载失败"
              fail=1
            fi
            if readelf -sW "$f" 2>/dev/null | grep -q "__isoc23"; then
              echo "  ERROR: $name 引用了 __isoc23_*（需 GLIBC_2.38+），设备 2.36 无此符号"
              fail=1
            fi
            echo "  NEEDED:"; readelf -d "$f" | grep NEEDED | sed 's/^/    /'
          done
          [ $fail -eq 0 ] || exit 1
          echo "OK: 产物符号版本 ≤ 设备 glibc 2.36"

      - name: Collect artifact
        run: |
          set -eux
          mkdir -p artifact
          cp "$RUNNER_TEMP/tf_load_check" artifact/
          {
            echo "tflite_version=2.13.0"
            echo "tflite_abi_note=必须与 Mesa 24.3.0 vendored 头文件一致（TfLiteContext 函数表跨版本会变）"
            echo "target=aarch64 / glibc 2.31 sysroot (Debian bullseye)"
            echo "toolchain=$(aarch64-linux-gnu-gcc -dumpmachine)"
            echo "gcc=$(aarch64-linux-gnu-gcc --version | head -1)"
            echo "cmake=$(cmake --version | head -1)"
            echo "runner=ubuntu-latest (amd64 packages only, no arm64 apt arch)"
            echo "device=Synology DSM 7.4.1-90080 / glibc 2.36 / A311D NPU"
            echo "usage=TEFLON_DEBUG=2 ./tf_load_check model.tflite   # 注意是 2 不是 1"
            echo "build_date=$(date -u +%FT%TZ)"
          } > artifact/BUILD-INFO.txt
          cat artifact/BUILD-INFO.txt
          ( cd artifact && sha256sum tf_load_check > SHA256SUMS )
          cat artifact/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tflite-runtime-aarch64-glibc
          path: artifact/
          retention-days: 30
          if-no-files-found: error