name: OES INT8 delivery - cleaned-calib QDQ + regression gate

# 交付判决轮：清洗校准集后的 QDQ 全链路 + 回归门。
# 前置法医结论（run 38862205495）：300 张 picsum 校准图里 5 张脏图把深层激活
# 推到 674~1633（中位仅 22.32），MinMax 忠实写入 scale -> int8 有效级数仅约 7 级。
# 本 workflow 验证"清洗后能否过回归门"（cos>=0.98 / top1>=0.95）。
# 只动本 workflow，不改原 4 个 workflow；不碰设备。

on:
  workflow_dispatch:
  push:
    paths:
      - tools/oes/ort_quant.py
      - tools/oes/ptq_forensics.py
      - tools/oes/regress.py
      - tools/oes/route_probe.py
      - tools/oes/min_probe.py
      - .github/workflows/qdq-clean-regress.yml

jobs:
  # 先定生死：用小图探完所有 TFLite 产出路线，选出能真出 INT8 的那条。
  # 独立 job：即使某条路线 OOM/失败也不影响交付主线。
  routeprobe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          set -euo pipefail
          # 顺序有讲究：onnx2tf 与 onnx==1.16.1 单次安装会解析冲突，
          # 故先装 onnx2tf 再回钉 onnx/ort（量化器对 ort 版本敏感）。
          pip install --quiet "numpy==1.26.4" pillow
          pip install --quiet "tensorflow-cpu==2.15.1"
          pip install --quiet "onnx2tf==1.29.24" onnx-graphsurgeon tflite
          pip install --quiet "onnx==1.16.1" "onnxruntime==1.16.3"
          pip install --quiet --no-deps "onnxruntime==1.16.3" "onnx==1.16.1"
      - name: Probe TFLite output routes
        run: |
          set -euo pipefail
          python tools/oes/route_probe.py out/route || true
      - name: Minimal onnx2tf QDQ check
        run: |
          set -euo pipefail
          python tools/oes/min_probe.py out/minprobe || true

  deliver:
    needs: routeprobe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 顺序有讲究：onnx2tf/tf-probability 会把 onnxruntime 顶到新版
      # （曾要求 ort==1.16.3 却实装 1.23.0，量化器行为不同 -> cos 0.96 掉到 0.60）。
      # 单次安装不可行：tf2onnx==1.16.1 与 onnx==1.16.1 存在解析冲突。
      # 故按主 workflow 的顺序安装，最后统一 pin + 断言。
      - name: Install deps (ordered, then re-pin + assert)
        run: |
          set -euo pipefail
          pip install --quiet "numpy==1.26.4" pillow
          pip install --quiet "onnx==1.16.1" "onnxruntime==1.16.3" "protobuf==4.25.4"
          pip install --quiet "tensorflow-cpu==2.15.1" "tf2onnx==1.16.1"
          pip install --quiet "onnx2tf==1.29.24" onnx-graphsurgeon
          pip install --quiet tflite
          pip install --quiet onnxsim "onnx-tf==1.10.0" "tensorflow-probability==0.23.0"
          # 关键：把被顶掉的版本按兼容组合重新钉住（ORT 量化器行为对版本敏感）
          pip install --quiet --no-deps "onnxruntime==1.16.3" "onnx==1.16.1" "numpy==1.26.4"
          python - <<'PY'
          import sys
          import numpy, onnx, onnxruntime, tensorflow, tf2onnx
          # onnxruntime 必须严格一致：量化器行为对版本敏感
          # （1.16.3 vs 1.23.0 给出 cos 0.96 vs 0.60）。
          # tensorflow 只影响 onnx2tf/TFLite 侧，tf-probability 会把它顶高，
          # 属已知无害漂移，故仅告警。
          strict = {'numpy': '1.26.4', 'onnx': '1.16.1',
                    'onnxruntime': '1.16.3', 'tf2onnx': '1.16.1'}
          soft = {'tensorflow': '2.15.1'}
          got = {'numpy': numpy.__version__, 'onnx': onnx.__version__,
                 'onnxruntime': onnxruntime.__version__,
                 'tensorflow': tensorflow.__version__,
                 'tf2onnx': tf2onnx.__version__}
          bad = []
          for k, v in strict.items():
              print('%s %-14s want=%-8s got=%s' % (
                  'OK  ' if got[k] == v else 'DRIFT', k, v, got[k]))
              if got[k] != v:
                  bad.append(k)
          for k, v in soft.items():
              print('%s %-14s want=%-8s got=%s%s' % (
                  'OK  ' if got[k] == v else 'WARN', k, v, got[k],
                  '' if got[k] == v else '  (known: tf-probability bump;'
                                        ' affects onnx2tf only, not QDQ)'))
          if bad:
              sys.exit('dependency drift: %s -- 本地/CI 结论不可比' % bad)
          import onnx2tf, tflite  # noqa
          print('onnx2tf', onnx2tf.__version__)
          PY

      - name: Fingerprint input model
        run: |
          set -euo pipefail
          test "$(stat -c%s tools/oes/models/model_float16.tflite)" = "12094724"

      - name: Fetch photo sets
        run: |
          set -euo pipefail
          python tools/oes/fetch_photos.py --dest calib --prefix oes-calib --count 300 --min-ok 50
          python tools/oes/fetch_photos.py --dest eval --prefix oes-eval --count 200 --min-ok 50

      - name: Preseed onnx2tf check images
        run: |
          set -euo pipefail
          python tools/oes/make_seed_npy.py --calib-dir calib \
            --out calibration_image_sample_data_20x128x128x3_float32.npy

      - name: Convert to repaired ONNX (skip quant)
        run: |
          set -euo pipefail
          python tools/oes/convert_to_int8.py --src tools/oes/models/model_float16.tflite \
            --workdir work --outdir out --calib-dir calib --num-calib 300 \
            --eval-dir eval --frontend-num 50 --skip-quant

      # 判决轮：清洗校准集 + MinMax -> 量化 -> INT8 TFLite。
      # A 路：QDQ + onnx2tf（已知丢量化，保留作对照）
      # B 路：QOperator 格式（本地实测 cos=0.9703/top1=0.9000，优于 QDQ 0.9569）
      #     再过 onnx2tf —— QOperator 用 ConvInteger/QLinearConv 等原生整型算子，
      #     比 QDQ 的伪量化更容易被翻译成真 int8。
      - name: Route A - QDQ via onnx2tf (control)
        run: |
          set -euo pipefail
          python tools/oes/ort_quant.py --onnx work/concept_split.onnx \
            --calib-dir calib --num-calib 300 --eval-dir eval --eval-num 50 \
            --workdir work --outdir out \
            --calib-method minmax --clean-calib --clean-k 3.0 \
            --exclude-head 6 --quant-format qdq --tag clean \
            || echo "ROUTE-A: exit=$? (report kept)"
          ls -la out/*.tflite || true

      - name: Route B - QOperator via onnx2tf
        run: |
          set -euo pipefail
          python tools/oes/ort_quant.py --onnx work/concept_split.onnx \
            --calib-dir calib --num-calib 300 --eval-dir eval --eval-num 50 \
            --workdir work --outdir out \
            --calib-method minmax --clean-calib --clean-k 3.0 \
            --exclude-head 6 --quant-format qoperator --tag clean \
            || echo "ROUTE-B: exit=$? (report kept)"
          ls -la out/*.tflite || true

      # 对每个产出的 tflite 跑 regress；无产物则硬失败（-oiqt 教训：
      # float 假绿绝不能进 regress）。--require-int8 会二次拦 float 模型。
      - name: Regression gate on all INT8 candidates
        run: |
          set -euo pipefail
          n=0
          for f in out/*.tflite; do
            [ -e "$f" ] || continue
            n=$((n+1))
            b=$(basename "$f" .tflite)
            echo "=== REGRESS $b ==="
            python tools/oes/regress.py \
              --ref tools/oes/models/model_float16.tflite \
              --quant "$f" --eval-dir eval --topk 1,5 \
              --require-int8 --out "out/report_${b}.json" \
              || echo "REGRESS ${b}: exit=$? (report kept)"
          done
          if [ "$n" -eq 0 ]; then
            echo "GATE ABORT: no tflite candidate produced"; exit 9
          fi
          echo "regress ran on $n candidate(s)"

      - name: Diagnose QDQ->TFLite quantization loss
        if: always()
        run: |
          set -euo pipefail
          Q=work/concept_ort_qdq_clean.onnx
          test -f "$Q" || { echo "DIAG: qdq onnx missing"; exit 0; }
          ls -la "$Q"
          python - "$Q" <<'PY'
          import sys, collections
          import onnx
          from onnx import numpy_helper
          m = onnx.load(sys.argv[1])
          ops = collections.Counter(n.op_type for n in m.graph.node)
          print('DIAG nodes=%d' % len(m.graph.node))
          print('DIAG op histogram:', dict(sorted(ops.items())))
          nq = ops.get('QuantizeLinear', 0) + ops.get('DequantizeLinear', 0)
          print('DIAG QDQ nodes=%d' % nq)
          assert nq > 0, 'QDQ graph has NO Q/DQ nodes'
          # dtype 审计：确认图里存在真 int8 激活张量
          vt = {}
          for v in list(m.graph.value_info) + list(m.graph.input):
              try:
                  vt[v.name] = v.type.tensor_type.elem_type
              except Exception:
                  pass
          ini = {i.name for i in m.graph.initializer}
          dq_in = collections.Counter()
          for n in m.graph.node:
              if n.op_type != 'DequantizeLinear':
                  continue
              dq_in[('init' if n.input[0] in ini else
                      {1: 'FLOAT', 2: 'UINT8', 3: 'INT8'}
                      .get(vt.get(n.input[0]), '?'))] += 1
          print('DIAG DQ input dtypes: %s' % dict(dq_in))
          print('DIAG QDQ graph has real int8 tensors -> conversion-side loss')
          PY
          # 找到 onnx2tf 实际产出的 tflite，逐个算子类型看清楚
          echo "=== DIAG: inspect produced tflite ==="
          python - <<'PY'
          import glob, collections, os
          import tflite
          for f in sorted(glob.glob('work/*.qd/**/*.tflite', recursive=True) +
                          glob.glob('work/*.qd/*.tflite')):
              raw = open(f, 'rb').read()
              mo = tflite.Model.GetRootAsModel(raw, 0)
              g = mo.Subgraphs(0)
              ops = collections.Counter()
              for i in range(g.OperatorsLength()):
                  ops[g.Operators(i).OpcodeIndex()] += 1
              codes = {}
              for i in range(mo.OperatorCodesLength()):
                  oc = mo.OperatorCodes(i)
                  codes[i] = (oc.BuiltinCode(),
                              oc.BuiltinCode() if oc.BuiltinCode() < 127
                              else oc.DeprecatedBuiltinCode())
              nt = g.TensorsLength()
              nq = sum(1 for i in range(nt)
                       if (q := g.Tensors(i).Quantization()) is not None
                       and q.ScaleLength() > 0)
              print('%s size=%d quantized=%d/%d' % (f, len(raw), nq, nt))
              for oc, cnt in ops.most_common(12):
                  print('   op%-4d builtin=%-6s x%d' % (oc, codes.get(oc), cnt))
          PY

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          echo "=== artifacts ==="
          ls -la out/ || true
          if [ -f out/report_ortq_clean.json ]; then
            echo "=== regression report ==="
            cat out/report_ortq_clean.json
          fi

      - name: Upload INT8 candidate + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oes-int8-cleaned
          path: |
            out/*.tflite
            out/report_*.json
            out/compare.json
            work/concept_ort_qdq_clean.onnx
            work/concept_ort_qdq_qoperator_clean.onnx
            work/concept_split.onnx
          if-no-files-found: warn