name: OES INT8 delivery - cleaned-calib QDQ + regression gate

# 交付判决轮：清洗校准集后的 QDQ 全链路 + 回归门。
# 前置法医结论（run 38862205495）：300 张 picsum 校准图里 5 张脏图把深层激活
# 推到 674~1633（中位仅 22.32），MinMax 忠实写入 scale -> int8 有效级数仅约 7 级。
# 本 workflow 验证"清洗后能否过回归门"（cos>=0.98 / top1>=0.95）。
# 只动本 workflow，不改原 4 个 workflow；不碰设备。

on:
  workflow_dispatch:
  push:
    paths:
      - tools/oes/ort_quant.py
      - tools/oes/ptq_forensics.py
      - tools/oes/regress.py
      - tools/oes/route_probe.py
      - tools/oes/min_probe.py
      - .github/workflows/qdq-clean-regress.yml

jobs:
  # 先定生死：用小图探完所有 TFLite 产出路线，选出能真出 INT8 的那条。
  # 独立 job：即使某条路线 OOM/失败也不影响交付主线。
  routeprobe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          set -euo pipefail
          # 顺序有讲究：onnx2tf 与 onnx==1.16.1 单次安装会解析冲突，
          # 故先装 onnx2tf 再回钉 onnx/ort（量化器对 ort 版本敏感）。
          pip install --quiet "numpy==1.26.4" pillow
          pip install --quiet "tensorflow-cpu==2.15.1"
          pip install --quiet "onnx2tf==1.29.24" onnx-graphsurgeon tflite
          pip install --quiet "onnx==1.16.1" "onnxruntime==1.16.3"
          pip install --quiet --no-deps "onnxruntime==1.16.3" "onnx==1.16.1"
      - name: Probe TFLite output routes
        run: |
          set -euo pipefail
          python tools/oes/route_probe.py out/route || true
      - name: Minimal onnx2tf QDQ check
        run: |
          set -euo pipefail
          python tools/oes/min_probe.py out/minprobe || true

  deliver:
    needs: routeprobe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 顺序有讲究：onnx2tf/tf-probability 会把 onnxruntime 顶到新版
      # （曾要求 ort==1.16.3 却实装 1.23.0，量化器行为不同 -> cos 0.96 掉到 0.60）。
      # 单次安装不可行：tf2onnx==1.16.1 与 onnx==1.16.1 存在解析冲突。
      # 故按主 workflow 的顺序安装，最后统一 pin + 断言。
      - name: Install deps (ordered, then re-pin + assert)
        run: |
          set -euo pipefail
          pip install --quiet "numpy==1.26.4" pillow
          pip install --quiet "onnx==1.16.1" "onnxruntime==1.16.3" "protobuf==4.25.4"
          pip install --quiet "tensorflow-cpu==2.15.1" "tf2onnx==1.16.1"
          pip install --quiet "onnx2tf==1.29.24" onnx-graphsurgeon
          pip install --quiet tflite
          pip install --quiet onnxsim "onnx-tf==1.10.0" "tensorflow-probability==0.23.0"
          # 关键：把被顶掉的版本按兼容组合重新钉住（ORT 量化器行为对版本敏感）
          pip install --quiet --no-deps "onnxruntime==1.16.3" "onnx==1.16.1" "numpy==1.26.4"
          python - <<'PY'
          import sys
          import numpy, onnx, onnxruntime, tensorflow, tf2onnx
          # onnxruntime 必须严格一致：量化器行为对版本敏感
          # （1.16.3 vs 1.23.0 给出 cos 0.96 vs 0.60）。
          # tensorflow 只影响 onnx2tf/TFLite 侧，tf-probability 会把它顶高，
          # 属已知无害漂移，故仅告警。
          strict = {'numpy': '1.26.4', 'onnx': '1.16.1',
                    'onnxruntime': '1.16.3', 'tf2onnx': '1.16.1'}
          soft = {'tensorflow': '2.15.1'}
          got = {'numpy': numpy.__version__, 'onnx': onnx.__version__,
                 'onnxruntime': onnxruntime.__version__,
                 'tensorflow': tensorflow.__version__,
                 'tf2onnx': tf2onnx.__version__}
          bad = []
          for k, v in strict.items():
              print('%s %-14s want=%-8s got=%s' % (
                  'OK  ' if got[k] == v else 'DRIFT', k, v, got[k]))
              if got[k] != v:
                  bad.append(k)
          for k, v in soft.items():
              print('%s %-14s want=%-8s got=%s%s' % (
                  'OK  ' if got[k] == v else 'WARN', k, v, got[k],
                  '' if got[k] == v else '  (known: tf-probability bump;'
                                        ' affects onnx2tf only, not QDQ)'))
          if bad:
              sys.exit('dependency drift: %s -- 本地/CI 结论不可比' % bad)
          import onnx2tf, tflite  # noqa
          print('onnx2tf', onnx2tf.__version__)
          PY

      - name: Fingerprint input model
        run: |
          set -euo pipefail
          test "$(stat -c%s tools/oes/models/model_float16.tflite)" = "12094724"

      - name: Fetch photo sets
        run: |
          set -euo pipefail
          python tools/oes/fetch_photos.py --dest calib --prefix oes-calib --count 300 --min-ok 50
          python tools/oes/fetch_photos.py --dest eval --prefix oes-eval --count 200 --min-ok 50

      - name: Preseed onnx2tf check images
        run: |
          set -euo pipefail
          python tools/oes/make_seed_npy.py --calib-dir calib \
            --out calibration_image_sample_data_20x128x128x3_float32.npy

      - name: Convert to repaired ONNX (skip quant)
        run: |
          set -euo pipefail
          python tools/oes/convert_to_int8.py --src tools/oes/models/model_float16.tflite \
            --workdir work --outdir out --calib-dir calib --num-calib 300 \
            --eval-dir eval --frontend-num 50 --skip-quant

      # 判决轮：清洗校准集 + MinMax -> 量化 -> INT8 TFLite。
      # 主攻 Route T：绕过 onnx2tf 的 INT8 导出（三条 onnx2tf 路线已证
      #   都不产出 _full_integer_quant.tflite，CI run 38900946439 实测），
      #   直接用 tf.lite.TFLiteConverter 对 onnx2tf 的 SavedModel 产物做
      #   INT8 量化（该步 cos=1.0 已验证）。
      # 校准集用清洗后的同一批图（清洗是根因修复，covered_hi 812->35）。
      - name: Route T - TFLiteConverter direct (och stop-loss step 2)
        run: |
          set -euo pipefail
          python tools/oes/qdq_to_tflite_tf.py \
            --float-onnx work/concept_split.onnx \
            --calib-dir calib --calib-num 100 \
            --workdir work --out out/concept_int8_tf.tflite \
            --input-name inputs_0 \
            || echo "ROUTE-T: exit=$? (report kept)"
          ls -la out/*.tflite || true

      # 对照组：旧版 TFLite 量化器。用于判定 1.334441e+36 退化 scale
      # 是否 MLIR 独有（旧量化器若无退化 -> 无需 post-hoc requantize；
      # 若同样退化 -> 必须走 requantize 路线）。
      - name: Route T-legacy - old TFLite quantizer (control)
        run: |
          set -euo pipefail
          python tools/oes/qdq_to_tflite_tf.py \
            --float-onnx work/concept_split.onnx \
            --calib-dir calib --calib-num 100 \
            --workdir work --out out/concept_int8_tf_legacy.tflite \
            --input-name inputs_0 --old-quantizer \
            || echo "ROUTE-T-LEGACY: exit=$? (report kept)"
          ls -la out/*.tflite || true

      # PADV2 -> PAD 改写（legacy 产物）：PADV2 的 constant_values 与
      # 量化后的 int8 input 类型冲突，TFLite 内核拒绝 prepare
      # （"pad.cc:230 ... INT8 != FLOAT32"）。PAD 固定 0 填充，与
      # 本图 PADV2 的 constant_value=0 语义等价。
      - name: Fix PADV2 -> PAD in legacy model
        run: |
          set -euo pipefail
          SRC=out/concept_int8_tf_legacy.tflite
          DST=out/concept_int8_fixed.tflite
          test -f "$SRC" || { echo "FIX: no legacy model"; exit 0; }
          # 不用 `|| echo` 吞退出码：那样 traceback 会被掩盖，
          # 步骤仍报 success，产物却根本没生成（run 38992257089 就是
          # 这样假绿了两轮，真实错因是 ModelT.Pack() 缺 builder 参数）。
          # 改写失败 = 无可交付产物，必须让步骤红。
          if python tools/oes/tflite_fix_padv2.py \
               --in "$SRC" --out "$DST" --dry-run; then
            echo "FIX: dry-run passed (pack + revalidate OK)"
          else
            echo "FIX: dry-run FAILED - traceback above is authoritative"
            exit 1
          fi
          if python tools/oes/tflite_fix_padv2.py --in "$SRC" --out "$DST"; then
            echo "FIX: rewrite OK"
          else
            echo "FIX: rewrite FAILED - traceback above is authoritative"
            exit 1
          fi
          # 硬门：产物必须真的存在且非空，否则后面 regress 会去测旧文件
          test -s "$DST" || { echo "FIX: $DST missing/empty"; exit 1; }
          ls -la out/*.tflite || true

      # 对照实验：给全部未量化张量补量化参数，验证 och 的段错误根因。
      #
      # och 真机（EXIT=139）根因已源码确认：tfl_device.c L238-239 对
      # **全部**张量无条件调 fill_tensor，而 fill_tensor 只跳过
      # kTfLiteNoType，随后无条件解引用 quant->scale->data[0]。
      # 模型有 20 个未量化 INT32 常量 -> quant==NULL -> 段错误。
      #
      # 本实验若成功（补全后 TFLite 能加载且 regress 不崩），
      # 即反证根因成立。注意：这是**为迁就旧版 delegate 而改变模型形态**，
      # 不是修复；它不改变 24.3.0 的接管率上限（仍 56/201 = 27.86%）。
      # 正解仍是换 main 版 delegate（91.54%）。
      #
      # 两个变体用于隔离变量：
      #   _allq        = 补量化参数 + PADV2->PAD
      #   _allq_nopadv = 只补量化参数（PADV2 保持不变）
      # 若只有 _allq 能加载，则 PADV2 的类型冲突仍是独立阻塞项。
      # control_allq 已删除（och 第15轮）：
      #   崩溃真根因已定位为 Mesa 的 NPU 类型判定（DRM 版本号当代理，
      #   与模型完全无关），故「未量化张量导致崩溃」这条前提作废。
      #   och 明确要求不要重跑本实验，也不再依赖其结论。

      # Route C/A（onnx2tf output_integer_quantized_tflite）已证死并删除：
      #   CI run 38900946439 实测其产物目录只有 float32 / float16 /
      #   dynamic_range_quant 三个文件，从不产出 _full_integer_quant.tflite。
      #   该结论已固化在 tools/oes/qdq_to_tflite_tf.py 的头注释里。
      # 现在唯一产出 int8 的路径是 Route T（TFLiteConverter 直出）。

      # per-tensor 权重变体（och 第15轮任务）：
      #   teflon 的 tensor_quantization_supported() 要求
      #       affine->scale->size == 1 && affine->zero_point->size == 1
      #   conv 权重是 per-channel（scale->size == out_channels）→
      #   Conv2d/DWConv2d 判定失败 → 全部留 CPU（真机实测 19 个被接管
      #   的算子是 CONCAT×16 + PAD×3，卷积一个没上）。
      #
      # 本变体只改「权重 per-channel -> per-tensor」这一个变量：
      #   同一 float ONNX、同一清洗校准集、同一 calib-num、同一量化器、
      #   同一结构。/ --exclude-head 侧与主产物一致（TFLite 链本就没有该参数）。
      #
      # 硬门：产物必须真的变成 per-tensor（用 check_pc.py 从 flatbuffer
      # 读 scale 数组长度验证）。若转换器不认开关，如实让步骤红，
      # 绝不把 per-channel 产物冒充成 per-tensor。
      - name: Route T-per-tensor - per-tensor weights (och NPU task)
        run: |
          set -euo pipefail
          OUT=out/concept_int8_pertensor.tflite
          python tools/oes/qdq_to_tflite_tf.py \
            --float-onnx work/concept_split.onnx \
            --calib-dir calib --calib-num 100 \
            --workdir work --out "$OUT" \
            --input-name inputs_0 --per-tensor-weights \
            || echo "ROUTE-T-PT: exit=$? (report kept)"
          ls -la "$OUT" 2>/dev/null || true
          echo "=== verify per-tensor actually took effect ==="
          if [ -s "$OUT" ]; then
            python tools/oes/check_pc.py --model "$OUT" \
              --expect per-tensor --verbose \
              || echo "PT-GATE: NOT per-tensor - the converter ignored the switch; this is itself the answer och needs (honest negative result)" 
          fi
          echo "=== baseline for comparison (per-channel) ==="
          [ -s out/concept_int8_tf.tflite ] && \
            python tools/oes/check_pc.py --model out/concept_int8_tf.tflite \
              || true

      # ★ 验证假设：删掉退化的 constant_values(133) 能否修好整条退化链
      #
      # 背景（och 第20轮）：
      #   per-tensor 模型有 6 个退化张量（scale≈1.33e36=FLT_MAX/255）：
      #     127/131 Int32(bias, pseudo_qconst106/110)
      #     133 Int8 无形状(pseudo_qconst112) <- PadV2 的 constant_values
      #     139/140/141 Int8(relu/pad_2/maxpool 路径)
      #   机理：TF MinMax 对**从未被观测**的张量保留哨兵 {min=0,max=FLT_MAX}
      #        -> scale=(FLT_MAX-0)/255 -> requant 乘数≈0 -> 输出坍缩成 zp。
      #
      #   注意 127/131 是 **bias**，其 scale = in_scale * w_scale。
      #   若 in_scale 退化，bias_scale 是被**连坐**的，不是独立坏掉。
      #
      # 假设：133 是退化的源头（0 值常量的范围退化），
      #       PADV2->PAD 改写把它整个删掉 -> 整条链可能自愈。
      # 若假设成立：退化张量数大幅下降、输入敏感性恢复。
      # 若不成立：说明退化已烘焙进各张量自身的量化参数，需逐张量修。
      # 无论哪种，都是明确结论（不是猜测）。
      - name: Test hypothesis - PADV2 rewrite on per-tensor model
        run: |
          set -euo pipefail
          SRC=out/concept_int8_pertensor.tflite
          DST=out/concept_int8_pertensor_padfix.tflite
          if [ ! -s "$SRC" ]; then
            echo "PT-PADFIX: $SRC missing, skip"; exit 0
          fi
          echo "########## BEFORE (degenerate count) ##########"
          python tools/oes/tflite_fix_padv2.py --in "$SRC" \
            --out /tmp/x.tflite --audit-only --survey-only || true
          python tools/oes/check_pc.py --model "$SRC" || true
          echo "########## rewrite PADV2 -> PAD ##########"
          python tools/oes/tflite_fix_padv2.py --in "$SRC" --out "$DST" \
            || echo "PT-PADFIX: rc=$?"
          echo "########## AFTER (degenerate count + per-tensor preserved?) ##########"
          if [ -s "$DST" ]; then
            python tools/oes/tflite_fix_padv2.py --in "$DST" \
              --out /tmp/x.tflite --audit-only || true
            python tools/oes/check_pc.py --model "$DST" \
              --expect per-tensor --verbose || true
          fi
          ls -la "$DST" 2>/dev/null || echo "(no output model)"

      # ★ 移植 legacy 的正确尺度到 per-tensor 模型的退化张量（och 第21轮）
      #
      # 三条依据全部经本地数据验证（不是猜）：
      #  1. t139/t140/t141 名字+类型+形状与 legacy 完全匹配，源值 0.4730178415775299
      #  2. bias_scale == in_scale * w_scale（legacy 57/57、per-tensor 57/57 成立）
      #     -> t127/t131 是被退化输入"连坐"，可用公式重算
      #  3. t133 空形状 + 被 PADV2->PAD 孤立 -> 给合法形状与中性尺度
      #
      # 已证伪：删掉 t133 不能治愈整条链（实测 6->6 不变，run 39009507872）。
      - name: Transplant correct scales (legacy) into per-tensor degenerate tensors
        run: |
          set -euo pipefail
          DEGEN=out/concept_int8_pertensor.tflite
          SRC=out/concept_int8_fixed.tflite
          OUT=out/concept_int8_art13.tflite
          if [ ! -s "$DEGEN" ] || [ ! -s "$SRC" ]; then
            echo "TRANSPLANT: missing input, skip"; exit 0
          fi
          echo "########## dry-run (pack + revalidate gates a,b,c) ##########"
          if python tools/oes/transplant_scales.py \
               --degen "$DEGEN" --source "$SRC" --out "$OUT" --dry-run; then
            echo "TRANSPLANT: dry-run PASS"
          else
            echo "TRANSPLANT: dry-run FAILED - traceback above is authoritative"
            exit 1
          fi
          python tools/oes/transplant_scales.py \
            --degen "$DEGEN" --source "$SRC" --out "$OUT"
          test -s "$OUT" || { echo "TRANSPLANT: no output"; exit 1; }
          echo "=== gate c: conv weights still per-tensor? ==="
          python tools/oes/check_pc.py --model "$OUT" --expect per-tensor || true
          echo "=== gate a/b: degenerate + empty shape ==="
          python tools/oes/tflite_fix_padv2.py --in "$OUT" \
            --out /tmp/x.tflite --audit-only || true
          sha256sum "$OUT" || true

      # ★ 关键变体：legacy 量化器 + per-tensor 权重 + PADV2 修复
      #
      # 为什么必须补这一个：上面那个 per-tensor 变体做在 **MLIR** 路径上，
      # 而 MLIR 路径本身 cos=0.0021 就是崩坏的（6 个退化 scale）。
      # 实测 per-tensor(MLIR)=0.0002 与 MLIR 基线 0.0021 同属崩坏量级
      # —— **无法判断 per-tensor 的精度代价**，基线不可用。
      #
      # legacy 路径是唯一可用的基线（+PADV2 修复后 cos=0.8879），
      # 所以这里是唯一能给出「per-tensor 真实代价」的组合，
      # 也是唯一可能交付的 per-tensor 产物。
      - name: Route T-legacy-per-tensor - per-tensor + legacy + PADV2 fix
        run: |
          set -euo pipefail
          RAW=out/concept_int8_legacy_pt_raw.tflite
          OUT=out/concept_int8_legacy_pt.tflite
          python tools/oes/qdq_to_tflite_tf.py \
            --float-onnx work/concept_split.onnx \
            --calib-dir calib --calib-num 100 \
            --workdir work --out "$RAW" \
            --input-name inputs_0 --old-quantizer --per-tensor-weights \
            || echo "LEGACY-PT: exit=$? (report kept)"
          test -s "$RAW" || { echo "LEGACY-PT: no raw model"; exit 0; }
          # legacy 产物必须过 PADV2->PAD 修复，否则内核拒绝 prepare
          python tools/oes/tflite_fix_padv2.py --in "$RAW" --out "$OUT" \
            || echo "LEGACY-PT: padv2 fix rc=$?"
          test -s "$OUT" || { echo "LEGACY-PT: fix failed"; exit 0; }
          echo "=== verify per-tensor took effect ==="
          python tools/oes/check_pc.py --model "$OUT" \
            --expect per-tensor --verbose \
            || echo "LEGACY-PT: NOT per-tensor (honest negative result)"
          echo "=== degenerate scale check (legacy had 0) ==="
          python tools/oes/check_pc.py --model "$RAW" 2>/dev/null || true
          ls -la "$OUT"

      # ★ 导出评测图的原始张量字节（och 第18轮任务 2）
      #
      # 目的：证明**设备侧对真实图片输出正确**。regress 跑在 CI(x86)，
      # 没有设备侧证据；och 的合成输入（ramp）不能验正确性
      # （实测 CPU 输出几乎全饱和 mean=-127.68）。
      #
      # ⚠️ 两个基准，不要混（用户 2026-10-17 更正）：
      #   CPU 交付版 = 原模型 model_float16.tflite -> FLOAT32 I/O
      #   NPU 在研   = 量化版 -> INT8 I/O
      # 量化版只服务 NPU；CPU 没必要用量化版。两份都导出，文件名带
      # dtype 后缀（_f32 / _i8），避免两边都以为自己对齐了。
      #
      # 预处理直接 import regress.preprocess_input（单一真相源）。
      - name: Export per-image raw tensor bytes (CPU=orig f32, NPU=quant i8)
        run: |
          set -euo pipefail
          mkdir -p out/tensors
          echo "########## CPU baseline: ORIGINAL model (float32 I/O) ##########"
          python tools/oes/export_tensor_bytes.py \
            --model tools/oes/models/model_float16.tflite \
            --image eval/oes-eval-0000.jpg --outdir out/tensors \
            2>&1 | tee out/tensors/export_cpu_log.txt || true
          echo "########## NPU baseline: quantized model (int8 I/O) ##########"
          M=out/concept_int8_fixed.tflite
          if [ -s "$M" ]; then
            python tools/oes/export_tensor_bytes.py \
              --model "$M" --image eval/oes-eval-0000.jpg \
              --outdir out/tensors \
              2>&1 | tee out/tensors/export_npu_log.txt || true
          else
            echo "EXPORT: $M missing, NPU baseline skipped"
          fi
          echo "=== sha256 (for och to cross-check) ==="
          (cd out/tensors && sha256sum *.bin) | tee out/tensors/sha256.txt
          ls -la out/tensors/
      # 同集对照（och 第12轮任务）已完成并上报，结论：
      #   ORT QDQ cos=0.9624 top1=0.875  vs  TFLite cos=0.8879 top1=0.730
      #   （同一批 200 张 / 同一 ref / 同一个循环 —— 用 regress.py
      #   的 --quant-onnx 从代码层消除不可比性，而非手工对齐参数）
      # 随后 och 第14轮要求先验配置一致性，第15轮已查明差异：
      #   exclude-head: ORT=6, TFLite=0（TFLite 链无此参数）<- 决定性
      #   per-channel : 两侧均 per-channel（实测产物）<- 相同
      #   校准集      : ORT=293 张, TFLite=100 张
      # 该诊断已被 och 的 NPU 任务取代，故此处不再重复消耗 CI。
      # 需要时用 --quant-onnx 单独重跑即可。

      # 对每个产出的 tflite 跑 regress；无产物则硬失败（-oiqt 教训：
      # float 假绿绝不能进 regress）。--require-int8 会二次拦 float 模型。
      # float 基线必须跳过 --require-int8：它是 float 模型，本身就该被拒。
      - name: Publish float baseline for anchor
        run: |
          set -euo pipefail
          # och 第7轮要的"ref 本身多好"锚点：onnx2tf 的 float32 产物
          # vs 原始 float16 TFLite。这衡量的是"转换是否无损"，
          # 与"量化损失"是两件事，必须分开报，否则无法判断 0.98 门限是否合理。
          for f in work/sm_for_tf/*.tflite work/o2tf_int/*float32*.tflite; do
            [ -e "$f" ] || continue
            cp "$f" "out/baseline_float_$(basename "$f")"
          done
          ls -la out/ || true

      - name: Regression gate on all candidates
        run: |
          set -euo pipefail
          n=0
          err=0
          for f in out/*.tflite; do
            [ -e "$f" ] || continue
            b=$(basename "$f" .tflite)
            echo "=== REGRESS $b ==="
            case "$b" in
              baseline_float_*)
                # float 基线：不加 --require-int8（它本就是 float）
                python tools/oes/regress.py \
                  --ref tools/oes/models/model_float16.tflite \
                  --quant "$f" --eval-dir eval --topk 1,5 \
                  --out "out/report_${b}.json" \
                  && true
                rc=$?
                [ "$rc" -eq 3 ] || { echo "REGRESS ERR ${b}: rc=$rc"; \
                                     err=$((err+1)); }
                ;;
              *)
                python tools/oes/regress.py \
                  --ref tools/oes/models/model_float16.tflite \
                  --quant "$f" --eval-dir eval --topk 1,5 \
                  --require-int8 --out "out/report_${b}.json"
                rc=$?
                # exit 3 = 门限 MISS（可接受，报告已落盘）
                # 其它非零 = **错误**（如 NameError / 加载失败）——必须红。
                # 教训：run 39004180722 因 regress.py 的 NameError 而全部
                # 失败，却因 `|| echo` 让步骤报 success，掩盖了一整轮。
                if [ "$rc" -eq 3 ]; then
                  echo "REGRESS ${b}: gate MISS (rc=3, expected)"
                elif [ "$rc" -ne 0 ]; then
                  echo "REGRESS ${b}: ERROR rc=$rc"
                  err=$((err+1))
                fi
                ;;
            esac
            n=$((n+1))
          done
          if [ "$n" -eq 0 ]; then
            echo "GATE ABORT: no tflite candidate produced"; exit 9
          fi
          if [ "$err" -gt 0 ]; then
            echo "GATE ABORT: $err regress run(s) ERRORED (not merely missed)"
            exit 9
          fi
          echo "regress ran on $n candidate(s), 0 errors"

      # ★ 输入敏感性门（och 第19轮新增的**阻塞性**判据）
      #
      # 为什么必须有：concept_int8_tf.tflite 通过了全部既有检查
      # （真 INT8 / dtype 直方图干净 / 量化 94.1% / 无 float32 假绿），
      # **但它对任何输入都输出同一个常量**（och 真机 4 输入 1 哈希）。
      # ⇒ dtype 检查不足以判定模型可用，必须直接验证输出随输入变化。
      #
      # 放在 regress 之后：regress 的数值先拿到，本门只负责判"能不能用"。
      # 逐模型给判定（不隐藏任何一个），最后统一阻塞。
      - name: Input-sensitivity gate on all candidates (BLOCKING)
        if: always()
        run: |
          set -euo pipefail
          fail=0
          for f in out/*.tflite; do
            [ -e "$f" ] || continue
            b=$(basename "$f" .tflite)
            case "$b" in
              baseline_float_*) continue ;;   # float 对照不算候选
            esac
            echo "=== SENS $b ==="
            if python tools/oes/input_sensitivity.py --model "$f"; then
              echo "SENS $b: PASS"
            else
              # 不要在这里断言原因：失败可能是「常量输出」，也可能是
              # 「模型根本加载不了」（如 legacy 产物 pad.cc:230 拒绝 prepare）。
              # 二者都不可用，但**原因不同**，混为一谈会误导归因。
              # 判据以脚本自己的输出为准（它会明确打印 CONSTANT OUTPUT
              # 或抛加载异常）。
              echo "SENS $b: FAIL (unusable - see verdict above; could be"
              echo "  constant-output OR load failure, they are NOT the same)"
              fail=$((fail+1))
            fi
          done
          echo "SENS TOTAL FAILURES: $fail"
          if [ "$fail" -gt 0 ]; then
            echo "GATE ABORT: $fail candidate(s) ignore their input."
            echo "These must NOT be delivered or deployed."
            exit 9
          fi

      - name: Diagnose QDQ->TFLite quantization loss
        if: always()
        run: |
          set -euo pipefail
          Q=work/concept_ort_qdq_clean.onnx
          test -f "$Q" || { echo "DIAG: qdq onnx missing"; exit 0; }
          ls -la "$Q"
          python - "$Q" <<'PY'
          import sys, collections
          import onnx
          from onnx import numpy_helper
          m = onnx.load(sys.argv[1])
          ops = collections.Counter(n.op_type for n in m.graph.node)
          print('DIAG nodes=%d' % len(m.graph.node))
          print('DIAG op histogram:', dict(sorted(ops.items())))
          nq = ops.get('QuantizeLinear', 0) + ops.get('DequantizeLinear', 0)
          print('DIAG QDQ nodes=%d' % nq)
          assert nq > 0, 'QDQ graph has NO Q/DQ nodes'
          # dtype 审计：确认图里存在真 int8 激活张量
          vt = {}
          for v in list(m.graph.value_info) + list(m.graph.input):
              try:
                  vt[v.name] = v.type.tensor_type.elem_type
              except Exception:
                  pass
          ini = {i.name for i in m.graph.initializer}
          dq_in = collections.Counter()
          for n in m.graph.node:
              if n.op_type != 'DequantizeLinear':
                  continue
              dq_in[('init' if n.input[0] in ini else
                      {1: 'FLOAT', 2: 'UINT8', 3: 'INT8'}
                      .get(vt.get(n.input[0]), '?'))] += 1
          print('DIAG DQ input dtypes: %s' % dict(dq_in))
          print('DIAG QDQ graph has real int8 tensors -> conversion-side loss')
          PY
          # 找到 onnx2tf 实际产出的 tflite，逐个算子类型看清楚
          echo "=== DIAG: inspect produced tflite ==="
          python - <<'PY'
          import glob, collections, os
          import tflite
          for f in sorted(glob.glob('work/*.qd/**/*.tflite', recursive=True) +
                          glob.glob('work/*.qd/*.tflite')):
              raw = open(f, 'rb').read()
              mo = tflite.Model.GetRootAsModel(raw, 0)
              g = mo.Subgraphs(0)
              ops = collections.Counter()
              for i in range(g.OperatorsLength()):
                  ops[g.Operators(i).OpcodeIndex()] += 1
              codes = {}
              for i in range(mo.OperatorCodesLength()):
                  oc = mo.OperatorCodes(i)
                  codes[i] = (oc.BuiltinCode(),
                              oc.BuiltinCode() if oc.BuiltinCode() < 127
                              else oc.DeprecatedBuiltinCode())
              nt = g.TensorsLength()
              nq = sum(1 for i in range(nt)
                       if (q := g.Tensors(i).Quantization()) is not None
                       and q.ScaleLength() > 0)
              print('%s size=%d quantized=%d/%d' % (f, len(raw), nq, nt))
              for oc, cnt in ops.most_common(12):
                  print('   op%-4d builtin=%-6s x%d' % (oc, codes.get(oc), cnt))
          PY

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          echo "=== artifacts ==="
          ls -la out/ || true
          if [ -f out/report_ortq_clean.json ]; then
            echo "=== regression report ==="
            cat out/report_ortq_clean.json
          fi

      - name: Upload INT8 candidate + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oes-int8-cleaned
          path: |
            out/*.tflite
            out/report_*.json
            out/compare.json
            out/tensors/*.bin
            out/tensors/*.txt
            work/concept_ort_qdq_clean.onnx
            work/concept_ort_qdq_qoperator_clean.onnx
            work/concept_split.onnx
          if-no-files-found: warn