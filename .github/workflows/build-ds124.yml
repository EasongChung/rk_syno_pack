name: Build DS124 DSM Boot Image

on:
  workflow_dispatch:
    inputs:
      pat_url:
        description: 'DSM pat download URL (DS124)'
        required: false
        default: 'https://global.synologydownload.com/download/DSM/release/7.4.1/90080/DSM_DS124_90080.pat'
      syno_hw_version:
        description: 'Synology model spoof'
        required: false
        default: 'DS124'
      syno_sn:
        description: 'DSM serial number (default whitewash, override at dispatch)'
        required: false
        default: '152ALSN997256'
      syno_mac1:
        description: 'LAN1 MAC, 12 hex chars without colon (default whitewash)'
        required: false
        default: '00113242B90F'
      syno_custom_sn:
        description: 'custom serial (defaults to SN when empty)'
        required: false
        default: ''
      syno_fw_version:
        description: 'uboot version marker'
        required: false
        default: 'M.115'
      root_device:
        description: 'root= bootarg (DS124 XR layout uses /dev/sata1p1)'
        required: false
        default: '/dev/sata1p1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Brick-flag guard (fail fast before wasting a build)
        run: |
          if grep -n "DRIVER_MODESET" patches-vpu/rga-dumb-drv.c; then
            echo "ERROR: DRIVER_MODESET in rga-dumb-drv.c hard-bricks the box at boot."
            echo "Incidents: 2026-10-02 boot-ms.img and 2026-10-03 CI build (docs/08 §三.13)."
            echo "DRM_CAP_DUMB_BUFFER reporting is permanently dropped - userspace must use dma_heap."
            exit 1
          fi
          echo "OK: rga-dumb-drv.c carries no DRIVER_MODESET"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            cpio xz-utils patch curl e2fsprogs device-tree-compiler \
            dosfstools mtools gdisk gzip vim-common \
            libsodium-dev libmsgpack-dev libmsgpack-cxx-dev g++

      - name: Build SynoXtract
        run: |
          # tools/SynoXtract/main.cpp includes <msgpack.hpp>, the C++ wrapper
          # of msgpack-c.  Since Ubuntu 24.04 the C++ headers live in their
          # own package libmsgpack-cxx-dev; libmsgpack-dev now only carries
          # the C library, so without it this step fails with
          # "fatal error: msgpack.hpp: No such file or directory".
          g++ -O2 -std=c++17 -o tools/SynoXtract/synoxtract tools/SynoXtract/main.cpp -lsodium
          chmod +x tools/SynoXtract/synoxtract
          ./tools/SynoXtract/synoxtract --help 2>&1 | head -3 || true

      - name: Build kernel (rk3566)
        run: |
          SOC=rk3566 JOBS=4 ./build.sh kernel

      - name: Patch DSM124 pat initrd
        run: |
          SOC=rk3566 \
          PAT_URL="${{ github.event.inputs.pat_url }}" \
          ./build.sh pat

      - name: Pack boot images
        env:
          ROOT_DEVICE: ${{ github.event.inputs.root_device }}
          SYNO_HW_VERSION: ${{ github.event.inputs.syno_hw_version }}
          SYNO_SN: ${{ github.event.inputs.syno_sn }}
          SYNO_MAC1: ${{ github.event.inputs.syno_mac1 }}
          SYNO_CUSTOM_SN: ${{ github.event.inputs.syno_custom_sn }}
          SYNO_FW_VERSION: ${{ github.event.inputs.syno_fw_version }}
        run: |
          SOC=rk3566 ./build.sh updateimg

      - name: List outputs
        run: |
          find output build/rd.bin -type f -exec ls -la {} \; 2>/dev/null || true

      - name: Verify boot image
        run: |
          set -eu
          DTB=$(ls output/dsm/boot-root/boot/*.dtb)
          echo "== DTB: $DTB"
          echo -n "slot1_led_type="; fdtget -t s "$DTB" /internal_slot@1 led_type
          echo -n "slot1_led_green="; fdtget -t x "$DTB" /internal_slot@1 led_green
          echo -n "slot1_led_blue="; fdtget -t x "$DTB" /internal_slot@1 led_blue
          echo -n "slot1_sw_activity="; fdtget -t x "$DTB" /internal_slot@1/ahci sw_activity
          echo -n "green_default_trigger="; fdtget -t s "$DTB" /gpio-leds/green-led linux,default-trigger
          echo -n "npu_reg="; fdtget -t x "$DTB" /npu@fde40000 reg
          echo "== RGA/VPU kernel config (from build .config, authoritative)"
          grep -E "^CONFIG_ROCKCHIP_MULTI_RGA=|^# CONFIG_VIDEO_ROCKCHIP_RGA is not set|^CONFIG_DMABUF_HEAPS_CMA=" build/out/kernel-7.3/.config
          grep -qE "^CONFIG_ROCKCHIP_MULTI_RGA=y" build/out/kernel-7.3/.config || { echo "ERROR: multi_rga missing from kernel config"; exit 1; }
          grep -qE "^CONFIG_DMABUF_HEAPS_CMA=y" build/out/kernel-7.3/.config || { echo "ERROR: CMA heap missing - librga needs /dev/dma_heap/cma"; exit 1; }
          grep -qE "^CONFIG_DRM_OEC_RGA_DUMB=y" build/out/kernel-7.3/.config || { echo "ERROR: DRM dumb buffer device missing for librga"; exit 1; }
          echo "== DRM dumb device in DTB"
          fdtget -t s "$DTB" /oec-rga-dumb compatible
          echo "== bootargs"
          grep -o 'root=[^ ]*\|sn=[^ ]*\|custom_sn=[^ ]*\|mac1=[^ ]*\|vender_format_version=[^ ]*\|syno_hw_version=[^ ]*\|cma=[^ ]*' \
            output/dsm/boot-root/boot/extlinux/extlinux.conf
          grep -q 'cma=256M' output/dsm/boot-root/boot/extlinux/extlinux.conf || { echo "ERROR: cma=256M missing from bootargs (VPU DMA-heap path needs it)"; exit 1; }

      - name: Verify thermal policy (60/68/75 C ladder + NPU coupling)
        run: |
          set -euo pipefail
          DTB=$(ls output/dsm/boot-root/boot/*.dtb)
          echo "== Thermal ladder: 60 C start / 68 C mid / 75 C hard floor"
          T=/thermal-zones/soc-thermal/trips
          for pair in trip-point-0:60000 trip-point-2:68000 trip-point-1:75000 soc-crit:115000; do
            node="${pair%%:*}"; want="${pair##*:}"
            got=$(fdtget -t i "$DTB" "$T/$node" temperature)
            echo "  $node = $got"
            [ "$got" = "$want" ] || { echo "ERROR: $node temperature $got, expected $want"; exit 1; }
          done

          echo "== Cooling maps must bind CPU and NPU to all three trips"
          M=/thermal-zones/soc-thermal/cooling-maps
          for map in map0 map1 map2 map3 map4 map5 map6; do
            trip=$(fdtget -t x "$DTB" "$M/$map" trip)
            dev=$(fdtget -t x "$DTB" "$M/$map" cooling-device)
            [ -n "$trip" ] && [ -n "$dev" ] || { echo "ERROR: $map missing trip/cooling-device"; exit 1; }
            echo "  $map trip=$trip cooling-device=$dev"
          done
          # CPU ceilings: 60 C -> max state 1 (1416 MHz), 68 C -> max state 3
          # (816 MHz), 75 C -> max state 5 (408 MHz).  The second argument must
          # stay THERMAL_NO_LIMIT (0xffffffff) so the governor may drop all the
          # way to the lowest OPP instead of being fenced in at one frequency.
          # (state numbers assume the 1800 MHz OPP is deleted - see below)
          for pair in map3:1 map2:3 map0:5; do
            map="${pair%%:*}"; want="${pair##*:}"
            vals=$(fdtget -t x "$DTB" "$M/$map" cooling-device | tr ' ' '\n')
            # values are: phandle max_state min_state
            got_max=$(echo "$vals" | sed -n 2p); got_min=$(echo "$vals" | sed -n 3p)
            [ "$got_max" = "$want" ] || { echo "ERROR: $map max state $got_max, expected $want"; exit 1; }
            [ "$got_min" = "ffffffff" ] || \
              { echo "ERROR: $map min state $got_min, expected ffffffff (THERMAL_NO_LIMIT)"; exit 1; }
            echo "  $map max_state=$got_max min_state=$got_min (unlimited low end)"
          done
          # NPU must be a legal cooling-map target
          fdtget -t i "$DTB" /npu@fde40000 '#cooling-cells' | grep -qx 2 || \
            { echo "ERROR: npu@fde40000 missing #cooling-cells=2 (cannot be a map target)"; exit 1; }
          for pair in map4:1 map5:3 map6:5; do
            map="${pair%%:*}"; want="${pair##*:}"
            vals=$(fdtget -t x "$DTB" "$M/$map" cooling-device | tr ' ' '\n')
            got_max=$(echo "$vals" | sed -n 2p); got_min=$(echo "$vals" | sed -n 3p)
            [ "$got_max" = "$want" ] || { echo "ERROR: $map NPU max state $got_max, expected $want"; exit 1; }
            [ "$got_min" = "ffffffff" ] || \
              { echo "ERROR: $map NPU min state $got_min, expected ffffffff (THERMAL_NO_LIMIT)"; exit 1; }
          done

          echo "== CPU OPP voltage matrix (per-bin overrides must not bypass the board value)"
          # rockchip_set_opp_prop_name() picks "opp-microvolt-L<n>" by the chip's
          # leakage/PVTM bin and opp/of.c looks THAT property up first, so any
          # leftover per-bin property silently overrides the board value
          # (-50 mV measured on hardware at pvtm-volt-sel=1).  The board
          # deliberately deletes those inherited properties, so assert the
          # full matrix rather than a broad grep: plain voltage present and
          # correct, and no per-bin property left anywhere in the table.
          for pair in opp-408000000:850000 opp-600000000:850000 opp-816000000:850000 \
                      opp-1104000000:900000 opp-1416000000:1025000 \
                      opp-1608000000:1100000; do
            node="${pair%%:*}"; want="${pair##*:}"
            got=$(fdtget -t i "$DTB" "/cpu0-opp-table/$node" opp-microvolt | head -1)
            [ "$got" = "$want" ] || { echo "ERROR: $node opp-microvolt $got, expected $want"; exit 1; }
            echo "  $node opp-microvolt = $got uV"
          done
          if dtc -I dtb -O dts "$DTB" 2>/dev/null | grep -q 'opp-microvolt-L'; then
            echo "ERROR: cpu0-opp-table still carries opp-microvolt-L* (board voltage would be bypassed)"
            dtc -I dtb -O dts "$DTB" 2>/dev/null | grep -n 'opp-microvolt-L' | head
            exit 1
          fi
          echo "  no opp-microvolt-L* in cpu0-opp-table"

          echo "== 1800 MHz must NOT be offered (bad bin: hangs the box at 56 C)"
          if fdtget -l "$DTB" /cpu0-opp-table | grep -q '^opp-1800000000$'; then
            echo "ERROR: opp-1800000000 is back in the CPU OPP table."
            echo "       1800 MHz hard-hangs the box under >=2 core load (peak 56 C)."
            exit 1
          fi
          echo "  opp-1800000000 absent"

          echo "== CPU OPP set must stay at 6 entries (cooling state numbering depends on it)"
          # The cpufreq cooling state index runs from the TOP of the ascending
          # frequency table, so state N maps to freq_table[max_state-N].  The
          # thermal map limits above (1..2 / 3 / 5) are only correct while the
          # table has exactly 6 entries.  Adding or removing an OPP shifts every
          # state number and silently changes which frequency each tier means.
          opp_count=$(fdtget -l "$DTB" /cpu0-opp-table | grep -c '^opp-')
          echo "  cpu0-opp-table has $opp_count OPPs"
          [ "$opp_count" = "6" ] || {
            echo "ERROR: cpu0-opp-table has $opp_count OPPs, expected 6."
            echo "       Cooling state numbers in the thermal maps would shift -"
            echo "       renumber them together with this table."
            exit 1
          }

          echo "== Thermal driver must be compiled in"
          # Assert against build/out/kernel-7.3/.config, the file make actually
          # consumes - not the source defconfig (docs/03 rule 5).
          for sym in CONFIG_THERMAL CONFIG_CPU_THERMAL CONFIG_THERMAL_OF \
                      CONFIG_ROCKCHIP_THERMAL CONFIG_THERMAL_GOV_STEP_WISE \
                      CONFIG_THERMAL_DEFAULT_GOV_STEP_WISE CONFIG_CPU_FREQ \
                      CONFIG_CPU_FREQ_DT CONFIG_DEVFREQ_THERMAL; do
            grep -qE "^${sym}=y" build/out/kernel-7.3/.config || \
              { echo "ERROR: ${sym} missing from the built kernel config"; exit 1; }
            echo "  ${sym}=y"
          done
          echo "OK: thermal policy verified"

      - name: Verify CPU DVFS hook landed in uInitrd
        run: |
          set -euo pipefail
          # BOOT must be absolute: the unpack below runs inside a subshell that
          # cd's into /tmp/rdcheck, where a relative path no longer resolves.
          BOOT_DIR="output/dsm/boot-root/boot"
          [ -d "$BOOT_DIR" ] || { echo "ERROR: boot dir missing: $BOOT_DIR"; exit 1; }
          BOOT="$(cd "$BOOT_DIR" && pwd)"
          echo "== uInitrd must carry the CPU DVFS hook (1608 MHz cap + schedutil)"
          test -f "$BOOT/uInitrd" || { echo "ERROR: uInitrd not found at $BOOT/uInitrd"; exit 1; }
          rm -rf /tmp/rdcheck && mkdir -p /tmp/rdcheck
          if command -v lzma >/dev/null 2>&1; then
            ( cd /tmp/rdcheck && lzma -dc < "$BOOT/uInitrd" | cpio -idm --quiet )
          else
            ( cd /tmp/rdcheck && xz --format=lzma -dc < "$BOOT/uInitrd" | cpio -idm --quiet )
          fi
          test -f /tmp/rdcheck/linuxrc.syno.impl || { echo "ERROR: linuxrc.syno.impl missing from uInitrd"; exit 1; }
          test -f /tmp/rdcheck/usr/syno/sbin/rk3566_cpufreq_dvfs.sh || { echo "ERROR: rk3566_cpufreq_dvfs.sh missing from uInitrd (cpufreq hook not installed)"; exit 1; }
          test -f /tmp/rdcheck/usr/syno/sbin/rk3566_cpufreq_rcd.sh || { echo "ERROR: rk3566_cpufreq_rcd.sh missing from uInitrd"; exit 1; }
          grep -Fq '/bin/sh /usr/syno/sbin/rk3566_cpufreq_dvfs.sh "$Mnt"' /tmp/rdcheck/linuxrc.syno.impl || { echo "ERROR: cpufreq hook call missing from linuxrc.syno.impl"; exit 1; }
          grep -Fq '/bin/sh /usr/syno/sbin/rk3399_sync_model_dtb.sh "$Mnt"' /tmp/rdcheck/linuxrc.syno.impl || { echo "ERROR: model.dtb sync hook vanished from linuxrc.syno.impl"; exit 1; }
          grep -q 'CAP=1608000' /tmp/rdcheck/usr/syno/sbin/rk3566_cpufreq_dvfs.sh || { echo "ERROR: 1608 MHz cap is not baked into the hook"; exit 1; }
          grep -q 'CAP=1608000' /tmp/rdcheck/usr/syno/sbin/rk3566_cpufreq_rcd.sh || { echo "ERROR: 1608 MHz cap is not baked into the rc.d payload"; exit 1; }
          echo "OK: DVFS hook + 1608 MHz cap present in uInitrd"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ds124-boot-images
          path: |
            output/dsm/
            build/rd.bin
          if-no-files-found: error
