name: Convert Concept TFLite to INT8 (OES Teflon)

# OES(A311D) 路线：concept float16.tflite -> INT8 TFLite（Teflon 只吃 INT8）。
# 与 OEC 的 convert-concept.yml（RKNN 后端）并存；本文件只做 TFLite/Teflon，不动原有 4 个 workflow。
# 关键差异（理由见 tools/oes/README_oes.md）：全程保持 NHWC，不插 NCHW-Transpose；禁用 tflite2onnx。

on:
  workflow_dispatch:
  push:
    paths:
      - tools/oes/**
      - .github/workflows/convert-concept-oes.yml

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps (OEC-verified pins)
        run: |
          set -euo pipefail
          pip install --quiet "numpy==1.26.4" pillow
          pip install --quiet "onnx==1.16.1" "onnxruntime==1.16.3" "protobuf==4.25.4"
          pip install --quiet "tensorflow-cpu==2.15.1" "tf2onnx==1.16.1"
          pip install --quiet "onnx2tf==1.29.24" onnx-graphsurgeon
          pip install --quiet tflite
          python -c "import onnx2tf; print('onnx2tf', onnx2tf.__version__)"
          pip install --quiet onnxsim "onnx-tf==1.10.0" "tensorflow-probability==0.23.0"
          python -c "import tensorflow as tf; print('tf', tf.__version__)"
          python -c "import tf2onnx; print('tf2onnx', tf2onnx.__version__)"
          python -c "import onnxruntime as ort; print('ort', ort.__version__)"

      - name: Fingerprint input model
        run: |
          set -euo pipefail
          ls -la tools/oes/models/
          test "$(stat -c%s tools/oes/models/model_float16.tflite)" = "12094724"
          xxd -l 16 tools/oes/models/model_float16.tflite | grep -i TFL3
          wc -l tools/oes/models/labels.txt tools/oes/models/thresholds.txt

      - name: Fetch photo sets (calib + eval)
        run: |
          set -euo pipefail
          python tools/oes/fetch_photos.py --dest calib --prefix oes-calib --count 300 --min-ok 50
          python tools/oes/fetch_photos.py --dest eval --prefix oes-eval --count 200 --min-ok 50

      - name: Preseed onnx2tf check images (no download)
        run: |
          set -euo pipefail
          python tools/oes/make_seed_npy.py --calib-dir calib \
            --out calibration_image_sample_data_20x128x128x3_float32.npy
          ls -la *.npy

      - name: Convert TFLite -> ONNX -> INT8 (NHWC kept)
        run: |
          set -euo pipefail
          python tools/oes/convert_to_int8.py --src tools/oes/models/model_float16.tflite \
            --workdir work --outdir out --calib-dir calib --num-calib 300 \
            --eval-dir eval --frontend-num 50
          ls -la out/

      - name: Tensor profiles (float vs fixed, divergence hunt)
        run: |
          set -euo pipefail
          python tools/oes/dump_regions.py --model tools/oes/models/model_float16.tflite \
            --calib-dir calib --num 3 --out profile_float.json --float-input --preserve || echo "PROF-FLOAT: exit=$?"
          if [ -f out/concept_int8_fixed.tflite ]; then
            python tools/oes/dump_regions.py --model out/concept_int8_fixed.tflite \
              --calib-dir calib --num 3 --out profile_fixed.json --preserve || echo "PROF-FIXED: exit=$?"
          fi

      - name: Regression (quant vs float, all variants)
        run: |
          set -euo pipefail
          python tools/oes/regress.py --ref tools/oes/models/model_float16.tflite \
            --quant out/concept_int8.tflite --eval-dir eval --topk 1,5 --out report.json || echo "INT8-UINT8 GATE: exit=$?"
          python tools/oes/regress.py --ref tools/oes/models/model_float16.tflite \
            --quant out/concept_int8_floatio.tflite --eval-dir eval --topk 1,5 --out report_floatio.json || echo "INT8-FLOATIO GATE: exit=$?"
          python tools/oes/regress.py --ref tools/oes/models/model_float16.tflite \
            --quant out/concept_dyn.tflite --eval-dir eval --topk 1,5 --out report_dyn.json || echo "DYN GATE: exit=$?"
          if [ -f out/concept_legacy.tflite ]; then
            python tools/oes/regress.py --ref tools/oes/models/model_float16.tflite \
              --quant out/concept_legacy.tflite --eval-dir eval --topk 1,5 --out report_legacy.json || echo "LEGACY GATE: exit=$?"
          fi
          if [ -f out/concept_int8_fixed.tflite ]; then
            python tools/oes/regress.py --ref tools/oes/models/model_float16.tflite \
              --quant out/concept_int8_fixed.tflite --eval-dir eval --topk 1,5 --out report_fixed.json || echo "FIXED GATE: exit=$?"
          fi
          sha256sum out/concept_int8.tflite out/concept_int8_floatio.tflite out/concept_dyn.tflite \
            tools/oes/models/model_float16.tflite report.json report_floatio.json report_dyn.json | tee SHA256SUMS
          for f in out/concept_legacy.tflite out/concept_int8_fixed.tflite report_legacy.json report_fixed.json; do
            [ -f "$f" ] && sha256sum "$f" | tee -a SHA256SUMS || true
          done
          echo "=== report.json ==="; cat report.json | head -30
          echo "=== report_floatio.json ==="; cat report_floatio.json | head -30
          echo "=== report_dyn.json ==="; cat report_dyn.json | head -30

      - name: Upload INT8 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-int8-oes
          path: |
            out/concept_int8.tflite
            out/concept_int8_floatio.tflite
            out/concept_dyn.tflite
            out/concept_legacy.tflite
            out/concept_int8_fixed.tflite
            out/compare.json
            report.json
            report_floatio.json
            report_dyn.json
            report_legacy.json
            report_fixed.json
            profile_float.json
            profile_fixed.json
            SHA256SUMS
            work/graph_dump.txt
            work/concept_float_sd.try*.log
          if-no-files-found: warn
