name: Build Jellyfin FFmpeg (RK3566 / rkmpp)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_branch:
        description: 'nyanmisaka/jellyfin-ffmpeg branch with rockchip support'
        required: false
        default: 'next-rockchip'

jobs:
  build:
    # Native arm64 runner: no qemu. QEMU emulation died inside Rockchip's mpp
    # JPEG encoder HAL (hal_jpege_vepu540c.c exits 139) and segfaulted
    # python3-setuptools postinst, none of which happen on real hardware.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Build inside Debian bookworm (glibc 2.36, matches DSM 7.4)
        env:
          FFMPEG_BRANCH: ${{ github.event.inputs.ffmpeg_branch }}
        run: |
          set -eu
          mkdir -p /tmp/out
          cat > /tmp/build.sh <<'INNER'
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential pkg-config git wget ca-certificates \
            yasm nasm cmake ninja-build meson \
            libdrm-dev

          PREFIX=/usr/local
          echo "/usr/local/lib" > /etc/ld.so.conf.d/usrlocal.conf
          ldconfig

          cd /tmp
          git clone -b "$FFMPEG_BRANCH" --depth 1 https://github.com/nyanmisaka/jellyfin-ffmpeg.git ffmpeg
          echo "== rkmpp switches present in configure =="
          grep -c rkmpp ffmpeg/configure

          # ---- RKMPP (librockchip_mpp + librockchip_vpu) ----
          git clone -b jellyfin-mpp --depth 1 https://github.com/nyanmisaka/mpp.git
          mkdir -p mpp/build && cd mpp/build
          cmake \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TEST=OFF \
            -DHAVE_DRM=ON \
            ..
          make -j"$(nproc)"
          make install
          ldconfig
          cd /tmp

          # ---- RKRGA (librga) ----
          git clone -b jellyfin-rga --depth 1 https://github.com/nyanmisaka/rk-mirrors.git rkrga
          cd rkrga
          meson setup . build \
            --prefix="$PREFIX" \
            --libdir=lib \
            --buildtype=release \
            --default-library=shared \
            -Dcpp_args=-fpermissive \
            -Dlibdrm=false \
            -Dlibrga_demo=false
          ninja -C build
          meson install -C build
          ldconfig
          cd /tmp

          # ---- FFmpeg with rkmpp + rkrga ----
          cd ffmpeg
          ./configure \
            --prefix="$PREFIX" \
            --enable-shared \
            --disable-static \
            --disable-doc \
            --disable-debug \
            --enable-gpl \
            --enable-version3 \
            --enable-rkmpp \
            --enable-rkrga \
            --enable-libdrm \
            --enable-neon || {
            echo "== configure failed; dumping config.log tail =="
            tail -80 ffbuild/config.log
            exit 1
          }
          make -j"$(nproc)"
          make install
          ldconfig

          echo "== rkmpp decoders compiled in =="
          strings "$PREFIX"/lib/libavcodec.so* | grep -oE "h264_rkmpp|hevc_rkmpp|vp9_rkmpp|av1_rkmpp" | sort -u
          echo "== version =="
          "$PREFIX"/bin/ffmpeg -hide_banner -version | head -2
          echo "== glibc floor of the produced libs =="
          objdump -T "$PREFIX"/lib/libavcodec.so* 2>/dev/null | grep -oE "GLIBC_2\.[0-9]+" | sort -Vu | tail -1

          cd "$PREFIX"
          tar -czf /out/ffmpeg-rk3566-rkmpp.tar.gz \
            bin/ffmpeg bin/ffprobe lib/ include/
          INNER

          docker run --rm --platform linux/arm64 \
            -e FFMPEG_BRANCH="$FFMPEG_BRANCH" \
            -v /tmp/build.sh:/build.sh:ro \
            -v /tmp/out:/out \
            arm64v8/debian:bookworm bash /build.sh

          echo "== artifact =="
          ls -la /tmp/out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-rk3566-rkmpp
          path: /tmp/out/ffmpeg-rk3566-rkmpp.tar.gz
          if-no-files-found: error
