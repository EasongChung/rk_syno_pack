name: Build Jellyfin FFmpeg (RK3566 / rkmpp)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_branch:
        description: 'nyanmisaka/jellyfin-ffmpeg branch with rockchip support'
        required: false
        default: 'next-rockchip'

jobs:
  build:
    # Native arm64 hardware: no qemu emulation. A qemu-emulated build dies in
    # Rockchip's mpp JPEG encoder HAL (hal_jpege_vepu540c.c exits 139), which
    # no flag can fix.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup build directory
        run: |
          sudo mkdir -p /tmp/build
          sudo chown "$USER":"$USER" /tmp/build
          echo "workdir ready"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config yasm nasm cmake ninja-build meson \
            git wget ca-certificates \
            libdrm-dev libudev-dev \
            zlib1g-dev

      - name: Checkout jellyfin-ffmpeg (rockchip branch)
        working-directory: /tmp/build
        run: |
          git clone -b "${{ github.event.inputs.ffmpeg_branch }}" \
            --depth 1 https://github.com/nyanmisaka/jellyfin-ffmpeg.git ffmpeg
          cd ffmpeg
          echo "== branch =="
          git log --oneline -1
          echo "== rkmpp occurrences in configure =="
          grep -c rkmpp configure

      - name: Build RKMPP (librockchip_mpp)
        working-directory: /tmp/build
        run: |
          set -eu
          PREFIX=/opt/rk/usr
          mkdir -p "$PREFIX"
          rm -rf mpp
          git clone -b jellyfin-mpp --depth 1 https://github.com/nyanmisaka/mpp.git
          ls -la mpp/ | head -5
          ls mpp/CMakeLists.txt
          cd mpp
          mkdir build && cd build
          cmake \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TEST=OFF \
            -DHAVE_DRM=ON \
            ..
          make -j"$(nproc)"
          make install
          # The mpp cmake build installs no pkg-config file, which
          # --enable-rkmpp needs; synthesize one.
          mkdir -p "$PREFIX/lib/pkgconfig"
          printf '%s\n' \
            "prefix=$PREFIX" \
            'libdir=${prefix}/lib' \
            'includedir=${prefix}/include' \
            '' \
            'Name: rockchip_mpp' \
            'Description: Rockchip Media Process Platform' \
            'Version: 1.3.8' \
            'Libs: -L${libdir} -lrockchip_mpp' \
            'Cflags: -I${includedir}/rockchip' \
            > "$PREFIX/lib/pkgconfig/rockchip_mpp.pc"
          echo "== librockchip_mpp installed =="
          ls "$PREFIX"/lib/librockchip_mpp.so*

      - name: Build RKRGA (librga)
        working-directory: /tmp/build
        run: |
          set -eu
          PREFIX=/opt/rk/usr
          rm -rf rkrga
          git clone -b jellyfin-rga --depth 1 https://github.com/nyanmisaka/rk-mirrors.git rkrga
          ls rkrga/meson.build
          cd rkrga
          meson setup . build \
            --prefix="$PREFIX" \
            --libdir=lib \
            --buildtype=release \
            --default-library=shared \
            -Dcpp_args=-fpermissive \
            -Dlibdrm=false \
            -Dlibrga_demo=false
          ninja -C build
          meson install -C build
          echo "== librga installed =="
          ls "$PREFIX"/lib/librga.so*

      - name: Configure and build FFmpeg with rkmpp
        working-directory: /tmp/build
        run: |
          set -eu
          PREFIX=/opt/rk/usr
          cd ffmpeg
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" ./configure \
            --prefix="$PREFIX" \
            --enable-shared \
            --disable-static \
            --disable-doc \
            --disable-debug \
            --enable-gpl \
            --enable-version3 \
            --enable-rkmpp \
            --enable-rkrga \
            --enable-libdrm \
            --enable-neon
          make -j"$(nproc)"

      - name: Install and verify rkmpp decoders
        working-directory: /tmp/build
        run: |
          set -eu
          PREFIX=/opt/rk/usr
          cd ffmpeg
          make install
          echo "== installed ffmpeg =="
          ls -la "$PREFIX"/bin/ffmpeg
          echo "== rkmpp decoders compiled in =="
          strings "$PREFIX"/lib/libavcodec.so* | grep -oE "h264_rkmpp|hevc_rkmpp|vp9_rkmpp|av1_rkmpp" | sort -u
          echo "== version =="
          "$PREFIX"/bin/ffmpeg -hide_banner -version | head -2

      - name: Package artifact
        run: |
          set -eu
          cd /opt/rk/usr
          tar -czf /tmp/ffmpeg-rk3566-rkmpp.tar.gz \
            bin/ffmpeg bin/ffprobe \
            lib/ \
            include/
          ls -la /tmp/ffmpeg-rk3566-rkmpp.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-rk3566-rkmpp
          path: /tmp/ffmpeg-rk3566-rkmpp.tar.gz
          if-no-files-found: error
