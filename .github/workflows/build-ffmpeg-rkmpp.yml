name: Build Jellyfin FFmpeg (RK3566 / rkmpp)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_branch:
        description: 'nyanmisaka/jellyfin-ffmpeg branch with rockchip support'
        required: false
        default: 'next-rockchip'
      keep_debug:
        description: 'keep unstripped debug symbols'
        required: false
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install cross toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config yasm nasm cmake ninja-build meson \
            git wget xz-utils \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross
          echo "== note: no --enable-libdrm; rkmpp is the hwaccel we need =="

      - name: Checkout jellyfin-ffmpeg (rockchip branch)
        run: |
          git clone -b "${{ github.event.inputs.ffmpeg_branch }}" \
            --depth 1 https://github.com/nyanmisaka/jellyfin-ffmpeg.git ffmpeg
          cd ffmpeg
          echo "== branch =="
          git log --oneline -1
          echo "== rockchip decoders present in configure =="
          grep -c "rkmpp" configure

      - name: Build RKMPP (librockchip_mpp)
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          PREFIX=/opt/rk/usr
          mkdir -p "$PREFIX"
          rm -rf mpp
          git clone -b jellyfin-mpp --depth 1 https://github.com/nyanmisaka/mpp.git mpp
          mkdir -p mpp/build
          cd mpp/build
          cmake \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TEST=OFF \
            -DHAVE_DRM=ON \
            ..
          make -j"$(nproc)"
          make install
          # Rockchip mpp installs libs and headers but no pkg-config file,
          # which ffmpeg's configure requires for --enable-rkmpp.
          mkdir -p "$PREFIX/lib/pkgconfig"
          printf '%s\n' \
            'prefix=/opt/rk/usr' \
            'libdir=${prefix}/lib' \
            'includedir=${prefix}/include' \
            '' \
            'Name: rockchip_mpp' \
            'Description: Rockchip Media Process Platform' \
            'Version: 1.0.0' \
            'Libs: -L${libdir} -lrockchip_mpp' \
            'Cflags: -I${includedir}/rockchip' \
            > "$PREFIX/lib/pkgconfig/rockchip_mpp.pc"
          echo "== librockchip_mpp installed =="
          ls "$PREFIX"/lib/librockchip_mpp.so*
          echo "== pkg-config file =="
          cat "$PREFIX"/lib/pkgconfig/rockchip_mpp.pc

      - name: Build RKRGA (librga)
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          PREFIX=/opt/rk/usr
          rm -rf rkrga
          git clone -b jellyfin-rga --depth 1 https://github.com/nyanmisaka/rk-mirrors.git rkrga
          cd rkrga
          printf '%s\n' \
            '[binaries]' \
            "c = 'aarch64-linux-gnu-gcc'" \
            "cpp = 'aarch64-linux-gnu-g++'" \
            "ar = 'aarch64-linux-gnu-ar'" \
            "strip = 'aarch64-linux-gnu-strip'" \
            "pkg-config = 'aarch64-linux-gnu-pkg-config'" \
            '' \
            '[host_machine]' \
            "system = 'linux'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" \
            > cross.txt
          meson setup . build \
            --cross-file cross.txt \
            --prefix="$PREFIX" \
            --libdir=lib \
            --buildtype=release \
            --default-library=shared \
            -Dcpp_args=-fpermissive \
            -Dlibdrm=false \
            -Dlibrga_demo=false
          ninja -C build
          meson install -C build
          # meson does install librga.pc; verify it is where ffmpeg looks
          mkdir -p "$PREFIX/lib/pkgconfig"
          if [ ! -f "$PREFIX/lib/pkgconfig/librga.pc" ]; then
            printf '%s\n' \
              'prefix=/opt/rk/usr' \
              'libdir=${prefix}/lib' \
              'includedir=${prefix}/include' \
              '' \
              'Name: librga' \
              'Description: Rockchip Raster 2D Graphic Acceleration Unit' \
              'Version: 2.1.0' \
              'Libs: -L${libdir} -lrga' \
              'Cflags: -I${includedir}' \
              > "$PREFIX/lib/pkgconfig/librga.pc"
          fi
          echo "== librga installed =="
          ls "$PREFIX"/lib/librga.so*
          echo "== pkg-config sees them =="
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" pkg-config --modversion rockchip_mpp
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" pkg-config --modversion librga

      - name: Configure and build FFmpeg with rkmpp
        working-directory: ${{ github.workspace }}
        env:
          PKG_CONFIG_PATH: /opt/rk/usr/lib/pkgconfig
        run: |
          set -eu
          PREFIX=/opt/rk/usr
          cd ffmpeg
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" \
          ./configure \
            --arch=aarch64 \
            --target-os=linux \
            --cross-prefix=aarch64-linux-gnu- \
            --enable-cross-compile \
            --prefix="$PREFIX" \
            --enable-shared \
            --disable-static \
            --disable-doc \
            --disable-debug \
            --enable-gpl \
            --enable-version3 \
            --enable-rkmpp \
            --enable-rkrga \
            --pkg-config=pkg-config \
            --pkg-config-flags=--static \
            --extra-cflags=-I/opt/rk/usr/include -I/opt/rk/usr/include/rockchip \
            --extra-ldflags=-L/opt/rk/usr/lib \
            --enable-neon 2>&1 | tail -30
          make -j"$(nproc)"

      - name: Install and verify rkmpp decoders
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          PREFIX=/opt/rk/usr
          cd ffmpeg
          make install
          echo "== installed ffmpeg =="
          ls -la "$PREFIX"/bin/ffmpeg
          echo "== rkmpp decoders compiled in =="
          strings "$PREFIX"/lib/libavcodec.so* | grep -oE "h264_rkmpp|hevc_rkmpp|vp9_rkmpp|av1_rkmpp" | sort -u | head
          echo "== hwaccels =="
          strings "$PREFIX"/lib/libavcodec.so* | grep -oE "^rkmpp$" | head -2

      - name: Package artifact
        run: |
          set -eu
          cd /opt/rk/usr
          tar -czf /tmp/ffmpeg-rk3566-rkmpp.tar.gz \
            bin/ffmpeg bin/ffprobe \
            lib/ \
            include/
          ls -la /tmp/ffmpeg-rk3566-rkmpp.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-rk3566-rkmpp
          path: /tmp/ffmpeg-rk3566-rkmpp.tar.gz
          if-no-files-found: error
