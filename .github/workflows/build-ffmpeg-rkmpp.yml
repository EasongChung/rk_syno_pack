name: Build Jellyfin FFmpeg (RK3566 / rkmpp)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_branch:
        description: 'nyanmisaka/jellyfin-ffmpeg branch with rockchip support'
        required: false
        default: 'next-rockchip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU and aarch64 base image
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes >/dev/null 2>&1 || true
          docker pull --platform linux/arm64 arm64v8/ubuntu:24.04

      - name: Build ffmpeg natively inside an aarch64 container
        env:
          FFMPEG_BRANCH: ${{ github.event.inputs.ffmpeg_branch }}
        run: |
          set -eu
          # Native aarch64 build: no cross toolchain, no synthesized .pc files,
          # apt pulls arm64 packages directly. This sidesteps the entire class
          # of "lib not found using pkg-config" issues that a cross build hits.
          mkdir -p /tmp/out
          cat > /tmp/build.sh <<'INNER'
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential pkg-config git wget ca-certificates \
            yasm nasm cmake ninja-build meson \
            libdrm-dev libudev-dev libsdl2-dev \
            zlib1g-dev

          PREFIX=/opt/rk/usr
          cd /tmp
          git clone -b "$FFMPEG_BRANCH" --depth 1 https://github.com/nyanmisaka/jellyfin-ffmpeg.git ffmpeg
          echo "== rockchip decoders present in configure =="
          grep -c rkmpp ffmpeg/configure

          # RKMPP
          git clone -b jellyfin-mpp --depth 1 https://github.com/nyanmisaka/mpp.git
          mkdir -p mpp/build && cd mpp/build
          cmake \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TEST=OFF \
            -DHAVE_DRM=ON \
            ..
          make -j"$(nproc)"
          make install
          cd /tmp

          # RKRGA
          git clone -b jellyfin-rga --depth 1 https://github.com/nyanmisaka/rk-mirrors.git rkrga
          cd rkrga
          meson setup . build \
            --prefix="$PREFIX" \
            --libdir=lib \
            --buildtype=release \
            --default-library=shared \
            -Dcpp_args=-fpermissive \
            -Dlibdrm=false \
            -Dlibrga_demo=false
          ninja -C build
          meson install -C build
          cd /tmp

          # ffmpeg itself
          cd ffmpeg
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" ./configure \
            --prefix="$PREFIX" \
            --enable-shared \
            --disable-static \
            --disable-doc \
            --disable-debug \
            --enable-gpl \
            --enable-version3 \
            --enable-rkmpp \
            --enable-rkrga \
            --enable-libdrm \
            --enable-neon
          make -j"$(nproc)"
          make install

          echo "== rkmpp decoders in the built libavcodec =="
          strings "$PREFIX"/lib/libavcodec.so* | grep -oE "h264_rkmpp|hevc_rkmpp|vp9_rkmpp|av1_rkmpp" | sort -u
          echo "== ffmpeg binary =="
          "$PREFIX"/bin/ffmpeg -hide_banner -version | head -2

          cd "$PREFIX"
          tar -czf /tmp/out/ffmpeg-rk3566-rkmpp.tar.gz bin/ffmpeg bin/ffprobe lib/ include/
          INNER

          docker run --rm --platform linux/arm64 \
            -v /tmp/build.sh:/build.sh:ro \
            -v /tmp/out:/out \
            arm64v8/ubuntu:24.04 bash /build.sh

          echo "== artifact =="
          ls -la /tmp/out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-rk3566-rkmpp
          path: /tmp/out/ffmpeg-rk3566-rkmpp.tar.gz
          if-no-files-found: error
