# meson 交叉编译配置参考（aarch64 / glibc）
#
# ⚠️ 本文件是**参考模板**，实际由 build-teflon.sh 运行时生成 cross.ini。
# 脚本会根据 sysroot 模式（apt/deb）和是否存在 multiarch 目录自动调整，
# 并写入单行数组（meson 1.11 的 machine file 不接受跨行数组）。
# 保留此文件仅为说明各字段含义，便于排查问题或手动调试。

# 场景 A：CI（apt cross sysroot）
#   sys_root = /usr/aarch64-linux-gnu
#   头与库都在 $sys_root/{include,lib}，无 multiarch 拆分
#
# 场景 B：本机 musl（自建 deb sysroot）
#   sys_root = <builddir>/sysroot
#   头：$sys_root/usr/include + $sys_root/usr/include/aarch64-linux-gnu（multiarch）
#   库：$sys_root/usr/lib/aarch64-linux-gnu

[binaries]
# CI 用真正的交叉编译器；本机原生 aarch64 时为空前缀（用 gcc/g++）
c         = 'aarch64-linux-gnu-gcc'
cpp       = 'aarch64-linux-gnu-g++'
ar        = 'aarch64-linux-gnu-ar'
strip     = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'

[host_machine]
system     = 'linux'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'

[properties]
sys_root = '/usr/aarch64-linux-gnu'
# 交叉编译时不能直接执行目标二进制，所有运行期检查都跳过
needs_exe_wrapper = true

[built-in options]
# 注意 1：数组必须写成**单行**。跨行数组会让 meson 报
#         "Malformed machine file: ... ']'"。
#
# 注意 2：c_args **不作用于 C++**，必须同时给 cpp_args，
#         否则编译 .cpp 时会丢 multiarch include 路径，报
#         "bits/libc-header-start.h: No such file or directory"。
c_args = ['--sysroot=/usr/aarch64-linux-gnu', '-isystem', '/usr/aarch64-linux-gnu/include', '-B', '/usr/aarch64-linux-gnu/lib/', '-L', '/usr/aarch64-linux-gnu/lib']
cpp_args = ['--sysroot=/usr/aarch64-linux-gnu', '-isystem', '/usr/aarch64-linux-gnu/include', '-B', '/usr/aarch64-linux-gnu/lib/', '-L', '/usr/aarch64-linux-gnu/lib']

c_link_args = ['--sysroot=/usr/aarch64-linux-gnu', '-Wl,-rpath-link,/usr/aarch64-linux-gnu/lib']
cpp_link_args = ['--sysroot=/usr/aarch64-linux-gnu', '-Wl,-rpath-link,/usr/aarch64-linux-gnu/lib']